<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10장 JWT 요청·응답 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF3; --panel:#FFFFFF; --ink:#1B2433; --muted:#596577; --line:#C6D0DC;
  --req:#2457C5; --req-soft:#DCE6FA; --res:#137A50; --res-soft:#D6EFE3;
  --db:#9A5B0C; --hl:#FFEFA8; --hl-ink:#3A2E00; --code:#F4F7FA; --rail:#B9C5D3;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",Consolas,"D2Coding",monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141922; --panel:#1C232E; --ink:#E4E9F0; --muted:#9AA5B4; --line:#323E4F;
    --req:#7AA2FF; --req-soft:#1F2E4F; --res:#4CC48C; --res-soft:#173A2B;
    --db:#E2A757; --hl:#4B4220; --hl-ink:#FFF1BF; --code:#161C25; --rail:#3A4759;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:120px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-0.01em}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:62ch}
.lead code{font-family:var(--mono);font-size:14px;color:var(--ink)}
button{font-family:var(--sans);font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
button:focus-visible{outline:3px solid var(--req);outline-offset:2px}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}

.grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px;align-items:start}

/* 왼쪽 : 구간 스택 */
.stage{position:sticky;top:16px}
.stack{position:relative;padding-left:40px}
.rail{position:absolute;left:17px;top:22px;bottom:22px;width:2px;background:var(--rail)}
.band{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;transition:border-color .3s, background .3s}
.band:last-child{margin-bottom:0}
.band .nm{font-weight:600;font-size:15px}
.band .sb{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.band::before{content:"";position:absolute;left:-28px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--panel);border:2px solid var(--rail)}
.band.db{border-style:dashed}
.band.active{border-width:2px;padding:9px 13px}
.band.active.req{border-color:var(--req);background:var(--req-soft)}
.band.active.res{border-color:var(--res);background:var(--res-soft)}
.band.active.none{border-color:var(--ink)}
.band.active::before{border-color:currentColor}
.band.active.req::before{background:var(--req);border-color:var(--req)}
.band.active.res::before{background:var(--res);border-color:var(--res)}
.band.active.none::before{background:var(--ink);border-color:var(--ink)}
.packet{position:absolute;left:10px;top:0;width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--panel);z-index:2;will-change:transform}
.packet.req{background:var(--req)}
.packet.res{background:var(--res)}
.packet.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--panel)}50%{box-shadow:0 0 0 4px var(--panel),0 0 0 9px var(--rail)}}
.legend{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .lq::before{background:var(--req)}
.legend .ls::before{background:var(--res)}
.legend .ln::before{background:var(--ink)}

/* 오른쪽 : 단계 설명 */
.detail{min-width:0}
.stephead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stepno{font-family:var(--mono);font-size:14px;color:var(--muted)}
.phase{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.phase.p0{color:var(--ink)}
.phase.p1{color:var(--req);border-color:var(--req)}
.phase.p2{color:var(--res);border-color:var(--res)}
h2{font-size:22px;line-height:1.35;margin:0 0 10px;font-weight:700}
ol.desc{margin:0 0 16px;padding-left:22px;max-width:70ch}
ol.desc li{margin:3px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.boxhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.boxhead .fname{font-family:var(--mono);font-weight:600;font-size:13.5px}
.boxhead .fpath{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.code{position:relative;background:var(--code);max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.code .ln{display:flex;white-space:pre;padding:0 12px 0 0;min-width:max-content}
.code .no{display:inline-block;width:40px;flex:0 0 40px;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.code .ln.hl{background:var(--hl);color:var(--hl-ink);box-shadow:inset 4px 0 0 var(--db)}
.code .ln.hl .no{color:var(--hl-ink)}
.empty{padding:16px 14px;color:var(--muted);font-size:14px;background:var(--code)}
.data pre{margin:0;padding:12px 14px;background:var(--code);font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.data table{border-collapse:collapse;margin:12px 14px;font-family:var(--mono);font-size:14px}
.data th,.data td{border:1px solid var(--line);padding:5px 14px;text-align:left}
.data th{background:var(--code)}
.browser{margin:12px 14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.browser .bar{background:var(--code);padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.browser .view{padding:12px;font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere;background:var(--panel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.tab{border-radius:8px 8px 0 0;border-bottom-width:3px;padding:8px 14px;font-weight:600;background:transparent}
.tab[aria-selected="true"]{border-color:var(--line);border-bottom-color:var(--ink);background:var(--panel)}
.scen{margin:0 0 16px;color:var(--muted);font-size:14.5px;max-width:90ch}
.scen code{font-family:var(--mono);font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* 아래 : 조작 바 */
.controls{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.controls .in{max-width:1180px;margin:0 auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns .sp{flex:1}
.dots{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}
.dots .grp{display:flex;gap:4px;align-items:center;margin-right:10px}
.dots .gl{font-size:12px;color:var(--muted);margin-right:4px}
.dot{width:26px;height:26px;padding:0;border-radius:6px;font-size:12px;font-family:var(--mono)}
.dot.done{background:var(--code)}
.dot.cur{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kbd{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr;gap:14px}
  .stage{position:static}
  .band{padding:6px 12px;margin-bottom:5px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
  .band.active{padding:5px 11px}
  .band .nm{font-size:14px}
  .band .sb{font-size:11.5px}
  .dots{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .dots .grp{flex:0 0 auto}
  .btns button{padding:7px 12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto}
  .tab{flex:0 0 auto;padding:7px 11px;font-size:13.5px}
  h1{font-size:21px}
  h2{font-size:19px}
  .code{font-size:12.5px;max-height:280px}
  .data pre{font-size:12.5px}
  .kbd{display:none}
  body{padding-bottom:118px}
}
@media (prefers-reduced-motion: reduce){
  .packet{transition:none !important}
  .packet.pulse,.fade{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>10장 JWT 로그인·토큰 요청·응답 흐름</h1>
      <p class="lead">chapter10.zip 원본 코드를 그대로 실행해서 얻은 응답과 SQL 로 따라갑니다. 10장 앱의 실제 로그인은 아직 <code>세션 + 폼 로그인</code>이고, JWT 는 토큰을 만드는 도구(TokenProvider, TokenService, /api/token)와 테스트까지 준비된 단계입니다. 토큰 필터 등록과 구글 로그인은 11장에서 이어집니다.</p>
    </div>
    <button type="button" class="primary" id="dl">HTML 파일 다운로드</button>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="시나리오"></div>
  <p class="scen" id="scen"></p>

  <div class="grid">
    <aside class="stage" aria-label="요청이 지나가는 구간">
      <div class="stack" id="stack">
        <div class="rail"></div>
        <div class="packet" id="packet" aria-hidden="true"></div>
      </div>
      <div class="legend"><span class="lq">요청 방향</span><span class="ls">응답 방향</span><span class="ln">준비·처리</span></div>
    </aside>

    <main class="detail">
      <div class="stephead">
        <span class="stepno" id="stepno"></span>
        <span class="phase" id="phase"></span>
      </div>
      <h2 id="title" aria-live="polite"></h2>
      <ol class="desc" id="desc"></ol>

      <section class="box" aria-label="실행되는 코드">
        <div class="boxhead"><div><div class="fname" id="fname"></div><div class="fpath" id="fpath"></div></div><span id="hlcount" class="fpath"></span></div>
        <div id="codewrap"></div>
      </section>

      <section class="box data" aria-label="오가는 데이터">
        <div class="boxhead"><span class="fname" id="dlabel"></span></div>
        <div id="dbody"></div>
      </section>
    </main>
  </div>
</div>

<nav class="controls" aria-label="단계 조작">
  <div class="in">
    <div class="btns">
      <button type="button" id="first">처음</button>
      <button type="button" id="prev">이전</button>
      <button type="button" class="primary" id="play">자동 재생</button>
      <button type="button" id="next">다음</button>
      <span class="sp"></span>
      <span class="kbd">키보드 ← → 로 이동</span>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</nav>

<script>
// 다운로드용 : 화면 요소를 추가하기 전, 처음 불러온 상태의 HTML 을 저장해 둡니다.
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const SCENARIOS = [{"nodes":[{"name":"브라우저","sub":"signup.html · login.html 폼"},{"name":"내장 톰캣","sub":"8080 포트"},{"name":"SecurityFilterChain","sub":"WebSecurityConfig (formLogin)"},{"name":"UserApiController","sub":"POST /user"},{"name":"UserService","sub":"비밀번호 BCrypt 암호화"},{"name":"UserDetailService","sub":"이메일로 회원 찾기"},{"db":1,"name":"H2 DB","sub":"users 표"}],"steps":[{"active":[0,1],"data":{"kind":"pre","label":"실제 HTTP 요청","text":"POST /user HTTP/1.1\nHost: localhost:8080\nContent-Type: application/x-www-form-urlencoded\n\nemail=kang@gmail.com&password=pw1234"},"desc":["signup.html 의 폼이 email, password 를 POST /user 로 보냅니다.","/user 는 permitAll 목록에 있어서 로그인하지 않아도 통과합니다."],"dir":"req","file":"config/WebSecurityConfig.java","hlLines":[36,37],"move":[0,1],"phase":"요청","title":"회원가입 폼 제출 : POST /user"},{"active":[2,3],"data":{"kind":"pre","label":"매개변수","text":"request.getEmail()    = \"kang@gmail.com\"\nrequest.getPassword() = \"pw1234\""},"desc":["@RequestBody 가 없으므로 JSON 이 아니라 폼 값이 AddUserRequest 에 채워집니다.","저장은 UserService 에 맡깁니다."],"dir":"req","file":"controller/UserApiController.java","hlLines":[19,21],"move":[2,3],"phase":"실행","title":"UserApiController.signup 실행"},{"active":[4,6],"data":{"kind":"pre","label":"실제 콘솔 로그","text":"insert into users (email, password, id)\nvalues (?, ?, default)"},"desc":["비밀번호를 BCrypt 로 암호화한 값($2a$10$…)만 저장합니다. 원래 비밀번호는 저장하지 않습니다."],"dir":"req","file":"service/UserService.java","hlLines":[104,106],"move":[4,6],"phase":"실행","title":"UserService.save : 암호화 후 INSERT"},{"active":[3,2,1,0],"data":{"kind":"pre","label":"실제 HTTP 응답","text":"HTTP/1.1 302\nLocation: http://localhost:8080/login\nContent-Length: 0\n\n(본문 없음)"},"desc":["redirect:/login 이므로 브라우저는 로그인 화면으로 이동합니다."],"dir":"res","file":"controller/UserApiController.java","hlLines":[22],"move":[3,0],"phase":"응답","title":"302 응답 : 로그인 화면으로"},{"active":[0,1,2],"data":{"kind":"pre","label":"실제 HTTP 요청","text":"POST /login HTTP/1.1\nHost: localhost:8080\nContent-Type: application/x-www const FILES = {"config/TokenAuthenticationFilter.java":"// 파일 위치: src/main/java/me/shinsunyoung/springbootdeveloper/config/TokenAuthenticationFilter.java\n//\n// ============================================================\n// 이 파일이 하는 일\n// ============================================================\n// 사용자가 요청을 보낼 때마다 \"토큰이 들어 있는지, 진짜인지\" 확인하는 검문소 역할을 합니다.\n// 토큰이 진짜이면, \"이 요청은 이 사용자가 보낸 것\"이라는 정보를 스프링 시큐리티에 저장합니다.\n// 토큰이 없거나 가짜이면 아무것도 저장하지 않고, 요청을 다음 단계로 그냥 넘깁니다.\n//\n// ============================================================\n// 요청 한 번이 지나가는 순서\n// ============================================================\n// 1. 요청이 들어오면 doFilterInternal() 이 실행됩니다.\n// 2. 요청 머리글(헤더)에서 Authorization 항목을 찾습니다.\n// 3. 그 값에서 \"Bearer \" 글자를 떼어 내고, 토큰 문자열만 꺼냅니다.\n// 4. 토큰이 진짜인지 확인합니다. (tokenProvider.validToken)\n// 5. 진짜이면 사용자 정보를 만들어 스프링 시큐리티 저장소에 넣습니다.\n// 6. 토큰 여부와 상관없이 다음 단계로 요청을 넘깁니다. (filterChain.doFilter)\n//\n// ============================================================\n// 꼭 알아둘 낱말\n// ============================================================\n// 필터(Filter)        : 요청이 목적지(컨트롤러)에 가기 전에 중간에서 검사하는 프로그램입니다.\n// 요청 헤더(Header)   : 요청과 함께 보내는 부가 정보입니다. 예) Authorization: Bearer 토큰값\n// Authorization       : \"이 요청을 보낸 사람은 누구인가\"를 증명하는 정보를 적는 헤더 이름입니다.\n// Bearer              : 토큰을 들고 왔다는 표시입니다. 토큰 앞에 \"Bearer \" 를 붙여서 보냅니다.\n// 문자열(String)      : 글자들의 묶음입니다. 예) \"Bearer abc\"\n// null                : \"값이 없다\"는 뜻입니다.\n// final               : 한 번 정한 값을 바꾸지 않겠다는 표시입니다.\n// static              : 객체 없이 클래스 이름으로 바로 쓰는 값이라는 표시입니다.\n// SecurityContextHolder: 스프링 시큐리티가 \"지금 이 요청의 사용자 정보\"를 보관하는 곳입니다.\n// 인증 정보(Authentication): \"이 요청을 보낸 사람이 누구인가\"를 담은 객체입니다.\n// OncePerRequestFilter: 요청 한 번당 필터가 딱 한 번만 실행되도록 도와주는 기본 클래스입니다.\n// 오버라이드(@Override): 부모 클래스에 있는 메서드를 우리 방식으로 다시 만든다는 표시입니다.\n//\n// ============================================================\n// 꼭 조심할 점\n// ============================================================\n// 1. 토큰이 없어도 필터는 요청을 막지 않고 다음 단계로 넘깁니다.\n//    실제로 막는 일은 시큐리티 설정 파일(WebOAuthSecurityConfig)이 합니다.\n//    예) 로그인이 필요한 /api 주소에 토큰 없이 들어오면 그 설정에서 401 응답을 줍니다.\n// 2. 이 클래스에는 @Component 표시가 없습니다.\n//    대신 설정 파일에서 @Bean 으로 직접 등록해서 씁니다.\n// 3. 토큰 검사 결과가 false 이면 인증 정보를 저장하지 않으므로, 그 요청은 로그인하지 않은 것으로 처리됩니다.\n// ============================================================\n\n// 이 파일이 속한 폴더 이름입니다. 설정(config)과 관련된 클래스들을 모아 두는 폴더입니다.\npackage me.shinsunyoung.springbootdeveloper.config;\n\nimport jakarta.servlet.FilterChain;                      // 필터들을 순서대로 이어 주는 연결 고리입니다. doFilter 로 다음 단계에 넘깁니다.\nimport jakarta.servlet.ServletException;                 // 서블릿(웹 요청 처리 프로그램)에서 생기는 오류를 나타내는 예외 타입입니다.\nimport jakarta.servlet.http.HttpServletRequest;          // 들어온 요청 정보를 담은 객체입니다. 헤더를 꺼낼 때 씁니다.\nimport jakarta.servlet.http.HttpServletResponse;         // 보낼 응답 정보를 담은 객체입니다. 이 필터에서는 바꾸지 않고 그대로 넘깁니다.\nimport lombok.RequiredArgsConstructor;                   // final 변수를 받는 생성자를 자동으로 만들어 주는 도구입니다.\nimport me.shinsunyoung.springbootdeveloper.config.jwt.TokenProvider; // 토큰을 확인하고 사용자 정보를 꺼내는 클래스입니다.\nimport org.springframework.security.core.Authentication; // 스프링 시큐리티의 인증 정보 타입입니다.\nimport org.springframework.security.core.context.SecurityContextHolder; // 스프링 시큐리티가 인증 정보를 보관하는 저장소입니다.\nimport org.springframework.web.filter.OncePerRequestFilter; // 요청 한 번당 한 번만 실행되는 필터를 만들 때 물려받는 기본 클래스입니다.\n\nimport java.io.IOException; // 입출력 과정에서 생기는 오류를 나타내는 예외 타입입니다.\n\n// @RequiredArgsConstructor\n//   뜻: 아래 final 변수(tokenProvider)를 받는 생성자를 자동으로 만들어 줍니다.\n//   이유: 스프링이 TokenProvider 객체를 이 생성자를 통해 넣어 주기 위해서입니다.\n@RequiredArgsConstructor\n\n// public class TokenAuthenticationFilter extends OncePerRequestFilter\n//   뜻: 이 클래스는 OncePerRequestFilter 를 물려받아서 만든 필터입니다.\n//   물려받으면 \"요청 한 번에 한 번만 실행되는 필터\"의 기본 틀을 그대로 쓸 수 있습니다.\npublic class TokenAuthenticationFilter extends OncePerRequestFilter {\n\n    // 토큰을 확인하고 사용자 정보를 꺼내는 일을 맡은 객체입니다.\n    // 스프링이 생성자를 통해 넣어 줍니다. 직접 new 로 만들지 않습니다.\n    // final 이므로 한 번 넣으면 다른 객체로 바꾸지 않습니다.\n    private final TokenProvider tokenProvider;\n\n    // 요청 헤더의 이름입니다. \"Authorization\" 이라는 이름의 헤더에 토큰이 들어 옵니다.\n    private final static String HEADER_AUTHORIZATION = \"Authorization\";\n\n    // 토큰 앞에 붙는 글자입니다. \"Bearer \" 는 뒤에 빈칸(공백) 한 칸까지 포함합니다.\n    // 헤더 값이 \"Bearer abc123\" 이면, 이 글자를 떼어 내고 \"abc123\" 만 토큰으로 씁니다.\n    private final static String TOKEN_PREFIX = \"Bearer \";\n\n    // @Override\n    //   뜻: 부모 클래스(OncePerRequestFilter)의 doFilterInternal 메서드를 우리 방식으로 다시 만든다는 표시입니다.\n    //   부모가 요청이 올 때마다 이 메서드를 자동으로 불러 줍니다.\n    @Override\n    protected void doFilterInternal(\n            HttpServletRequest request,   // 들어온 요청 정보입니다. 헤더를 꺼낼 때 씁니다.\n            HttpServletResponse response, // 보낼 응답 정보입니다. 이 필터에서는 건드리지 않고 그대로 넘깁니다.\n            FilterChain filterChain       // 다음 단계로 요청을 넘길 때 쓰는 연결 고리입니다.\n    ) throws ServletException, IOException {\n        // throws 는 \"이 메서드 안에서 이런 오류가 생길 수 있다\"고 미리 알려 주는 표시입니다.\n\n        // 요청 헤더에서 \"Authorization\" 항목의 값을 꺼냅니다.\n        // 예) \"Bearer eyJhbGci...\" 같은 글자입니다. 헤더가 없으면 null 이 됩니다.\n        String authorizationHeader = request.getHeader(HEADER_AUTHORIZATION);\n\n        // 헤더 값에서 \"Bearer \" 를 떼어 내고 토큰 문자열만 꺼냅니다.\n        // 헤더가 없거나 Bearer 로 시작하지 않으면 null 이 돌아옵니다.\n        String token = getAccessToken(authorizationHeader);\n\n        // 토큰이 진짜이고 기간이 남았는지 확인합니다.\n        // null 이 들어와도 validToken 은 예외를 잡아서 false 를 돌려주므로 안전합니다.\n        if (tokenProvider.validToken(token)) {\n\n            // 토큰이 진짜이면, 이 토큰으로 인증 정보(사용자 정보)를 만듭니다.\n            Authentication authentication = tokenProvider.getAuthentication(token);\n\n            // 만든 인증 정보를 스프링 시큐리티의 저장소에 넣습니다.\n            // 이렇게 해 두면 이 요청을 처리하는 동안 \"이 사용자가 로그인했다\"고 시큐리티가 알 수 있습니다.\n            // getContext() 는 저장소 전체를, setAuthentication() 은 그 안에 값을 넣는 명령입니다.\n            SecurityContextHolder.getContext().setAuthentication(authentication);\n        }\n\n        // 토큰이 진짜든 가짜든, 없든 상관없이 요청을 다음 단계로 넘깁니다.\n        // 이 줄을 빠뜨리면 요청이 여기서 멈춰 버립니다.\n        filterChain.doFilter(request, response);\n    }\n\n    // 헤더 값에서 토큰 문자열만 꺼내는 메서드입니다.\n    // 받는 값: authorizationHeader (헤더 전체 값, 예: \"Bearer abc123\")\n    // 돌려주는 값: 토큰 문자열(예: \"abc123\"), 또는 조건에 맞지 않으면 null\n    private String getAccessToken(String authorizationHeader) {\n\n        // 두 가지 조건을 모두 확인합니다.\n        //   조건 1) authorizationHeader != null : 헤더 값이 실제로 들어 있어야 합니다.\n        //   조건 2) startsWith(TOKEN_PREFIX)    : 값이 \"Bearer \" 로 시작해야 합니다.\n        // 두 조건이 모두 맞을 때만 토큰을 꺼냅니다.\n        if (authorizationHeader != null && authorizationHeader.startsWith(TOKEN_PREFIX)) {\n\n            // substring(TOKEN_PREFIX.length()) 는 앞의 \"Bearer \" 글자 수만큼 잘라 내고 나머지를 가져옵니다.\n            // 예) \"Bearer abc123\" 에서 앞 7글자(\"Bearer \")를 잘라 내면 \"abc123\" 이 남습니다.\n            return authorizationHeader.substring(TOKEN_PREFIX.length());\n        }\n\n        // 조건에 맞지 않으면 토큰이 없다는 뜻으로 null 을 돌려줍니다.\n        return null;\n    }\n}","config/WebSecurityConfig.java":"package me.shinsunyoung.springbootdeveloper.config;\n\nimport lombok.RequiredArgsConstructor;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;\nimport org.springframework.security.config.annotation.web.configuration.EnableWebSecurity;\nimport org.springframework.security.config.annotation.web.configuration.WebSecurityCustomizer;\nimport org.springframework.security.config.annotation.web.configurers.AbstractHttpConfigurer;\nimport org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\nimport org.springframework.security.crypto.password.PasswordEncoder;\nimport org.springframework.security.web.SecurityFilterChain;\n\nimport static org.springframework.boot.security.autoconfigure.web.servlet.PathRequest.toH2Console;\n\n\n@Configuration\n@EnableWebSecurity\n@RequiredArgsConstructor\npublic class WebSecurityConfig {\n\n    @Bean\n    public WebSecurityCustomizer configure() {\n        return (web) -> web.ignoring()\n                .requestMatchers(toH2Console())\n                .requestMatchers(\"/static/**\");\n    }\n\n    @Bean\n    public SecurityFilterChain filterChain(HttpSecurity http) throws Exception {\n        return http\n                .authorizeHttpRequests(auth -> auth\n                        .requestMatchers(\n                                \"/login\",\n                                \"/signup\",\n                                \"/user\"\n                        ).permitAll()\n                        .anyRequest().authenticated())\n                .formLogin(formLogin -> formLogin\n                        .loginPage(\"/login\")\n                        .defaultSuccessUrl(\"/articles\")\n                )\n                .logout(logout -> logout\n                        .logoutSuccessUrl(\"/login\")\n                        .invalidateHttpSession(true)\n                )\n                .csrf(AbstractHttpConfigurer::disable)\n                .build();\n    }\n\n    @Bean\n    public PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder();\n    }\n}","config/jwt/TokenProvider.java":"// 파일 위치: src/main/java/me/shinsunyoung/springbootdeveloper/config/jwt/TokenProvider.java\n//\n// ============================================================\n// 이 파일이 하는 일\n// ============================================================\n// 1. 로그인에 성공한 사람에게 \"토큰\"을 만들어 줍니다.\n// 2. 사람들이 보낸 토큰이 진짜인지 확인합니다.\n// 3. 토큰 안에 적힌 사용자 정보를 꺼냅니다.\n//\n// ============================================================\n// 전체 흐름 (이 순서대로 일어납니다)\n// ============================================================\n// 1. 로그인 성공 → generateToken() 으로 토큰을 만듭니다.\n// 2. 요청이 올 때 → validToken() 으로 토큰이 진짜인지 확인합니다.\n// 3. 토큰이 진짜면 → getAuthentication() 으로 \"이 요청을 보낸 사람\" 정보를 만듭니다.\n// 4. 사용자 번호가 필요하면 → getUserId() 로 토큰에서 번호를 꺼냅니다.\n// 5. 위 메서드들은 안에서 getClaims() 를 써서 토큰 내용을 읽습니다.\n//\n// ============================================================\n// 꼭 알아둘 낱말\n// ============================================================\n// 토큰       : 로그인 후 서버가 주는 긴 문자열입니다.\n// 토큰 내용  : 토큰 안에 적힌 정보입니다. 사용자 이메일, 만료 시각, 사용자 번호가 들어 있습니다.\n// 서명       : 토큰이 바뀌었는지 알아보는 확인 값입니다. 서버만 아는 비밀키로 만듭니다.\n// 비밀키     : 서버만 아는 암호 값입니다. 설정 파일(application.yml)에서 읽어 옵니다.\n// 만료 시각  : 이 시각이 지나면 토큰을 쓸 수 없습니다.\n// 변수(필드) : 값을 저장해 두는 곳입니다.\n// 메서드     : 어떤 일을 하는 묶음입니다. 이름 뒤에 ()가 붙습니다.\n// 생성자     : 객체를 처음 만들 때 한 번 실행되는 메서드입니다.\n// 객체       : 클래스로 만든 실제 물건입니다. 이 파일의 TokenProvider 객체는 스프링이 만들어 줍니다.\n// 어노테이션(@) : 클래스나 메서드 위에 붙여서 스프링에게 역할을 알려 주는 표시입니다.\n// 예외       : 실행 중 문제가 생겼다는 신호입니다. 예외가 생기면 그 아래 줄은 실행되지 않습니다.\n// try-catch  : try 안에서 예외가 생기면 catch 안의 코드로 넘어가는 문법입니다.\n// 인증 정보  : 스프링이 \"지금 요청한 사람이 누구인가\"를 저장해 두는 객체입니다.\n// 권한       : 사용자가 할 수 있는 일을 나타내는 이름표입니다. 여기서는 ROLE_USER 하나입니다.\n//\n// ============================================================\n// 꼭 조심할 점\n// ============================================================\n// 1. User라는 이름의 클래스가 두 개 있습니다.\n//    - 우리 프로젝트의 User: me.shinsunyoung.springbootdeveloper.domain.User\n//    - 스프링 시큐리티의 User: org.springframework.security.core.userdetails.User\n//    이 파일에서는 헷갈리지 않도록 두 번째 User를 전체 이름으로 적었습니다.\n// 2. 이 코드는 jjwt 0.9.1 라이브러리 기준입니다. 다른 버전에서는 메서드 이름이 다를 수 있습니다.\n// 3. getAuthentication, getUserId 는 validToken 이 true 를 돌려준 뒤에 불러야 합니다.\n// ============================================================\n\n// 패키지 이름: 이 파일이 속한 폴더 이름입니다. 폴더 경로와 같아야 합니다.\npackage me.shinsunyoung.springbootdeveloper.config.jwt;\n\nimport io.jsonwebtoken.Claims;                                                       // 토큰 내용(클레임)을 읽을 때 쓰는 클래스입니다.\nimport io.jsonwebtoken.Header;                                                       // 토큰 머리 부분에 넣을 항목 이름과 값을 모아 둔 클래스입니다.\nimport io.jsonwebtoken.Jwts;                                                         // 토큰을 만들고 읽을 때 시작점이 되는 클래스입니다.\nimport io.jsonwebtoken.SignatureAlgorithm;                                           // 서명을 만드는 방식(HS256)을 고르는 클래스입니다.\nimport lombok.RequiredArgsConstructor;                                               // 생성자 코드를 자동으로 만들어 주는 도구입니다.\nimport me.shinsunyoung.springbootdeveloper.domain.User;                              // 우리 프로젝트의 사용자 클래스입니다. 데이터베이스와 연결되어 있습니다.\nimport org.springframework.security.authentication.UsernamePasswordAuthenticationToken; // 스프링 시큐리티가 인증된 사용자 정보를 담을 때 쓰는 클래스입니다.\nimport org.springframework.security.core.Authentication;                             // 인증 정보를 나타내는 타입입니다. getAuthentication 의 결과 타입입니다.\nimport org.springframework.security.core.authority.SimpleGrantedAuthority;           // 권한 이름표 하나를 만드는 클래스입니다. 예: ROLE_USER\nimport org.springframework.stereotype.Service;                                       // 이 클래스를 스프링이 관리하는 객체로 등록하는 표시입니다.\nimport java.time.Duration;                                                           // \"2시간\", \"14일\"처럼 기간을 나타내는 클래스입니다.\nimport java.util.Collections;                                                        // 값 하나짜리 목록 같은 것을 쉽게 만드는 도구 모음입니다.\nimport java.util.Date;                                                               // 날짜와 시각을 나타내는 클래스입니다.\nimport java.util.Set;                                                                // 같은 값이 두 번 들어가지 않는 목록입니다.\n\n// @RequiredArgsConstructor\n//   뜻: 아래에 있는 final 변수(jwtProperties)를 받는 생성자를 자동으로 만들어 줍니다.\n//   이유: 스프링이 설정값 객체를 이 생성자를 통해 넣어 주기 때문입니다.\n@RequiredArgsConstructor\n\n// @Service\n//   뜻: 이 클래스의 객체를 스프링이 하나 만들어 관리하게 합니다.\n//   이유: 다른 클래스들이 이 객체를 직접 만들지 않고 받아서 쓸 수 있게 하기 위해서입니다.\n@Service\npublic class TokenProvider {\n\n    // 설정값(발급자 이름, 비밀키)을 담아 두는 변수입니다.\n    // 값은 application.yml 파일의 jwt 항목에서 읽어 옵니다.\n    // 비밀키를 코드 안에 직접 쓰지 않기 위해 설정 파일에 둡니다.\n    // final 은 한 번 넣으면 다른 값으로 바꾸지 않는다는 뜻입니다.\n    private final JwtProperties jwtProperties;\n\n    // ============================================================\n    // [1] 토큰 만들기: generateToken\n    // 누가 부르나요: 로그인 성공 후 (TokenService, OAuth2SuccessHandler)\n    // 받는 값: user(토큰의 주인), expiredAt(토큰이 유효한 기간)\n    // 돌려주는 값: 완성된 토큰 문자열\n    // ============================================================\n    public String generateToken(User user, Duration expiredAt) {\n\n        // 지금 이 순간의 날짜와 시각을 만듭니다.\n        // 만료 시각을 계산할 때 기준이 되는 시각입니다.\n        Date now = new Date();\n\n        // 만료 시각을 계산해서 makeToken 에 넘깁니다.\n        // 계산 순서:\n        //   1) now.getTime() 은 지금 시각을 숫자로 바꿉니다. (밀리초 단위, 1000분의 1초)\n        //   2) expiredAt.toMillis() 는 유효 기간을 같은 단위의 숫자로 바꿉니다.\n        //   3) 두 숫자를 더하면 \"지금부터 유효 기간이 지난 시각\"의 숫자가 됩니다.\n        //   4) new Date(숫자) 는 그 숫자를 날짜로 바꿉니다. 이것이 만료 시각입니다.\n        // makeToken 이 만든 토큰을 그대로 돌려줍니다.\n        return makeToken(new Date(now.getTime() + expiredAt.toMillis()), user);\n    }\n\n    // ============================================================\n    // [2] 토큰 조립하기: makeToken (이 파일 안에서만 씁니다)\n    // 누가 부르나요: generateToken\n    // 받는 값: expiry(만료 시각), user(토큰의 주인)\n    // 돌려주는 값: 토큰 문자열\n    // ============================================================\n    private String makeToken(Date expiry, User user) {\n\n        // 발급 시각으로 쓸 현재 시각을 다시 만듭니다.\n        Date now = new Date();\n\n        // 토큰을 한 줄씩 조립합니다.\n        // 각 줄 끝의 점(.)은 \"다음 항목을 이어서 넣겠다\"는 뜻입니다.\n        // 마지막 compact() 가 모든 항목을 합쳐서 토큰 문자열 하나로 만듭니다.\n        return Jwts.builder()\n\n                // 헤더에 \"이 토큰은 JWT 형식이다\"라는 표시를 넣습니다.\n                .setHeaderParam(Header.TYPE, Header.JWT_TYPE)\n\n                // 토큰을 만든 곳(발급자)을 넣습니다. 값은 설정 파일의 jwt.issuer 입니다.\n                .setIssuer(jwtProperties.getIssuer())\n\n                // 토큰을 만든 시각(발급 시각)을 넣습니다.\n                .setIssuedAt(now)\n\n                // 토큰의 만료 시각을 넣습니다. 이 시각이 지나면 토큰을 쓸 수 없습니다.\n                .setExpiration(expiry)\n\n                // 토큰의 주인(사용자 이메일)을 넣습니다.\n                .setSubject(user.getEmail())\n\n                // 사용자 번호를 \"id\"라는 이름으로 넣습니다.\n                // 나중에 getUserId() 로 이 번호를 꺼냅니다.\n                .claim(\"id\", user.getId())\n\n                // 비밀키와 HS256 방식으로 서명을 만듭니다.\n                // 서명 덕분에 토큰이 바뀌었는지 알 수 있습니다.\n                .signWith(SignatureAlgorithm.HS256, jwtProperties.getSecretKey())\n\n                // 지금까지 넣은 항목을 모두 합쳐서 토큰 문자열 하나로 만듭니다.\n                .compact();\n    }\n\n    // ============================================================\n    // [3] 토큰이 진짜인지 확인하기: validToken\n    // 누가 부르나요: 요청이 올 때마다 (TokenAuthenticationFilter), TokenService\n    // 받는 값: token(요청으로 받은 토큰 문자열)\n    // 돌려주는 값: 진짜이고 기간이 남았으면 true, 아니면 false\n    // ============================================================\n    public boolean validToken(String token) {\n\n        // try 안의 코드는 문제가 생길 수 있으니 \"한번 해 봐라\"라는 뜻입니다.\n        // 문제가 생기면 아래 catch 로 넘어갑니다.\n        try {\n\n            // 토큰을 읽는 JwtParser객체 도구를 준비합니다.\n            Jwts.parser()\n\n                    // 서명을 확인할 때 쓸 비밀키를 알려 줍니다.\n                    // 토큰을 만들 때 쓴 비밀키와 같은 값이어야 확인이 됩니다.\n                    .setSigningKey(jwtProperties.getSecretKey())\n\n                    // 토큰을 실제로 읽으면서 두 가지를 확인합니다.\n                    //   1) 서명이 맞는가? (토큰이 바뀌지 않았는가?)\n                    //   2) 만료 시각이 지나지 않았는가? (기간이 남았는가?)\n                    // 둘 중 하나라도 틀리면 예외가 생기고, 아래 return true 는 실행되지 않습니다.\n                    .parseClaimsJws(token);\n\n            // 예외 없이 여기까지 왔다면 두 가지 확인을 모두 통과한 것입니다.\n            return true;\n\n        } catch (Exception e) {\n            // 예외가 생기면 이 줄이 실행됩니다.\n            // 토큰이 바뀌었거나, 기간이 지났거나, 형식이 깨졌을 때 여기로 옵니다.\n            // 이 코드는 실패 이유를 나누지 않고 모두 false 로 처리합니다.\n            return false;\n        }\n    }\n\n    // ============================================================\n    // [4] 스프링이 알아보는 \"인증 정보\" 만들기: getAuthentication\n    // 누가 부르나요: TokenAuthenticationFilter (토큰을 확인한 뒤에만 부릅니다)\n    // 받는 값: token(확인이 끝난 토큰 문자열)\n    // 돌려주는 값: 스프링 시큐리티의 인증 정보 객체\n    // 주의: 이 메서드는 토큰을 다시 확인하지 않습니다. validToken 을 먼저 부르세요.\n    // ============================================================\n    public Authentication getAuthentication(String token) {\n\n        // 토큰 내용을 꺼냅니다. 아래에서 이메일을 꺼내기 위해 씁니다.\n        Claims claims = getClaims(token);\n\n        // 권한 목록을 만듭니다.\n        // 이 프로젝트의 모든 사용자는 ROLE_USER 권한 하나를 가집니다.\n        // ROLE_ 로 시작하는 이름은 스프링 시큐리티가 정한 규칙입니다.\n        Set<SimpleGrantedAuthority> authorities =\n                Collections.singleton(new SimpleGrantedAuthority(\"ROLE_USER\"));\n\n        // 스프링 시큐리티가 사용자를 나타낼 때 쓰는 객체를 만듭니다.\n        // 주의: 이것은 우리 프로젝트의 User 가 아니라 스프링 시큐리티의 User 입니다.\n        // 값은 세 가지입니다.\n        //   첫째(이름): 토큰 안의 이메일입니다. claims.getSubject() 가 꺼내 줍니다.\n        //   둘째(비밀번호): 빈 문자열(\"\")입니다. 토큰으로 이미 확인했으므로 비밀번호는 필요 없습니다.\n        //   셋째(권한): 위에서 만든 ROLE_USER 목록입니다.\n        org.springframework.security.core.userdetails.User principal =\n                new org.springframework.security.core.userdetails.User(claims.getSubject(), \"\", authorities);\n\n        // 인증 정보 객체를 만들어 돌려줍니다.\n        // 값은 세 가지입니다.\n        //   첫째(누구인가): 위에서 만든 사용자 객체\n        //   둘째(인증 수단): 토큰 문자열\n        //   셋째(권한): ROLE_USER 목록\n        // 이 객체는 TokenAuthenticationFilter 가 받아서 스프링에 저장합니다.\n        return new UsernamePasswordAuthenticationToken(principal, token, authorities);\n    }\n\n    // ============================================================\n    // [5] 사용자 번호 꺼내기: getUserId\n    // 누가 부르나요: 토큰을 확인한 뒤, 사용자 번호가 필요할 때\n    // 받는 값: token(확인이 끝난 토큰 문자열)\n    // 돌려주는 값: 사용자 번호(Long 타입의 숫자)\n    // ============================================================\n    public Long getUserId(String token) {\n\n        // 토큰 내용을 꺼냅니다.\n        Claims claims = getClaims(token);\n\n        // 토큰 내용에서 이름이 \"id\"인 값을 찾아 숫자(Long)로 꺼냅니다.\n        // 토큰을 만들 때 .claim(\"id\", user.getId()) 로 넣어 둔 값입니다.\n        // 값이 없으면 null 이 나올 수 있습니다.\n        return claims.get(\"id\", Long.class);\n    }\n\n    // ============================================================\n    // [보조] getClaims: 토큰 내용만 꺼내는 메서드 (이 파일 안에서만 씁니다)\n    // 누가 부르나요: getAuthentication, getUserId\n    // 받는 값: token(토큰 문자열)\n    // 돌려주는 값: 토큰 내용(Claims)\n    // 주의: 이 메서드도 서명을 확인합니다. 토큰이 바뀌었으면 여기서 예외가 생깁니다.\n    // ============================================================\n    private Claims getClaims(String token) {\n        return Jwts.parser()\n\n                // 서명을 확인할 비밀키를 알려 줍니다.\n                .setSigningKey(jwtProperties.getSecretKey())\n\n                // 토큰을 읽으면서 서명과 기간을 확인합니다.\n                // 확인에 실패하면 예외가 생기고, 아래 .getBody() 는 실행되지 않습니다.\n                .parseClaimsJws(token)\n\n                // 확인을 통과한 토큰에서 \"내용\" 부분만 꺼냅니다.\n                // 자바에서는 이 내용을 body 라고 부릅니다.\n                .getBody();\n    }\n}","controller/BlogApiController.java":"package me.shinsunyoung.springbootdeveloper.controller;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\nimport me.shinsunyoung.springbootdeveloper.dto.*;\nimport me.shinsunyoung.springbootdeveloper.service.BlogService;\nimport me.shinsunyoung.springbootdeveloper.service.ThumbnailGeneratorService;\nimport me.shinsunyoung.springbootdeveloper.service.WritingAssistantService;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.*;\n\nimport java.util.List;\n\n@RequiredArgsConstructor\n@RestController\npublic class BlogApiController {\n\n    private final BlogService blogService;\n    private final WritingAssistantService writingAssistantService;\n    private final ThumbnailGeneratorService thumbnailGeneratorService;\n\n    @PostMapping(\"/api/articles\")\n    public ResponseEntity<Article> addArticle(@RequestBody AddArticleRequest request) {\n        Article savedArticle = blogService.save(request);\n        return ResponseEntity.status(HttpStatus.CREATED)\n                .body(savedArticle);\n    }\n\n    @GetMapping(\"/api/articles\")\n    public ResponseEntity<List<ArticleResponse>> findAllArticles() {\n        List<ArticleResponse> articles = blogService.findAll()\n                .stream()\n                .map(ArticleResponse::new)\n                .toList();\n        return ResponseEntity.ok()\n                .body(articles);\n    }\n\n    @GetMapping(\"/api/articles/{id}\")\n    public ResponseEntity<ArticleResponse> findArticle(@PathVariable long id) {\n        Article article = blogService.findById(id);\n        return ResponseEntity.ok()\n                .body(new ArticleResponse(article));\n    }\n\n    @DeleteMapping(\"/api/articles/{id}\")\n    public ResponseEntity<Void> deleteArticle(@PathVariable long id) {\n        blogService.delete(id);\n        return ResponseEntity.ok()\n                .build();\n    }\n\n    @PutMapping(\"/api/articles/{id}\")\n    public ResponseEntity<Article> updateArticle(@PathVariable long id,\n                                                 @RequestBody UpdateArticleRequest request) {\n        Article updatedArticle = blogService.update(id, request);\n        return ResponseEntity.ok()\n                .body(updatedArticle);\n    }\n\n    @PostMapping(\"/api/ai-suggestions\")\n    public ResponseEntity<WritingSuggestionsResponse> writingAssist(@RequestBody WritingSuggestionRequest request) {\n        WritingSuggestionsResponse response = writingAssistantService.getWritingAssist(request);\n\n        return ResponseEntity.ok()\n                .body(response);\n    }\n\n    @PostMapping(\"/api/ai-thumbnails\")\n    public ResponseEntity<GeneratorThumbnailResponse> thumbnailGenerator(@RequestBody GeneratorThumbnailRequest request) {\n        GeneratorThumbnailResponse response = thumbnailGeneratorService.generateThumbnail(request);\n\n        return ResponseEntity.ok()\n                .body(response);\n    }\n}","controller/TokenApiController.java":"// 파일 위치: src/main/java/me/shinsunyoung/springbootdeveloper/controller/TokenApiController.java\n//\n// ============================================================\n// 이 파일이 하는 일\n// ============================================================\n// 밖에서 \"/api/token\" 주소로 요청이 오면, 새 액세스 토큰을 만들어 응답으로 돌려주는 입구입니다.\n// 실제 토큰을 만드는 일은 이 파일이 하지 않고, TokenService 에게 맡깁니다.\n// 이 파일은 \"요청을 받고, 맡기고, 결과를 응답으로 보내는 일\"만 합니다.\n//\n// ============================================================\n// 요청 한 번이 지나가는 순서\n// ============================================================\n// 1. 사용자가 POST /api/token 으로 리프레시 토큰을 보냅니다.\n// 2. 스프링이 요청 내용을 CreateAccessTokenRequest 객체로 옮겨 줍니다.\n// 3. createNewAccessToken() 이 실행되어 TokenService 에게 토큰 만들기를 맡깁니다.\n// 4. TokenService 가 새 액세스 토큰 문자열을 돌려줍니다.\n// 5. 그 토큰을 응답 객체에 담아 201(Created) 상태 코드와 함께 돌려줍니다.\n//\n// ============================================================\n// 꼭 알아둘 낱말\n// ============================================================\n// 컨트롤러(Controller) : 요청을 맨 처음 받는 입구 클래스입니다. 받은 일을 다른 곳에 맡기고 결과를 응답합니다.\n// 요청(Request)        : 밖에서 서버로 보내는 메시지입니다.\n// 응답(Response)       : 서버가 요청에 대해 돌려주는 메시지입니다.\n// POST                 : 새 데이터를 만들어 달라고 요청하는 방식입니다.\n// 주소(경로)           : \"/api/token\" 처럼 요청이 가는 곳의 이름입니다.\n// JSON                 : 데이터를 글자로 적는 약속된 모양입니다. 예) {\"refreshToken\": \"...\"}\n// 상태 코드            : 요청 결과를 숫자로 알려 주는 표시입니다. 201 은 \"새로 만들었다\"는 뜻입니다.\n// ResponseEntity       : 응답의 상태 코드와 내용을 함께 담는 객체입니다.\n// 어노테이션(@)        : 클래스나 메서드 위에 붙여서 역할을 알려 주는 표시입니다.\n//\n// ============================================================\n// 꼭 조심할 점\n// ============================================================\n// 1. 이 컨트롤러에는 로그인 검사 코드가 없습니다.\n//    이 주소(\"/api/token\")는 WebOAuthSecurityConfig 에서 누구나 쓸 수 있게(permitAll) 열어 두었기 때문입니다.\n//    토큰 없이도 호출할 수 있어야, 액세스 토큰이 만료된 사용자가 새 토큰을 받을 수 있습니다.\n// 2. 리프레시 토큰이 틀리면 TokenService 에서 오류가 나고, 이 메서드까지 응답이 오지 않습니다.\n// ============================================================\n\n// 이 파일이 속한 폴더 이름입니다. 요청을 받는 입구 클래스들을 모아 두는 폴더입니다.\npackage me.shinsunyoung.springbootdeveloper.controller;\n\nimport lombok.RequiredArgsConstructor;                                              // final 변수를 받는 생성자를 자동으로 만들어 주는 도구입니다.\nimport me.shinsunyoung.springbootdeveloper.dto.CreateAccessTokenRequest;           // 요청으로 받은 리프레시 토큰을 담는 그릇(DTO)입니다.\nimport me.shinsunyoung.springbootdeveloper.dto.CreateAccessTokenResponse;          // 응답으로 보낼 새 액세스 토큰을 담는 그릇(DTO)입니다.\nimport me.shinsunyoung.springbootdeveloper.service.TokenService;                    // 토큰 만들기 업무를 맡길 서비스 클래스입니다.\nimport org.springframework.http.HttpStatus;                                         // 201, 404 같은 상태 코드 이름을 모아 둔 도구입니다. 예) HttpStatus.CREATED\nimport org.springframework.http.ResponseEntity;                                     // 응답의 상태 코드와 내용을 함께 담는 객체입니다.\nimport org.springframework.web.bind.annotation.PostMapping;                         // POST 요청을 특정 주소의 메서드와 연결하는 표시입니다.\nimport org.springframework.web.bind.annotation.RequestBody;                         // 요청 내용(JSON)을 자바 객체로 바꿔서 넣어 달라는 표시입니다.\nimport org.springframework.web.bind.annotation.RestController;                      // 이 클래스가 요청을 받는 입구이며, 결과를 데이터(JSON)로 돌려준다는 표시입니다.\n\n// @RequiredArgsConstructor\n//   뜻: 아래 final 변수(tokenService)를 받는 생성자를 자동으로 만들어 줍니다.\n//   이유: 스프링이 TokenService 객체를 이 생성자를 통해 넣어 주기 위해서입니다.\n@RequiredArgsConstructor\n\n// @RestController\n//   뜻: 이 클래스가 요청을 받는 입구라는 표시입니다.\n//   이유: 메서드가 돌려주는 값을 화면 파일이 아니라 데이터(JSON) 형태로 응답에 담아 보내게 하기 위해서입니다.\n@RestController\npublic class TokenApiController {\n\n    // 토큰 만들기 업무를 맡을 서비스입니다. 스프링이 넣어 줍니다.\n    // 이 컨트롤러는 실제 토큰 계산을 하지 않고, 이 객체에게 일을 맡깁니다.\n    private final TokenService tokenService;\n\n    // @PostMapping(\"/api/token\")\n    //   뜻: POST 방식으로 \"/api/token\" 주소에 요청이 오면 아래 메서드가 실행됩니다.\n    //   POST 는 새 데이터를 만들어 달라는 요청 방식입니다. 여기서는 새 액세스 토큰을 만듭니다.\n    @PostMapping(\"/api/token\")\n\n    // ============================================================\n    // createNewAccessToken: 요청을 받아 새 액세스 토큰을 응답합니다.\n    // 받는 값: request(요청 내용을 옮겨 담은 CreateAccessTokenRequest 객체)\n    // 돌려주는 값: 201(Created) 상태 코드와 새 액세스 토큰이 담긴 응답\n    // ============================================================\n    public ResponseEntity<CreateAccessTokenResponse> createNewAccessToken(\n            // @RequestBody\n            //   뜻: 요청 본문(JSON)을 CreateAccessTokenRequest dto객체로 자동으로 바꿔서 넣어 줍니다.\n            //   예) {\"refreshToken\": \"abc\"} → request.getRefreshToken() 이 \"abc\" 를 돌려줍니다.\n            @RequestBody CreateAccessTokenRequest request) {\n\n        // [1단계] TokenService 에게 새 액세스 토큰 만들기를 맡깁니다.\n        // request.getRefreshToken() : 요청에서 받은 리프레시 토큰 문자열을 꺼냅니다.\n        // tokenService.createNewAccessToken(...) : 그 토큰을 확인하고 새 액세스 토큰을 만들어 돌려줍니다.\n        // 결과 문자열을 newAccessToken 이라는 변수에 담습니다.\n        String newAccessToken = tokenService.createNewAccessToken(request.getRefreshToken());\n\n        // [2단계] 새 토큰을 응답으로 만들어 돌려줍니다.\n        // ResponseEntity.status(HttpStatus.CREATED)\n        //   상태 코드를 201(Created) 로 정합니다. \"새로 무엇인가를 만들었다\"는 뜻입니다.\n        // .body(new CreateAccessTokenResponse(newAccessToken))\n        //   응답 내용으로 새 토큰을 담은 응답 객체를 넣습니다.\n        // 이렇게 만든 응답이 이 메서드의 결과가 되어 사용자에게 돌아갑니다.\n        return ResponseEntity.status(HttpStatus.CREATED)\n                .body(new CreateAccessTokenResponse(newAccessToken));\n    }\n}","controller/UserApiController.java":"package me.shinsunyoung.springbootdeveloper.controller;\n\nimport jakarta.servlet.http.HttpServletRequest;\nimport jakarta.servlet.http.HttpServletResponse;\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.dto.AddUserRequest;\nimport me.shinsunyoung.springbootdeveloper.service.UserService;\nimport org.springframework.security.core.context.SecurityContextHolder;\nimport org.springframework.security.web.authentication.logout.SecurityContextLogoutHandler;\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PostMapping;\n\n@RequiredArgsConstructor\n@Controller\npublic class UserApiController {\n    private final UserService userService;\n\n    @PostMapping(\"/user\")\n    public String signup(AddUserRequest request) {\n        userService.save(request);\n        return \"redirect:/login\";\n    }\n\n    @GetMapping(\"/logout\")\n    public String logout(HttpServletRequest request, HttpServletResponse response) {\n        new SecurityContextLogoutHandler().logout(request, response,\n                SecurityContextHolder.getContext().getAuthentication());\n        return \"redirect:/login\";\n    }\n}","service/RefreshTokenService.java":"// 파일 위치: src/main/java/me/shinsunyoung/springbootdeveloper/service/RefreshTokenService.java\n//\n// ============================================================\n// 이 파일이 하는 일\n// ============================================================\n// 리프레시 토큰을 데이터베이스에서 찾아 주는 업무 처리 파일입니다.\n// 지금은 한 가지 일만 합니다. 토큰 문자열을 받아서, 저장된 리프레시 토큰 줄을 찾아 돌려줍니다.\n//\n// ============================================================\n// 전체 흐름\n// ============================================================\n// 1. 사용자가 리프레시 토큰을 보냅니다.\n// 2. findByRefreshToken() 이 그 토큰 문자열로 데이터베이스를 검색합니다.\n// 3. 찾으면 그 줄(RefreshToken 객체)을 돌려줍니다.\n// 4. 찾지 못하면 오류를 던집니다.\n//\n// ============================================================\n// 꼭 알아둘 낱말\n// ============================================================\n// 서비스(Service)  : 업무 처리 순서를 담당하는 클래스입니다.\n// 리프레시 토큰     : 액세스 토큰이 만료되었을 때 새 액세스 토큰을 받기 위해 쓰는 토큰입니다.\n// Repository        : 데이터베이스와 주고받는 일을 맡은 도구입니다.\n// Optional          : \"값이 있을 수도, 없을 수도 있다\"는 뜻을 담은 타입입니다.\n// 람다(() -> ...)   : \"값이 없을 때 실행할 일\"을 짧게 적은 한 줄짜리 코드입니다.\n// 예외(Exception)   : 실행 중 생긴 문제 신호입니다. 던져지면 그 아래 줄은 실행되지 않습니다.\n//\n// ============================================================\n// 꼭 조심할 점\n// ============================================================\n// 1. 이 클래스는 토큰을 찾기만 합니다. 토큰이 진짜인지(기간, 서명)는 확인하지 않습니다.\n//    토큰의 진위 확인은 TokenProvider.validToken() 이 따로 맡습니다.\n// 2. 찾지 못했을 때 던지는 오류 메시지는 \"Unexpected token\"(예상하지 못한 토큰)입니다.\n// ============================================================\n\n// 이 파일이 속한 폴더 이름입니다. 업무 처리 클래스들을 모아 두는 폴더입니다.\npackage me.shinsunyoung.springbootdeveloper.service;\n\nimport lombok.RequiredArgsConstructor;                                              // final 변수를 받는 생성자를 자동으로 만들어 주는 도구입니다.\nimport me.shinsunyoung.springbootdeveloper.domain.RefreshToken;                    // 리프레시 토큰 한 줄을 나타내는 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.repository.RefreshTokenRepository;      // refresh_token 표에서 저장하고 찾는 도구입니다.\nimport org.springframework.stereotype.Service;                                      // 이 클래스를 스프링이 관리하는 서비스 객체로 등록하는 표시입니다.\n\n// @RequiredArgsConstructor\n//   뜻: 아래 final 변수(refreshTokenRepository)를 받는 생성자를 자동으로 만들어 줍니다.\n//   이유: 스프링이 RefreshTokenRepository 객체를 이 생성자를 통해 넣어 주기 위해서입니다.\n@RequiredArgsConstructor\n\n// @Service\n//   뜻: 이 클래스의 객체를 스프링이 하나 만들어 관리하게 합니다.\n//   이유: TokenService 같은 다른 클래스가 이 객체를 받아서 쓸 수 있게 하기 위해서입니다.\n@Service\npublic class RefreshTokenService {\n\n    // 리프레시 토큰을 데이터베이스에서 검색하는 도구입니다.\n    // 스프링이 넣어 줍니다. final 이라 한 번 넣으면 바꾸지 않습니다.\n    private final RefreshTokenRepository refreshTokenRepository;\n\n    // ============================================================\n    // findByRefreshToken: 토큰 문자열로 리프레시 토큰 줄을 찾아 돌려줍니다.\n    // 받는 값: refreshToken(찾고 싶은 토큰 문자열)\n    // 돌려주는 값: 찾은 RefreshToken 객체 (그 안에 사용자 번호도 들어 있습니다)\n    // 찾지 못하면: \"Unexpected token\" 오류를 던집니다.\n    // ============================================================\n    public RefreshToken findByRefreshToken(String refreshToken) {\n\n        // 아래 줄을 나눠서 보겠습니다.\n        //\n        // refreshTokenRepository.findByRefreshToken(refreshToken)\n        //   데이터베이스에서 refresh_token 열의 값이 refreshToken 과 같은 줄을 찾습니다.\n        //   찾으면 그 줄을, 없으면 빈 결과(Optional)를 돌려줍니다.\n        //\n        // .orElseThrow(() -> new IllegalArgumentException(\"Unexpected token\"))\n        //   결과가 비어 있으면(찾지 못했으면) 이 오류를 만들어 던집니다.\n        //   찾은 경우에는 이 오류가 만들어지지 않고, 찾은 줄이 그대로 돌려줍니다.\n        return refreshTokenRepository.findByRefreshToken(refreshToken)\n                .orElseThrow(() -> new IllegalArgumentException(\"Unexpected token\"));\n    }\n}","service/TokenService.java":"// 파일 위치: src/main/java/me/shinsunyoung/springbootdeveloper/service/TokenService.java\n//\n// ============================================================\n// 이 파일이 하는 일\n// ============================================================\n// 액세스 토큰이 만료되었을 때, 리프레시 토큰을 확인하고 새 액세스 토큰을 만들어 주는 파일입니다.\n//\n// ============================================================\n// 전체 흐름 (createNewAccessToken 한 번에 일어나는 일)\n// ============================================================\n// 1. 받은 리프레시 토큰이 진짜이고 기간이 남았는지 확인합니다.\n// 2. 데이터베이스에서 그 리프레시 토큰을 가진 줄을 찾아, 사용자 번호를 꺼냅니다.\n// 3. 사용자 번호로 사용자 정보를 찾습니다.\n// 4. 그 사용자의 새 액세스 토큰을 2시간 동안 유효하게 만들어 돌려줍니다.\n//\n// ============================================================\n// 꼭 알아둘 낱말\n// ============================================================\n// 액세스 토큰    : 실제 요청을 보낼 때 붙이는 토큰입니다. 유효 기간이 짧습니다. 여기서는 2시간입니다.\n// 리프레시 토큰  : 액세스 토큰이 만료되었을 때 새 액세스 토큰을 받기 위해 쓰는 토큰입니다.\n//                유효 기간이 길고(14일), 데이터베이스에도 저장되어 있습니다.\n// 서비스(Service): 업무 처리 순서를 담당하는 클래스입니다. 다른 서비스들을 불러서 일을 완성합니다.\n// Duration       : \"2시간\", \"14일\"처럼 기간을 나타내는 타입입니다.\n// getUserId()    : 리프레시 토큰 줄에 들어 있는 사용자 번호를 꺼내는 메서드입니다.\n// 예외(Exception): 실행 중 문제가 생겼다는 신호입니다. 던져지면 그 아래 줄은 실행되지 않습니다.\n//\n// ============================================================\n// 꼭 조심할 점\n// ============================================================\n// 1. 리프레시 토큰이 가짜이거나 기간이 지났으면, 새 토큰을 만들지 않고 바로 오류를 던집니다.\n// 2. 이 파일은 \"두 번 확인하는 구조\"입니다.\n//    - validToken: 토큰 자체가 진짜인지 (서명과 기간) 확인합니다.\n//    - findByRefreshToken: 데이터베이스에 그 토큰이 저장되어 있는지 확인합니다.\n// ============================================================\n\n// 이 파일이 속한 폴더 이름입니다. 업무 처리 클래스들을 모아 두는 폴더입니다.\npackage me.shinsunyoung.springbootdeveloper.service;\n\nimport lombok.RequiredArgsConstructor;                                             // final 변수를 받는 생성자를 자동으로 만들어 주는 도구입니다.\nimport me.shinsunyoung.springbootdeveloper.config.jwt.TokenProvider;               // 토큰을 만들고, 진짜인지 확인하고, 내용을 꺼내는 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.domain.User;                            // 사용자 한 명을 나타내는 클래스입니다.\nimport org.springframework.stereotype.Service;                                     // 이 클래스를 스프링이 관리하는 서비스 객체로 등록하는 표시입니다.\n\nimport java.time.Duration;                                                         // \"2시간\", \"14일\"처럼 기간을 나타내는 타입입니다.\n\n// @RequiredArgsConstructor\n//   뜻: 아래 final 변수 세 개(tokenProvider, refreshTokenService, userService)를 받는 생성자를 자동으로 만듭니다.\n//   이유: 스프링이 필요한 객체 세 개를 이 생성자를 통해 넣어 주기 위해서입니다.\n@RequiredArgsConstructor\n\n// @Service\n//   뜻: 이 클래스의 객체를 스프링이 하나 만들어 관리하게 합니다.\n//   이유: TokenApiController 같은 다른 클래스가 이 객체를 받아서 쓸 수 있게 하기 위해서입니다.\n@Service\npublic class TokenService {\n\n    // 토큰을 만들고 확인하는 도구입니다. 스프링이 넣어 줍니다.\n    private final TokenProvider tokenProvider;\n\n    // 리프레시 토큰을 데이터베이스에서 찾는 서비스입니다. 스프링이 넣어 줍니다.\n    private final RefreshTokenService refreshTokenService;\n\n    // 사용자 정보를 찾는 서비스입니다. 스프링이 넣어 줍니다.\n    private final UserService userService;\n\n    // ============================================================\n    // createNewAccessToken: 리프레시 토큰을 받아 새 액세스 토큰을 만들어 돌려줍니다.\n    // 받는 값: refreshToken(사용자가 보낸 리프레시 토큰 문자열)\n    // 돌려주는 값: 새로 만든 액세스 토큰 문자열 (2시간 동안 유효)\n    // 오류가 나는 경우: 리프레시 토큰이 가짜이거나 기간이 지났을 때\n    // ============================================================\n    public String createNewAccessToken(String refreshToken) {\n\n        // [1단계] 리프레시 토큰이 진짜인지 확인합니다.\n        // validToken 은 서명이 맞고 기간이 남았으면 true 를 돌려줍니다.\n        // \"!\" 는 \"아니다\"라는 뜻입니다. 따라서 \"!tokenProvider.validToken(...)\" 은\n        //   \"토큰이 진짜가 아니다\"라는 뜻이 됩니다.\n        // 그 경우 아래 줄에서 오류를 던지고, 이 메서드는 여기서 끝납니다.\n        if(!tokenProvider.validToken(refreshToken)) {\n            throw new IllegalArgumentException(\"Unexpected token\");\n        }\n\n        // [2단계] 데이터베이스에서 이 리프레시 토큰을 가진 줄을 찾아 사용자 번호를 꺼냅니다.\n        // findByRefreshToken : 토큰 문자열로 줄을 찾습니다. 없으면 오류가 납니다.\n        // getUserId()        : 찾은 줄에 들어 있는 사용자 번호(Long)를 꺼냅니다.\n        // 결과는 Long userId 라는 변수에 담깁니다.\n        Long userId = refreshTokenService.findByRefreshToken(refreshToken).getUserId();\n\n        // [3단계] 사용자 번호로 사용자 정보를 찾습니다.\n        // 찾은 User 객체를 user 라는 변수에 담습니다.\n        User user = userService.findById(userId);\n\n        // [4단계] 그 사용자를 위한 새 액세스 토큰을 만듭니다.\n        // Duration.ofHours(2) 는 \"2시간\"이라는 기간을 뜻합니다.\n        // generateToken 은 사용자 정보와 기간을 받아 토큰 문자열을 만들어 돌려줍니다.\n        // 이 값이 createNewAccessToken 의 결과가 되어 호출한 곳으로 돌아갑니다.\n        return tokenProvider.generateToken(user, Duration.ofHours(2));\n    }\n}","service/UserDetailService.java":"package me.shinsunyoung.springbootdeveloper.service;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.repository.UserRepository;\nimport org.springframework.security.core.userdetails.UserDetails;\nimport org.springframework.security.core.userdetails.UserDetailsService;\nimport org.springframework.stereotype.Service;\n\n@RequiredArgsConstructor\n@Service\npublic class UserDetailService implements UserDetailsService {\n    private final UserRepository userRepository;\n\n    @Override\n    public UserDetails loadUserByUsername(String email) {\n        return userRepository.findByEmail(email)\n                .orElseThrow(() -> new IllegalArgumentException((email)));\n    }\n}","service/UserService.java":"// 파일 위치: src/main/java/me/shinsunyoung/springbootdeveloper/service/UserService.java\n//\n// ============================================================\n// 이 파일이 하는 일\n// ============================================================\n// 회원 관련 \"업무 처리\"를 맡은 파일입니다.\n// 1. 회원 가입: 화면에서 받은 정보를 비밀번호 암호화 후 데이터베이스에 저장합니다.\n// 2. 회원 찾기: 사용자 번호로 회원 한 명을 찾아서 돌려줍니다.\n//\n// ============================================================\n// 전체 흐름 (회원 가입 예)\n// ============================================================\n// 1. 화면에서 이메일과 비밀번호를 보냅니다.\n// 2. 컨트롤러가 그 값을 AddUserRequest 에 담아 save() 를 부릅니다.\n// 3. save() 는 비밀번호를 암호문으로 바꿉니다.\n// 4. 이메일과 암호문을 User 객체에 담아 데이터베이스에 저장합니다.\n// 5. 저장된 사용자 번호(id)를 돌려줍니다.\n//\n// ============================================================\n// 꼭 알아둘 낱말\n// ============================================================\n// 서비스(Service)       : 업무 처리 순서를 담당하는 클래스입니다. 저장소와 화면 사이에서 일합니다.\n// 암호화(encode)        : 비밀번호를 알아볼 수 없는 글자로 바꾸는 일입니다.\n//                         암호화된 값은 원래 비밀번호로 되돌릴 수 없습니다.\n// 암호문                : 암호화를 거친 뒤의 글자입니다. 예) $2a$10$... 같은 모양입니다.\n// DTO(dto)              : 화면에서 보낸 값을 옮겨 담기 위해 만든 객체입니다. 여기서는 AddUserRequest 입니다.\n// User                  : 데이터베이스의 users 표 한 줄과 연결된 사용자 클래스입니다.\n// 빌더(builder)         : 값을 하나씩 골라 넣고 build() 로 객체를 완성하는 방법입니다.\n// Optional              : \"값이 있을 수도, 없을 수도 있다\"는 뜻을 담은 타입입니다.\n// 람다(() -> ...)       : 짧게 적은 \"이런 일을 해라\"라는 한 줄짜리 코드입니다.\n//                         여기서는 \"값이 없으면 오류를 만들어라\"라는 뜻입니다.\n// 예외(Exception)       : 실행 중 생긴 문제 신호입니다. 던져지면 그 아래 줄은 실행되지 않습니다.\n//\n// ============================================================\n// 꼭 조심할 점\n// ============================================================\n// 1. 비밀번호는 절대 그대로 저장하지 않습니다. 반드시 passwordEncoder.encode() 로 암호화합니다.\n// 2. 이 코드는 9장 버전입니다. 11장(OAuth2)에서는 이 파일이 조금 바뀝니다.\n//    PasswordEncoder 를 받아 쓰는 대신 BCryptPasswordEncoder 를 직접 만들고,\n//    이메일로 회원을 찾는 findByEmail 메서드가 추가됩니다.\n// ============================================================\n\n// 이 파일이 속한 폴더 이름입니다. 업무 처리 클래스들을 모아 두는 폴더입니다.\npackage me.shinsunyoung.springbootdeveloper.service;\n\nimport lombok.RequiredArgsConstructor;                              // final 변수를 받는 생성자를 자동으로 만들어 주는 도구입니다.\nimport me.shinsunyoung.springbootdeveloper.domain.User;             // 데이터베이스의 사용자 한 명을 나타내는 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.dto.AddUserRequest;      // 화면에서 보낸 가입 정보(이메일, 비밀번호)를 담는 객체입니다.\nimport me.shinsunyoung.springbootdeveloper.repository.UserRepository; // users 표에 저장하고 찾는 도구입니다.\nimport org.springframework.security.crypto.password.PasswordEncoder; // 비밀번호를 암호화하는 도구의 약속(인터페이스)입니다.\nimport org.springframework.stereotype.Service;                      // 이 클래스를 스프링이 관리하는 서비스 객체로 등록하는 표시입니다.\n\n// @RequiredArgsConstructor\n//   뜻: 아래 final 변수(userRepository, passwordEncoder)를 받는 생성자를 자동으로 만들어 줍니다.\n//   이유: 스프링이 두 객체를 이 생성자를 통해 넣어 주기 위해서입니다.\n@RequiredArgsConstructor\n\n// @Service\n//   뜻: 이 클래스의 객체를 스프링이 하나 만들어 관리하게 합니다.\n//   이유: 컨트롤러 같은 다른 클래스가 이 객체를 받아서 쓸 수 있게 하기 위해서입니다.\n@Service\npublic class UserService {\n\n    // 사용자 정보를 데이터베이스에 저장하고 찾는 도구입니다.\n    // 스프링이 넣어 줍니다. final 이라 한 번 넣으면 바꾸지 않습니다.\n    private final UserRepository userRepository;\n\n    // 비밀번호를 암호화하는 도구입니다.\n    // 스프링이 설정 파일에서 만들어 둔 객체를 넣어 줍니다.\n    private final PasswordEncoder passwordEncoder;\n\n    // ============================================================\n    // save: 회원 가입 정보를 저장하고, 저장된 사용자 번호를 돌려줍니다.\n    // 받는 값: dto(화면에서 보낸 이메일과 비밀번호가 들어 있는 객체)\n    // 돌려주는 값: 새로 저장된 사용자의 번호(Long)\n    // ============================================================\n    public Long save(AddUserRequest dto) {\n\n        // 아래 한 문장은 여러 단계가 한꺼번에 들어 있으니 나눠서 보겠습니다.\n        //\n        // 1단계) dto.getEmail()\n        //        화면에서 받은 이메일을 꺼냅니다.\n        //\n        // 2단계) dto.getPassword()\n        //        화면에서 받은 원래 비밀번호를 꺼냅니다.\n        //\n        // 3단계) passwordEncoder.encode(...)\n        //        원래 비밀번호를 암호문으로 바꿉니다.\n        //        이 암호문을 저장하면, 데이터베이스를 보더라도 원래 비밀번호를 알 수 없습니다.\n        //\n        // 4단계) User.builder() ... build()\n        //        이메일과 암호문을 넣어서 User 객체 하나를 완성합니다.\n        //        값을 골라 넣는 방식(빌더)으로 만듭니다.\n        //\n        // 5단계) userRepository.save(...)\n        //        완성한 User 객체를 데이터베이스에 저장합니다.\n        //        저장이 끝나면 저장된 User 객체를 돌려줍니다.\n        //\n        // 6단계) .getId()\n        //        저장된 User 객체에서 사용자 번호(id)만 꺼냅니다.\n        //        데이터베이스가 저장할 때 자동으로 정한 번호입니다.\n        //\n        // 마지막으로 그 번호를 이 메서드의 결과로 돌려줍니다.\n        return userRepository.save(User.builder()\n                .email(dto.getEmail())                         // 이메일을 넣습니다.\n                .password(passwordEncoder.encode(dto.getPassword())) // 비밀번호를 암호화해서 넣습니다.\n                .build()).getId();                             // 저장한 뒤 사용자 번호를 꺼내서 돌려줍니다.\n    }\n\n    // ============================================================\n    // findById: 사용자 번호로 회원 한 명을 찾아서 돌려줍니다.\n    // 받는 값: userId(찾고 싶은 사용자 번호)\n    // 돌려주는 값: 찾은 User 객체\n    // 찾지 못하면: 오류(IllegalArgumentException)를 던집니다.\n    // ============================================================\n    public User findById(Long userId) {\n\n        // 아래 줄을 나눠서 보겠습니다.\n        //\n        // userRepository.findById(userId)\n        //   데이터베이스에서 사용자 번호가 userId 인 줄을 찾습니다.\n        //   찾으면 그 사용자를, 없으면 빈 결과(Optional)를 돌려줍니다.\n        //\n        // .orElseThrow(() -> new IllegalArgumentException(\"Unexpected user\"))\n        //   결과가 비어 있으면(찾지 못했으면) 아래 오류를 만들어 던집니다.\n        //   () -> ... 부분은 \"값이 없을 때 실행할 일\"을 짧게 적은 것입니다.\n        //   오류 메시지는 \"Unexpected user\"(예상하지 못한 사용자)입니다.\n        //   찾은 경우에는 이 오류가 만들어지지 않고, 찾은 사용자가 그대로 돌려줍니다.\n        return userRepository.findById(userId)\n                .orElseThrow(() -> new IllegalArgumentException(\"Unexpected user\"));\n    }\n}","test/TokenApiControllerTest.java":"\n\npackage me.shinsunyoung.springbootdeveloper.controller;\n\nimport me.shinsunyoung.springbootdeveloper.config.jwt.JwtProperties;                 // 설정 파일의 jwt 값(발급자, 비밀키)을 담는 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.domain.RefreshToken;                      // refresh_token 테이블의 한 행에 해당하는 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.domain.User;                              // users 테이블의 한 행에 해당하는 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.dto.CreateAccessTokenRequest;             // 요청 본문(JSON)과 대응하는 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.jwt.JwtFactory;                           // 테스트에서 토큰을 쉽게 만들기 위한 클래스입니다.\nimport me.shinsunyoung.springbootdeveloper.repository.RefreshTokenRepository;        // refresh_token 테이블에 저장하고 조회하는 인터페이스입니다.\nimport me.shinsunyoung.springbootdeveloper.repository.UserRepository;                // users 테이블에 저장하고 조회하는 인터페이스입니다.\nimport org.junit.jupiter.api.BeforeEach;                                             // 각 테스트 메서드가 실행되기 직전에 자동으로 실행되는 메서드를 표시합니다.\nimport org.junit.jupiter.api.DisplayName;                                            // 테스트 결과 화면에 보일 이름을 정합니다.\nimport org.junit.jupiter.api.Test;                                                   // 이 메서드가 테스트 메서드임을 표시합니다.\nimport org.springframework.beans.factory.annotation.Autowired;                       // 스프링이 객체를 찾아서 변수에 넣어 주도록 표시합니다.\nimport org.springframework.boot.test.context.SpringBootTest;                         // 스프링 프로그램 전체를 실행한 상태로 테스트하도록 표시합니다.\nimport org.springframework.boot.webmvc.test.autoconfigure.AutoConfigureMockMvc;     // MockMvc 객체를 스프링이 자동으로 만들도록 표시합니다.\nimport org.springframework.http.MediaType;                                           // 데이터 종류(JSON 등)를 나타내는 값 모음입니다.\nimport org.springframework.test.web.servlet.MockMvc;                                 // 실제 서버 없이 HTTP 요청을 보내는 객체의 타입입니다.\nimport org.springframework.test.web.servlet.ResultActions;                           // 요청을 보낸 뒤의 결과를 담는 객체의 타입입니다.\nimport org.springframework.test.web.servlet.setup.MockMvcBuilders;                   // MockMvc 객체를 만드는 도구 클래스입니다.\nimport org.springframework.web.context.WebApplicationContext;                        // 스프링 웹 설정 정보 전체를 담는 객체의 타입입니다.\nimport tools.jackson.databind.ObjectMapper;                                          // 자바 객체와 JSON 문자열을 서로 바꾸는 객체의 타입입니다.\n\nimport java.util.Map;                                                                // \"이름과 값\" 짝을 담는 자료형입니다.\n\nimport static org.springframework.test.web.servlet.request.MockMvcRequestBuilders.post;     // POST 요청을 만드는 메서드 post() 를 바로 쓰도록 가져옵니다.\nimport static org.springframework.test.web.servlet.result.MockMvcResultMatchers.jsonPath;   // JSON 안의 값을 찾는 메서드 jsonPath() 를 바로 쓰도록 가져옵니다.\nimport static org.springframework.test.web.servlet.result.MockMvcResultMatchers.status;     // HTTP 상태 코드를 검사하는 메서드 status() 를 바로 쓰도록 가져옵니다.\n\n\n// 파일 위치: src/test/java/me/shinsunyoung/springbootdeveloper/controller/TokenApiControllerTest.java\n//\n// [이 클래스가 하는 일]\n//   POST /api/token 요청을 보냈을 때, 서버가 201 응답과 accessToken 을 돌려주는지 자동으로 확인합니다.\n//   실제 서버를 켜지 않고, MockMvc 라는 객체로 요청을 흉내 내서 보냅니다.\n//\n// [이 클래스의 구성]\n//   어노테이션 2개 : @SpringBootTest, @AutoConfigureMockMvc\n//   변수 6개        : mockMvc, objectMapper, context, jwtProperties, userRepository, refreshTokenRepository\n//   메서드 2개      : mockMvcSetUp (준비 메서드), createNewAccessToken (테스트 메서드)\n\n// ============================================================\n// @SpringBootTest\n//   뜻  : 스프링 프로그램 전체를 실행한 상태에서 테스트합니다.\n//   이유 : 컨트롤러, 서비스, 리포지터리 객체가 모두 실제로 만들어져 연결되어야 하기 때문입니다.\n//   참고 : 실제 서버 포트는 열지 않고, 요청을 흉내 낼 수 있는 가짜 웹 환경을 테스트 할때 사용합니다.\n// ============================================================\n@SpringBootTest\n\n// ============================================================\n// @AutoConfigureMockMvc\n//   뜻  : MockMvc 객체를 스프링이 자동으로 만들어서 준비해 줍니다.\n//   참고 : 이 상태에서는 보안 설정(필터)도 함께 포함됩니다.\n//          단, 아래 mockMvcSetUp 메서드에서 mockMvc 를 새 객체로 바꾸므로, 실제 테스트에서는 보안 설정이 빠집니다.\n// ============================================================\n@AutoConfigureMockMvc\nclass TokenApiControllerTest {\n\n    // ============================================================\n    // 변수 1: mockMvc\n    //   하는 일 : HTTP 요청을 보내고 응답을 받는 일을 합니다.\n    //   값 넣기 : @Autowired 가 스프링에게 \"MockMvc 객체를 찾아서 여기에 넣어라\"라고 알려 줍니다.\n    //   바뀜    : mockMvcSetUp 메서드가 실행될 때마다 새 MockMvc 객체로 바뀝니다.\n    // ============================================================\n    @Autowired\n    protected MockMvc mockMvc;\n\n    // ============================================================\n    // 변수 2: objectMapper\n    //   하는 일 : 자바 객체를 JSON 문자열로 바꿉니다.\n    //             예) request 객체 → {\"refreshToken\":\"...\"}\n    //   값 넣기 : @Autowired 로 스프링이 만들어 둔 ObjectMapper 객체를 넣습니다.\n    // ============================================================\n    @Autowired\n    protected ObjectMapper objectMapper;\n\n    // ============================================================\n    // 변수 3: context\n    //   하는 일 : 스프링 웹 설정 정보 전체를 담고 있습니다.\n    //             mockMvcSetUp 메서드에서 MockMvc 를 만들 때 이 정보를 사용합니다.\n    //   값 넣기 : @Autowired 로 스프링이 넣어 줍니다.\n    // ============================================================\n    @Autowired\n    private WebApplicationContext context;\n\n    // ============================================================\n    // 변수 4: jwtProperties\n    //   하는 일 : application.yml 의 jwt 설정값(발급자 이름, 비밀키)을 담고 있습니다.\n    //             토큰을 만들 때 JwtFactory 가 이 값을 사용합니다.\n    //   값 넣기 : @Autowired 로 스프링이 설정값을 읽어서 넣어 줍니다.\n    // ============================================================\n    @Autowired\n    JwtProperties jwtProperties;\n\n    // ============================================================\n    // 변수 5: userRepository\n    //   하는 일 : users 테이블에 사용자를 저장(save)하거나 모두 지우기(deleteAll)를 합니다.\n    //   값 넣기 : @Autowired 로 스프링이 구현 객체를 만들어서 넣어 줍니다.\n    //             개발자가 new 로 직접 만들지 않습니다.\n    // ============================================================\n    @Autowired\n    UserRepository userRepository;\n\n    // ============================================================\n    // 변수 6: refreshTokenRepository\n    //   하는 일 : refresh_token 테이블에 리프레시 토큰을 저장(save)합니다.\n    //   값 넣기 : @Autowired 로 스프링이 구현 객체를 만들어서 넣어 줍니다.\n    // ============================================================\n    @Autowired\n    RefreshTokenRepository refreshTokenRepository;\n\n    // ============================================================\n    // 메서드 1: mockMvcSetUp\n    //   어노테이션 @BeforeEach : 테스트 메서드 하나가 실행되기 직전에 항상 먼저 실행됩니다.\n    //   목적 : 테스트 하나가 끝난 뒤 남은 데이터가 다음 테스트에 영향을 주지 않도록 준비합니다.\n    // ============================================================\n    @BeforeEach\n    public void mockMvcSetUp() {\n\n        // 1) mockMvc 변수에 새 MockMvc 객체를 넣습니다.\n        //    MockMvcBuilders.webAppContextSetup(context) : context 정보를 바탕으로 MockMvc 를 만들 준비를 합니다.\n        //    .build()                                    : 준비된 내용으로 MockMvc 객체를 완성합니다.\n        //    결과를 this.mockMvc 에 넣으면, 기존에 @Autowired 로 들어 있던 객체가 새 객체로 바뀝니다.\n        //    참고: 이 방법으로 만든 MockMvc 에는 보안 필터가 자동으로 들어가지 않습니다.\n        this.mockMvc = MockMvcBuilders.webAppContextSetup(context).build();\n\n        // 2) users 테이블의 모든 행을 삭제합니다.\n        //    userRepository.deleteAll() 은 users 테이블 전체를 지웁니다.\n        //    이전 테스트에서 저장한 사용자가 남아 있지 않도록 하기 위해서입니다.\n        //    참고: refresh_token 테이블의 행은 지우지 않습니다.\n        userRepository.deleteAll();\n    }\n\n    // ============================================================\n    // 메서드 2: createNewAccessToken\n    //   어노테이션 @Test        : 테스트 실행 도구가 이 메서드를 실행합니다.\n    //   어노테이션 @DisplayName : 테스트 결과 화면에 보일 이름을 정합니다.\n    //   throws Exception        : 이 메서드 안에서 발생할 수 있는 예외를 밖으로 넘깁니다.\n    // ============================================================\n    @DisplayName(\"createNewAccessToken: 새로운 액세스 토큰을 발급한다.\")\n    @Test\n    public void createNewAccessToken() throws Exception {\n\n        // ------------------------------------------------------------\n        // [준비] 테스트에 필요한 값과 데이터를 만듭니다.\n        // ------------------------------------------------------------\n\n        // 지역 변수 url: 요청을 보낼 주소입니다. 값은 \"/api/token\" 입니다.\n        //   final 은 한 번 넣은 값을 나중에 바꾸지 못하게 합니다.\n        //   이 주소는 TokenApiController 의 @PostMapping 주소와 같아야 요청이 연결됩니다.\n        final String url = \"/api/token\";\n\n        // 지역 변수 testUser: 테스트용 사용자입니다.\n        //   User.builder() : 사용자를 만드는 빌더를 꺼냅니다.\n        //   .email(...)    : 이메일 값을 넣습니다. 값은 \"user@gmail.com\" 입니다.\n        //   .password(...) : 비밀번호 값을 넣습니다. 값은 \"test\" 입니다. (암호화하지 않고 넣습니다.)\n        //   .build()       : 넣은 값으로 User 객체를 만듭니다. 이 시점에는 id 가 비어 있습니다(null).\n        //   userRepository.save(...) : users 테이블에 저장합니다.\n        //                              저장되면서 데이터베이스가 id 값을 정하고, 그 값이 객체에 채워져 돌아옵니다.\n        User testUser = userRepository.save(User.builder()\n                .email(\"user@gmail.com\")\n                .password(\"test\")\n                .build());\n\n        // 지역 변수 refreshToken: 리프레시 토큰 문자열입니다.\n        //   JwtFactory.builder()        : 토큰을 만드는 재료 빌더를 꺼냅니다.\n        //   .claims(Map.of(\"id\", ...))  : 토큰 안에 \"id\" 항목을 넣습니다. 값은 testUser 의 id 입니다.\n        //   .build()                    : 재료를 모아 JwtFactory 객체를 만듭니다.\n        //   .createToken(jwtProperties) : 재료로 토큰 문자열을 만듭니다. 결과 예: eyJhbGciOi....\n        String refreshToken = JwtFactory.builder()\n                .claims(Map.of(\"id\", testUser.getId()))\n                .build()\n                .createToken(jwtProperties);\n\n        // refresh_token 테이블에 리프레시 토큰을 저장합니다.\n        //   new RefreshToken(userId, refreshToken) : 사용자 id 와 토큰 문자열을 담은 객체를 만듭니다.\n        //   refreshTokenRepository.save(...)       : 그 객체를 refresh_token 테이블에 저장합니다.\n        //   저장된 이 토큰은 서버가 요청을 처리할 때 다시 조회합니다.\n        refreshTokenRepository.save(new RefreshToken(testUser.getId(), refreshToken));\n\n        // 요청 본문에 넣을 객체 request 를 만듭니다.\n        //   new CreateAccessTokenRequest() : 빈 객체를 만듭니다.\n        //   request.setRefreshToken(...)   : 객체 안의 refreshToken 값에 토큰 문자열을 넣습니다.\n        CreateAccessTokenRequest request = new CreateAccessTokenRequest();\n        request.setRefreshToken(refreshToken);\n\n        // 지역 변수 requestBody: request 객체를 JSON 문자열로 바꾼 값입니다.\n        //   objectMapper.writeValueAsString(request) 의 결과는 다음과 같은 모양입니다.\n        //   {\"refreshToken\":\"eyJhbGciOi....\"}\n        final String requestBody = objectMapper.writeValueAsString(request);\n\n        // ------------------------------------------------------------\n        // [실행] 요청을 보냅니다.\n        // ------------------------------------------------------------\n\n        // ResultActions 변수 resultActions: 요청을 보낸 결과를 담습니다.\n        //   post(url)                              : POST 방식으로 url 주소에 요청을 준비합니다.\n        //   .contentType(MediaType.APPLICATION_JSON_VALUE) : 보내는 데이터가 JSON 이라고 알려 줍니다.\n        //   .content(requestBody)                  : 요청 본문에 JSON 문자열을 넣습니다.\n        //   mockMvc.perform(...)                   : 준비한 요청을 실제로 보내고 결과를 돌려받습니다.\n        //\n        //   서버 안에서 일어나는 일 (순서대로):\n        //     1) \"/api/token\" 주소의 TokenApiController 메서드를 찾습니다.\n        //     2) 요청 본문의 JSON 을 CreateAccessTokenRequest 객체로 바꿉니다.\n        //     3) 컨트롤러가 TokenService 를 호출해서 새 액세스 토큰을 만듭니다.\n        //     4) 결과를 201 상태 코드와 함께 JSON 으로 응답합니다.\n        ResultActions resultActions = mockMvc.perform(post(url)\n                                            .contentType(MediaType.APPLICATION_JSON_VALUE)\n                                            .content(requestBody));\n\n        // ------------------------------------------------------------\n        // [검증] 응답이 기대한 값인지 확인합니다.\n        // ------------------------------------------------------------\n\n        // status().isCreated()\n        //   응답 상태 코드가 201(Created)인지 확인합니다.\n        //   201 이 아니면 테스트는 실패합니다.\n        //\n        // jsonPath(\"$.accessToken\").isNotEmpty()\n        //   응답 JSON 에서 accessToken 항목의 값을 찾습니다.\n        //   $ 는 JSON 의 가장 바깥 객체를 뜻합니다.\n        //   그 값이 비어 있지 않은지(null 이나 빈 문자열이 아닌지) 확인합니다.\n        //\n        // andExpect 는 순서대로 검사하고, 하나라도 틀리면 테스트가 실패합니다.\n        resultActions\n                .andExpect(status().isCreated())\n                .andExpect(jsonPath(\"$.accessToken\").isNotEmpty());\n    }\n}\n\n// ============================================================\n// 정리\n//   변수 6개: mockMvc, objectMapper, context, jwtProperties, userRepository, refreshTokenRepository\n//   각 변수는 @Autowired 로 스프링이 값을 넣어 줍니다.\n//   mockMvcSetUp 은 테스트마다 실행되어 mockMvc 를 새로 만들고 users 테이블을 비웁니다.\n//   createNewAccessToken 은 사용자 저장 → 토큰 만들기 → 요청 보내기 → 결과 확인 순서로 동작합니다.\n// ============================================================"};

    const d = document.createElement('div');
    d.className = 'band' + (n.db ? ' db' : '');
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = n.name;
    const sb = document.createElement('div'); sb.className = 'sb'; sb.textContent = n.sub;
    d.append(nm, sb);
    stack.appendChild(d);
    return d;
  });
  $('dots').innerHTML = ''; dotBtns = [];
  // 단계 번호는 단계 순서대로 놓고, 묶음(요청, 응답 등)이 바뀌는 곳에서만 묶음 이름을 붙입니다.
  phases = [];
  let g = null, last = null;
  STEPS.forEach((s, i) => {
    if (!phases.includes(s.phase)) phases.push(s.phase);
    if (s.phase !== last) {
      g = document.createElement('div'); g.className = 'grp';
      const gl = document.createElement('span'); gl.className = 'gl'; gl.textContent = s.phase;
      g.appendChild(gl);
      $('dots').appendChild(g);
      last = s.phase;
    }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dot'; b.textContent = i + 1;
    b.setAttribute('aria-label', (i + 1) + '단계 : ' + s.title);
    b.addEventListener('click', () => { stop(); go(i); });
    g.appendChild(b); dotBtns[i] = b;
  });
}

function load(i) {
  sc = i;
  const s = SCENARIOS[sc];
  STEPS = s.steps; NODES = s.nodes;
  tabBtns.forEach((b, k) => b.setAttribute('aria-selected', k === sc ? 'true' : 'false'));
  tabBtns[sc].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('scen').innerHTML = '';
  s.summary.forEach((part) => {
    if (part.code) { const c = document.createElement('code'); c.textContent = part.code; $('scen').appendChild(c); }
    else $('scen').appendChild(document.createTextNode(part.text));
  });
  buildStage();
  go(0);
}

function centerY(i) {
  const b = bands[i];
  return b.offsetTop + b.offsetHeight / 2 - 8;
}

function placePacket(step) {
  packet.className = 'packet ' + (step.dir === 'none' ? '' : step.dir);
  if (step.move) {
    const [from, to] = step.move;
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(from) + 'px)';
    void packet.offsetHeight;
    packet.style.transition = reduce ? 'none' : 'transform 1s cubic-bezier(.45,0,.2,1)';
    packet.style.transform = 'translateY(' + centerY(to) + 'px)';
  } else {
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(step.active[0]) + 'px)';
    packet.classList.add('pulse');
  }
}

function renderCode(step) {
  const wrap = $('codewrap');
  wrap.innerHTML = '';
  if (!step.file) {
    $('fname').textContent = '프로젝트 파일 없음';
    $('fpath').textContent = step.nofile || '이 단계는 스프링 부트 라이브러리나 브라우저가 처리합니다.';
    $('hlcount').textContent = '';
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = '이 단계에서는 개발자가 작성한 파일이 실행되지 않습니다. 왼쪽에서 신호가 지나가는 구간을 확인하세요.';
    wrap.appendChild(e);
    return;
  }
  $('fname').textContent = step.file.split('/').pop();
  $('fpath').textContent = PATHS[step.file];
  const box = document.createElement('div'); box.className = 'code'; box.tabIndex = 0;
  box.setAttribute('aria-label', step.file + ' 코드');
  let first = null, n = 0;
  FILES[step.file].split('\n').forEach((line, i) => {
    const row = document.createElement('div'); row.className = 'ln';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = i + 1;
    const tx = document.createElement('span'); tx.textContent = line || ' ';
    row.append(no, tx);
    if (step.hlLines.includes(i + 1)) {
      row.classList.add('hl'); n++;
      if (!first) first = row;
    }
    box.appendChild(row);
  });
  wrap.appendChild(box);
  $('hlcount').textContent = n ? '강조된 줄 ' + n + '개 : 이 단계에서 실행되거나 쓰이는 코드' : '';
  if (first) box.scrollTop = Math.max(0, first.offsetTop - box.clientHeight / 3);
}

function renderData(step) {
  const d = step.data, body = $('dbody');
  $('dlabel').textContent = d.label;
  body.innerHTML = '';
  if (d.kind === 'table') {
    const t = document.createElement('table');
    const tr = document.createElement('tr');
    d.cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); });
    t.appendChild(tr);
    d.rows.forEach((r) => {
      const row = document.createElement('tr');
      r.forEach((c) => { const td = document.createElement('td'); td.textContent = c; row.appendChild(td); });
      t.appendChild(row);
    });
    const w = document.createElement('div'); w.style.overflowX = 'auto'; w.appendChild(t);
    body.appendChild(w);
  } else if (d.kind === 'browser') {
    const b = document.createElement('div'); b.className = 'browser';
    const bar = document.createElement('div'); bar.className = 'bar'; bar.textContent = d.url;
    const v = document.createElement('div'); v.className = 'view'; v.style.whiteSpace = 'pre-wrap'; v.textContent = d.text;
    b.append(bar, v); body.appendChild(b);
  } else {
    const p = document.createElement('pre'); p.textContent = d.text; body.appendChild(p);
  }
}

function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  $('stepno').textContent = (cur + 1) + ' / ' + STEPS.length + '단계';
  const ph = $('phase');
  ph.textContent = s.phase;
  ph.className = 'phase ' + (PHASE_CLASS[s.phase] || 'p0');
  $('title').textContent = s.title;
  const ol = $('desc'); ol.innerHTML = '';
  s.desc.forEach((t) => { const li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
  bands.forEach((b, k) => { b.className = 'band' + (NODES[k].db ? ' db' : ''); });
  s.active.forEach((k) => bands[k].classList.add('active', s.dir));
  renderCode(s);
  renderData(s);
  ['desc', 'codewrap', 'dbody'].forEach((id) => { const el = $(id); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });
  placePacket(s);
  dotBtns.forEach((b, k) => { b.classList.toggle('cur', k === cur); b.classList.toggle('done', k < cur); b.setAttribute('aria-current', k === cur ? 'step' : 'false'); });
  if (dotBtns[cur]) dotBtns[cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('prev').disabled = cur === 0; $('first').disabled = cur === 0;
  $('next').disabled = cur === STEPS.length - 1;
}

function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = '자동 재생'; }
function play() {
  if (timer) { stop(); return; }
  if (cur === STEPS.length - 1) go(0);
  $('play').textContent = '멈춤';
  timer = setInterval(() => { if (cur >= STEPS.length - 1) { stop(); return; } go(cur + 1); }, 4200);
}

$('first').addEventListener('click', () => { stop(); go(0); });
$('prev').addEventListener('click', () => { stop(); go(cur - 1); });
$('next').addEventListener('click', () => { stop(); go(cur + 1); });
$('play').addEventListener('click', play);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('.code')) return;
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
});
window.addEventListener('resize', () => placePacket(Object.assign({}, STEPS[cur], { move: null })));

$('dl').addEventListener('click', () => {
  stop();
  const blob = new Blob([ORIGINAL_HTML], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "chapter10-request-flow-fixed.html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

load(0);
</script>
</body>
</html>
