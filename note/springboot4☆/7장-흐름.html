<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7장 화면 요청과 응답 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF3; --panel:#FFFFFF; --ink:#1B2433; --muted:#596577; --line:#C6D0DC;
  --req:#2457C5; --req-soft:#DCE6FA; --res:#137A50; --res-soft:#D6EFE3;
  --db:#9A5B0C; --hl:#FFEFA8; --hl-ink:#3A2E00; --code:#F4F7FA; --rail:#B9C5D3;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",Consolas,"D2Coding",monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141922; --panel:#1C232E; --ink:#E4E9F0; --muted:#9AA5B4; --line:#323E4F;
    --req:#7AA2FF; --req-soft:#1F2E4F; --res:#4CC48C; --res-soft:#173A2B;
    --db:#E2A757; --hl:#4B4220; --hl-ink:#FFF1BF; --code:#161C25; --rail:#3A4759;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:120px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-0.01em}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:62ch}
.lead code{font-family:var(--mono);font-size:14px;color:var(--ink)}
button{font-family:var(--sans);font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
button:focus-visible{outline:3px solid var(--req);outline-offset:2px}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}

.grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px;align-items:start}

/* 왼쪽 : 구간 스택 */
.stage{position:sticky;top:16px}
.stack{position:relative;padding-left:40px}
.rail{position:absolute;left:17px;top:22px;bottom:22px;width:2px;background:var(--rail)}
.band{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;transition:border-color .3s, background .3s}
.band:last-child{margin-bottom:0}
.band .nm{font-weight:600;font-size:15px}
.band .sb{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.band::before{content:"";position:absolute;left:-28px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--panel);border:2px solid var(--rail)}
.band.db{border-style:dashed}
.band.active{border-width:2px;padding:9px 13px}
.band.active.req{border-color:var(--req);background:var(--req-soft)}
.band.active.res{border-color:var(--res);background:var(--res-soft)}
.band.active.none{border-color:var(--ink)}
.band.active::before{border-color:currentColor}
.band.active.req::before{background:var(--req);border-color:var(--req)}
.band.active.res::before{background:var(--res);border-color:var(--res)}
.band.active.none::before{background:var(--ink);border-color:var(--ink)}
.packet{position:absolute;left:10px;top:0;width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--panel);z-index:2;will-change:transform}
.packet.req{background:var(--req)}
.packet.res{background:var(--res)}
.packet.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--panel)}50%{box-shadow:0 0 0 4px var(--panel),0 0 0 9px var(--rail)}}
.legend{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .lq::before{background:var(--req)}
.legend .ls::before{background:var(--res)}
.legend .ln::before{background:var(--ink)}

/* 오른쪽 : 단계 설명 */
.detail{min-width:0}
.stephead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stepno{font-family:var(--mono);font-size:14px;color:var(--muted)}
.phase{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.phase.p0{color:var(--ink)}
.phase.p1{color:var(--req);border-color:var(--req)}
.phase.p2{color:var(--res);border-color:var(--res)}
h2{font-size:22px;line-height:1.35;margin:0 0 10px;font-weight:700}
ol.desc{margin:0 0 16px;padding-left:22px;max-width:70ch}
ol.desc li{margin:3px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.boxhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.boxhead .fname{font-family:var(--mono);font-weight:600;font-size:13.5px}
.boxhead .fpath{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.code{position:relative;background:var(--code);max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.code .ln{display:flex;white-space:pre;padding:0 12px 0 0;min-width:max-content}
.code .no{display:inline-block;width:40px;flex:0 0 40px;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.code .ln.hl{background:var(--hl);color:var(--hl-ink);box-shadow:inset 4px 0 0 var(--db)}
.code .ln.hl .no{color:var(--hl-ink)}
.empty{padding:16px 14px;color:var(--muted);font-size:14px;background:var(--code)}
.data pre{margin:0;padding:12px 14px;background:var(--code);font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.data table{border-collapse:collapse;margin:12px 14px;font-family:var(--mono);font-size:14px}
.data th,.data td{border:1px solid var(--line);padding:5px 14px;text-align:left}
.data th{background:var(--code)}
.browser{margin:12px 14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.browser .bar{background:var(--code);padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.browser .view{padding:12px;font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere;background:var(--panel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.tab{border-radius:8px 8px 0 0;border-bottom-width:3px;padding:8px 14px;font-weight:600;background:transparent}
.tab[aria-selected="true"]{border-color:var(--line);border-bottom-color:var(--ink);background:var(--panel)}
.scen{margin:0 0 16px;color:var(--muted);font-size:14.5px;max-width:90ch}
.scen code{font-family:var(--mono);font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* 아래 : 조작 바 */
.controls{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.controls .in{max-width:1180px;margin:0 auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns .sp{flex:1}
.dots{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}
.dots .grp{display:flex;gap:4px;align-items:center;margin-right:10px}
.dots .gl{font-size:12px;color:var(--muted);margin-right:4px}
.dot{width:26px;height:26px;padding:0;border-radius:6px;font-size:12px;font-family:var(--mono)}
.dot.done{background:var(--code)}
.dot.cur{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kbd{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr;gap:14px}
  .stage{position:static}
  .band{padding:6px 12px;margin-bottom:5px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
  .band.active{padding:5px 11px}
  .band .nm{font-size:14px}
  .band .sb{font-size:11.5px}
  .dots{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .dots .grp{flex:0 0 auto}
  .btns button{padding:7px 12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto}
  .tab{flex:0 0 auto;padding:7px 11px;font-size:13.5px}
  h1{font-size:21px}
  h2{font-size:19px}
  .code{font-size:12.5px;max-height:280px}
  .data pre{font-size:12.5px}
  .kbd{display:none}
  body{padding-bottom:118px}
}
@media (prefers-reduced-motion: reduce){
  .packet{transition:none !important}
  .packet.pulse,.fade{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>7장 화면 요청과 응답 흐름</h1>
      <p class="lead">7장의 블로그 화면이 만들어지는 과정을 봅니다. 화면 요청은 Thymeleaf 가 HTML 을 만들고, 버튼은 article.js 의 fetch 가 6장 API 를 호출합니다. 앞의 3개 탭은 교재 원본 코드, 뒤의 3개 탭은 수정판 코드 기준입니다. HTML 결과와 SQL 로그는 실제로 실행해서 얻은 값입니다.</p>
    </div>
    <button type="button" class="primary" id="dl">HTML 파일 다운로드</button>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="시나리오"></div>
  <p class="scen" id="scen"></p>

  <div class="grid">
    <aside class="stage" aria-label="요청이 지나가는 구간">
      <div class="stack" id="stack">
        <div class="rail"></div>
        <div class="packet" id="packet" aria-hidden="true"></div>
      </div>
      <div class="legend"><span class="lq">요청 방향</span><span class="ls">응답 방향</span><span class="ln">준비·처리</span></div>
    </aside>

    <main class="detail">
      <div class="stephead">
        <span class="stepno" id="stepno"></span>
        <span class="phase" id="phase"></span>
      </div>
      <h2 id="title" aria-live="polite"></h2>
      <ol class="desc" id="desc"></ol>

      <section class="box" aria-label="실행되는 코드">
        <div class="boxhead"><div><div class="fname" id="fname"></div><div class="fpath" id="fpath"></div></div><span id="hlcount" class="fpath"></span></div>
        <div id="codewrap"></div>
      </section>

      <section class="box data" aria-label="오가는 데이터">
        <div class="boxhead"><span class="fname" id="dlabel"></span></div>
        <div id="dbody"></div>
      </section>
    </main>
  </div>
</div>

<nav class="controls" aria-label="단계 조작">
  <div class="in">
    <div class="btns">
      <button type="button" id="first">처음</button>
      <button type="button" id="prev">이전</button>
      <button type="button" class="primary" id="play">자동 재생</button>
      <button type="button" id="next">다음</button>
      <span class="sp"></span>
      <span class="kbd">키보드 ← → 로 이동</span>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</nav>

<script>
// 다운로드용 : 화면 요소를 추가하기 전, 처음 불러온 상태의 HTML 을 저장해 둡니다.
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const SCENARIOS = [{"tab": "목록 화면 GET /articles", "nodes": [{"name": "브라우저", "sub": "화면 + article.js"}, {"name": "내장 톰캣", "sub": "8080 포트"}, {"name": "DispatcherServlet · Thymeleaf", "sub": "주소 연결, 화면 만들기, JSON 변환"}, {"name": "BlogViewController", "sub": "controller/BlogViewController.java (@Controller)"}, {"name": "BlogService", "sub": "service/BlogService.java"}, {"name": "BlogRepository", "sub": "repository/BlogRepository.java + Hibernate"}, {"name": "H2 DB", "sub": "article 테이블 (메모리)", "db": true}], "steps": [{"phase": "시작 준비", "title": "@EnableJpaAuditing 과 article 테이블", "file": "SpringBootDeveloperApplication.java", "active": [1, 5, 6], "move": null, "dir": "none", "desc": ["@EnableJpaAuditing 이 작성 시각·수정 시각 자동 기록 기능을 켭니다.", "Hibernate 가 created_at, updated_at 열이 있는 article 테이블을 만들고, import.sql 이 NOW() 로 시각을 넣으며 글 3개를 저장합니다."], "data": {"kind": "pre", "label": "실제 시작 로그", "text": "create table article (\n        created_at timestamp(6),\n        id bigint generated by default as identity,\n        updated_at timestamp(6),\n        content varchar(255) not null,\n        title varchar(255) not null,\n        primary key (id)\n    )"}, "nofile": null, "hlLines": [7, 8]}, {"phase": "요청", "title": "브라우저가 GET /articles 요청을 보냄", "file": null, "active": [0, 1], "move": [0, 1], "dir": "req", "desc": ["주소창에 http://localhost:8080/articles 를 입력합니다. 이번에는 JSON 이 아니라 화면(HTML)을 받는 요청입니다."], "data": {"kind": "pre", "label": "HTTP 요청", "text": "GET /articles HTTP/1.1\nHost: localhost:8080"}, "nofile": null, "hlLines": []}, {"phase": "요청", "title": "@Controller 의 getArticles 찾기", "file": "controller/BlogViewController.java", "active": [1, 2], "move": [1, 2], "dir": "req", "desc": ["DispatcherServlet 이 @GetMapping(\"/articles\") 가 붙은 getArticles 를 찾습니다.", "이 클래스는 @RestController 가 아니라 @Controller 입니다. 그래서 return 값은 화면 파일 이름으로 쓰입니다."], "data": {"kind": "pre", "label": "찾은 대상", "text": "GET /articles  →  BlogViewController.getArticles(Model model)"}, "nofile": null, "hlLines": [17, const FILES = {"SpringBootDeveloperApplication.java": "package me.shinsunyoung.springbootdeveloper;\n\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.data.jpa.repository.config.EnableJpaAuditing;\n\n@EnableJpaAuditing\n@SpringBootApplication\npublic class SpringBootDeveloperApplication {\n\n    public static void main(String[] args) {\n\n        SpringApplication.run(SpringBootDeveloperApplication.class, args);\n    }\n}", "controller/BlogViewController.java": "package me.shinsunyoung.springbootdeveloper.controller;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\nimport me.shinsunyoung.springbootdeveloper.dto.ArticleListViewResponse;\nimport me.shinsunyoung.springbootdeveloper.dto.ArticleViewResponse;\nimport me.shinsunyoung.springbootdeveloper.service.BlogService;\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.RequestParam;\n\nimport java.util.List;\n\n@RequiredArgsConstructor\n@Controller\npublic class BlogViewController {\n\n    private final BlogService blogService;\n\n    @GetMapping(\"/articles\")\n    public String getArticles(Model model) {\n\n        List<ArticleListViewResponse> articles = blogService.findAll().stream()\n                .map(ArticleListViewResponse::new)\n                .toList();\n\n        model.addAttribute(\"articles\", articles);\n\n        return \"articleList\";\n    }\n\n    @GetMapping(\"/articles/{id}\")\n    public String getArticle(@PathVariable Long id, Model model) {\n\n        Article article = blogService.findById(id);\n\n        model.addAttribute(\"article\", new ArticleViewResponse(article));\n\n        return \"article\";\n    }\n\n    @GetMapping(\"/new-article\")\n    public String newArticle(@RequestParam(required = false) Long id, Model model) {\n\n        if (id == null) {\n\n            model.addAttribute(\"article\", new ArticleViewResponse());\n\n        } else {\n\n            Article article = blogService.findById(id);\n\n            model.addAttribute(\"article\", new ArticleViewResponse(article));\n        }\n\n        return \"newArticle\";\n    }\n}", "controller/BlogApiController.java": "package me.shinsunyoung.springbootdeveloper.controller;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\nimport me.shinsunyoung.springbootdeveloper.dto.AddArticleRequest;\nimport me.shinsunyoung.springbootdeveloper.dto.ArticleResponse;\nimport me.shinsunyoung.springbootdeveloper.dto.UpdateArticleRequest;\nimport me.shinsunyoung.springbootdeveloper.service.BlogService;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.*;\n\nimport java.util.List;\n\n@RequiredArgsConstructor\n@RestController\npublic class BlogApiController {\n\n    private final BlogService blogService;\n\n    @PostMapping(\"/api/articles\")\n    public ResponseEntity<Article> addArticle(@RequestBody AddArticleRequest request) {\n\n        Article savedArticle = blogService.save(request);\n\n        return ResponseEntity.status(HttpStatus.CREATED)\n                .body(savedArticle);\n    }\n\n    @GetMapping(\"/api/articles\")\n    public ResponseEntity<List<ArticleResponse>> findAllArticles() {\n\n        List<ArticleResponse> articles = blogService.findAll()\n                .stream()\n                .map(ArticleResponse::new)\n                .toList();\n\n        return ResponseEntity.ok()\n                .body(articles);\n    }\n\n    @GetMapping(\"/api/articles/{id}\")\n    public ResponseEntity<ArticleResponse> findArticle(@PathVariable long id) {\n\n        Article article = blogService.findById(id);\n\n        return ResponseEntity.ok()\n                .body(new ArticleResponse(article));\n    }\n\n    @DeleteMapping(\"/api/articles/{id}\")\n    public ResponseEntity<Void> deleteArticle(@PathVariable long id) {\n\n        blogService.delete(id);\n\n        return ResponseEntity.ok()\n                .build();\n    }\n\n    @PutMapping(\"/api/articles/{id}\")\n    public ResponseEntity<Article> updateArticle(@PathVariable long id,\n                                                 @RequestBody UpdateArticleRequest request) {\n        Article updatedArticle = blogService.update(id, request);\n\n        return ResponseEntity.ok()\n                .body(updatedArticle);\n    }\n}", "service/BlogService.java": "package me.shinsunyoung.springbootdeveloper.service;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\nimport me.shinsunyoung.springbootdeveloper.dto.AddArticleRequest;\nimport me.shinsunyoung.springbootdeveloper.dto.UpdateArticleRequest;\nimport me.shinsunyoung.springbootdeveloper.repository.BlogRepository;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport java.util.List;\n\n@RequiredArgsConstructor\n@Service\npublic class BlogService {\n\n    private final BlogRepository blogRepository;\n\n    public Article save(AddArticleRequest request) {\n\n        return blogRepository.save(request.toEntity());\n    }\n\n    public List<Article> findAll() {\n        return blogRepository.findAll();\n    }\n\n    public Article findById(long id) {\n\n        return blogRepository.findById(id)\n                .orElseThrow(() -> new IllegalArgumentException(\"not found: \" + id));\n    }\n\n    public void delete(long id) {\n\n        blogRepository.deleteById(id);\n    }\n\n    @Transactional\n    public Article update(long id, UpdateArticleRequest request) {\n\n        Article article = blogRepository.findById(id)\n                .orElseThrow(() -> new IllegalArgumentException(\"not found: \" + id));\n\n        article.update(request.getTitle(), request.getContent());\n\n        return article;\n    }\n}", "domain/Article.java": "package me.shinsunyoung.springbootdeveloper.domain;\n\nimport jakarta.persistence.*;\nimport lombok.AccessLevel;\nimport lombok.Builder;\nimport lombok.Getter;\nimport lombok.NoArgsConstructor;\nimport org.springframework.data.annotation.CreatedDate;\nimport org.springframework.data.annotation.LastModifiedDate;\nimport org.springframework.data.jpa.domain.support.AuditingEntityListener;\n\nimport java.time.LocalDateTime;\n\n@EntityListeners(AuditingEntityListener.class)\n@Entity\n@Getter\n@NoArgsConstructor(access = AccessLevel.PROTECTED)\npublic class Article {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id\", updatable = false)\n    private Long id;\n\n    @Column(name = \"title\", nullable = false)\n    private String title;\n\n    @Column(name = \"content\", nullable = false)\n    private String content;\n\n    @CreatedDate\n    @Column(name = \"created_at\")\n    private LocalDateTime createdAt;\n\n    @LastModifiedDate\n    @Column(name = \"updated_at\")\n    private LocalDateTime updatedAt;\n\n    @Builder\n    public Article(String title, String content) {\n        this.title = title;\n        this.content = content;\n    }\n\n    public void update(String title, String content) {\n        this.title = title;\n        this.content = content;\n    }\n}", "dto/ArticleListViewResponse.java": "package me.shinsunyoung.springbootdeveloper.dto;\n\nimport lombok.Getter;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\n\n@Getter\npublic class ArticleListViewResponse {\n\n    private final Long id;\n\n    private final String title;\n\n    private final String content;\n\n    public ArticleListViewResponse(Article article) {\n\n        this.id = article.getId();\n\n        this.title = article.getTitle();\n\n        this.content = article.getContent();\n    }\n}", "dto/ArticleViewResponse.java": "package me.shinsunyoung.springbootdeveloper.dto;\n\nimport lombok.Getter;\nimport lombok.NoArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\n\nimport java.time.LocalDateTime;\n\n@NoArgsConstructor\n@Getter\npublic class ArticleViewResponse {\n\n    private Long id;\n\n    private String title;\n\n    private String content;\n\n    private LocalDateTime createdAt;\n\n    public ArticleViewResponse(Article article) {\n\n        this.id = article.getId();\n\n        this.title = article.getTitle();\n\n        this.content = article.getContent();\n\n        this.createdAt = article.getCreatedAt();\n    }\n}", "templates/articleList.html": "<!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>블로그 글 목록<\/title>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\">\n<\/head>\n<body>\n<div class=\"p-5 mb-5 text-center<\/> bg-light\">\n    <h1 class=\"mb-3\">My Blog<\/h1>\n    <h4 class=\"mb-3\">블로그에 오신 것을 환영합니다.<\/h4>\n<\/div>\n\n<div class=\"container\">\n    <button type=\"button\" id=\"create-btn\"\n            th:onclick=\"|location.href='@{/new-article}'|\"\n            class=\"btn btn-secondary btn-sm mb-3\">글 등록<\/button>\n    <div class=\"row-6\" th:each=\"item : ${articles}\">\n        <div class=\"card\">\n            <div class=\"card-header\" th:text=\"${item.id}\">\n            <\/div>\n            <div class=\"card-body\">\n                <h5 class=\"card-title\" th:text=\"${item.title}\"><\/h5>\n                <p class=\"card-text\" th:text=\"${item.content}\"><\/p>\n                <a th:href=\"@{/articles/{id}(id=${item.id})}\" class=\"btn btn-primary\">보러가기<\/a>\n            <\/div>\n        <\/div>\n        <br>\n    <\/div>\n<\/div>\n<script src=\"/js/article.js\"><\/script>\n<\/body>", "templates/article.html": "<!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>블로그 글<\/title>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\">\n<\/head>\n<body>\n    <div class=\"p-5 mb-5 text-center<\/> bg-light\">\n        <h1 class=\"mb-3\">My Blog<\/h1>\n        <h4 class=\"mb-3\">블로그에 오신 것을 환영합니다.<\/h4>\n    <\/div>\n\n    <div class=\"container mt-5\">\n        <div class=\"row\">\n            <div class=\"col-lg-8\">\n                <article>\n                    <input type=\"hidden\" id=\"article-id\" th:value=\"${article.id}\">\n                    <header class=\"mb-4\">\n                        <h1 class=\"fw-bolder mb-1\" th:text=\"${article.title}\"><\/h1>\n                        <div class=\"text-muted fst-italic mb-2\" th:text=\"|Posted on ${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}|\"><\/div>\n                    <\/header>\n                    <section class=\"mb-5\">\n                        <p class=\"fs-5 mb-4\" th:text=\"${article.content}\"><\/p>\n                    <\/section>\n                    <button type=\"button\" id=\"modify-btn\"\n                            th:onclick=\"|location.href='@{/new-article?id={articleId}(articleId=${article.id})}'|\"\n                            class=\"btn btn-primary btn-sm\">수정<\/button>\n                    <button type=\"button\" id=\"delete-btn\"\n                            class=\"btn btn-secondary btn-sm\">삭제<\/button>\n                <\/article>\n            <\/div>\n        <\/div>\n    <\/div>\n    <script src=\"/js/article.js\"><\/script>\n<\/body>", "templates/newArticle.html": "<!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>블로그 글<\/title>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\">\n<\/head>\n<body>\n    <div class=\"p-5 mb-5 text-center<\/> bg-light\">\n        <h1 class=\"mb-3\">My Blog<\/h1>\n        <h4 class=\"mb-3\">블로그에 오신 것을 환영합니다.<\/h4>\n    <\/div>\n\n    <div class=\"container mt-5\">\n        <div class=\"row\">\n            <div class=\"col-lg-8\">\n                <article>\n                    <input type=\"hidden\" id=\"article-id\" th:value=\"${article.id}\">\n\n                    <header class=\"mb-4\">\n                        <input type=\"text\" class=\"form-control\" placeholder=\"제목\" id=\"title\" th:value=\"${article.title}\">\n                    <\/header>\n                    <section class=\"mb-5\">\n                        <textarea class=\"form-control h-25\" rows=\"10\" placeholder=\"내용\" id=\"content\" th:text=\"${article.content}\"><\/textarea>\n                    <\/section>\n                    <button th:if=\"${article.id} != null\" type=\"button\" id=\"modify-btn\" class=\"btn btn-primary btn-sm\">수정<\/button>\n                    <button th:if=\"${article.id} == null\" type=\"button\" id=\"create-btn\" class=\"btn btn-primary btn-sm\">등록<\/button>\n                <\/article>\n            <\/div>\n        <\/div>\n    <\/div>\n    <script src=\"/js/article.js\"><\/script>\n<\/body>", "static/js/article.js": "const deleteButton = document.getElementById('delete-btn');\n\nif (deleteButton) {\n\n    deleteButton.addEventListener('click', event => {\n\n        let id = document.getElementById('article-id').value;\n\n        fetch(`/api/articles/${id}`, {\n            method: 'DELETE'\n        })\n            .then(() => {\n\n                alert('삭제가 완료되었습니다.');\n\n                location.replace('/articles');\n            });\n    });\n}\n\nconst modifyButton = document.getElementById('modify-btn');\n\nif (modifyButton) {\n\n    modifyButton.addEventListener('click', event => {\n\n        let params = new URLSearchParams(location.search);\n\n        let id = params.get('id');\n\n        fetch(`/api/articles/${id}`, {\n\n            method: 'PUT',\n\n            headers: {\n                \"Content-Type\": \"application/json\",\n            },\n\n            body: JSON.stringify({\n                title: document.getElementById('title').value,\n                content: document.getElementById('content').value\n            })\n        })\n            .then(() => {\n\n                alert('수정이 완료되었습니다.');\n\n                location.replace(`/articles/${id}`);\n            });\n    });\n}\n\nconst createButton = document.getElementById('create-btn');\n\nif (createButton) {\n\n    createButton.addEventListener('click', event => {\n\n        fetch('/api/articles', {\n\n            method: 'POST',\n\n            headers: {\n                \"Content-Type\": \"application/json\",\n            },\n\n            body: JSON.stringify({\n                title: document.getElementById('title').value,\n                content: document.getElementById('content').value\n            })\n        })\n            .then(() => {\n\n                alert('등록 완료되었습니다.');\n\n                location.replace('/articles');\n            });\n    });\n}", "import.sql": "INSERT INTO article (title, content, created_at, updated_at) VALUES ('제목 1', '내용 1', NOW(), NOW())\n\nINSERT INTO article (title, content, created_at, updated_at) VALUES ('제목 2', '내용 2', NOW(), NOW())\n\nINSERT INTO article (title, content, created_at, updated_at) VALUES ('제목 3', '내용 3', NOW(), NOW())", "수정판/static/js/article.js": "function failMessage(response) {\n    if (response.status === 404) {\n        return '글을 찾을 수 없습니다. (HTTP 404)';\n    }\n    return '요청 처리에 실패했습니다. (HTTP ' + response.status + ')';\n}\n\nconst deleteButton = document.getElementById('delete-btn');\n\nif (deleteButton) {\n\n    deleteButton.addEventListener('click', event => {\n\n        let id = document.getElementById('article-id').value;\n\n        fetch(`/api/articles/${id}`, {\n            method: 'DELETE'\n        })\n            .then(response => {\n\n                if (!response.ok) {\n                    alert(failMessage(response));\n                    return;\n                }\n\n                alert('삭제가 완료되었습니다.');\n                location.replace('/articles');\n            })\n            .catch(() => alert('서버와 연결하지 못했습니다.'));\n    });\n}\n\nconst modifyButton = document.getElementById('modify-btn');\n\nconst titleInput = document.getElementById('title');\n\nif (modifyButton && titleInput) {\n\n    modifyButton.addEventListener('click', event => {\n\n        let params = new URLSearchParams(location.search);\n\n        let id = params.get('id');\n\n        fetch(`/api/articles/${id}`, {\n\n            method: 'PUT',\n\n            headers: {\n                \"Content-Type\": \"application/json\",\n            },\n\n            body: JSON.stringify({\n                title: document.getElementById('title').value,\n                content: document.getElementById('content').value\n            })\n        })\n            .then(response => {\n\n                if (!response.ok) {\n                    alert(failMessage(response));\n                    return;\n                }\n\n                alert('수정이 완료되었습니다.');\n                location.replace(`/articles/${id}`);\n            })\n            .catch(() => alert('서버와 연결하지 못했습니다.'));\n    });\n}\n\nconst createButton = document.getElementById('create-btn');\n\nif (createButton && titleInput) {\n\n    createButton.addEventListener('click', event => {\n\n        fetch('/api/articles', {\n            method: 'POST',\n            headers: {\n                \"Content-Type\": \"application/json\",\n            },\n            body: JSON.stringify({\n                title: document.getElementById('title').value,\n                content: document.getElementById('content').value\n            })\n        })\n            .then(response => {\n\n                if (!response.ok) {\n                    alert(failMessage(response));\n                    return;\n                }\n\n                alert('등록 완료되었습니다.');\n                location.replace('/articles');\n            })\n            .catch(() => alert('서버와 연결하지 못했습니다.'));\n    });\n}", "수정판/service/BlogService.java": "package me.shinsunyoung.springbootdeveloper.service;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\nimport me.shinsunyoung.springbootdeveloper.dto.AddArticleRequest;\nimport me.shinsunyoung.springbootdeveloper.dto.UpdateArticleRequest;\nimport me.shinsunyoung.springbootdeveloper.repository.BlogRepository;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\nimport org.springframework.web.server.ResponseStatusException;\n\nimport java.util.List;\n\n@RequiredArgsConstructor\n@Service\npublic class BlogService {\n\n    private final BlogRepository blogRepository;\n\n    public Article save(AddArticleRequest request) {\n\n        return blogRepository.save(request.toEntity());\n    }\n\n    public List<Article> findAll() {\n        return blogRepository.findAll();\n    }\n\n    public Article findById(long id) {\n\n        return blogRepository.findById(id)\n                .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"not found: \" + id));\n    }\n\n    public void delete(long id) {\n\n        if (!blogRepository.existsById(id)) {\n            throw new ResponseStatusException(HttpStatus.NOT_FOUND, \"not found: \" + id);\n        }\n\n        blogRepository.deleteById(id);\n    }\n\n    @Transactional\n    public Article update(long id, UpdateArticleRequest request) {\n\n        Article article = blogRepository.findById(id)\n                .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"not found: \" + id));\n\n        article.update(request.getTitle(), request.getContent());\n\n        return article;\n    }\n}", "수정판/templates/article.html": "<!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>블로그 글<\/title>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\">\n<\/head>\n<body>\n    <div class=\"p-5 mb-5 text-center bg-light\">\n        <h1 class=\"mb-3\">My Blog<\/h1>\n        <h4 class=\"mb-3\">블로그에 오신 것을 환영합니다.<\/h4>\n    <\/div>\n\n    <div class=\"container mt-5\">\n        <div class=\"row\">\n            <div class=\"col-lg-8\">\n                <article>\n                    <input type=\"hidden\" id=\"article-id\" th:value=\"${article.id}\">\n                    <header class=\"mb-4\">\n                        <h1 class=\"fw-bolder mb-1\" th:text=\"${article.title}\"><\/h1>\n                        <div class=\"text-muted fst-italic mb-2\" th:text=\"|Posted on ${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}|\"><\/div>\n                    <\/header>\n                    <section class=\"mb-5\">\n                        <p class=\"fs-5 mb-4\" th:text=\"${article.content}\"><\/p>\n                    <\/section>\n                    <button type=\"button\" id=\"modify-btn\"\n                            th:onclick=\"|location.href='@{/new-article?id={articleId}(articleId=${article.id})}'|\"\n                            class=\"btn btn-primary btn-sm\">수정<\/button>\n                    <button type=\"button\" id=\"delete-btn\"\n                            class=\"btn btn-secondary btn-sm\">삭제<\/button>\n                <\/article>\n            <\/div>\n        <\/div>\n    <\/div>\n    <script src=\"/js/article.js\"><\/script>\n<\/body>\n<\/html>"};
const PATHS = {"SpringBootDeveloperApplication.java": "src/main/java/me/shinsunyoung/springbootdeveloper/SpringBootDeveloperApplication.java", "controller/BlogViewController.java": "src/main/java/me/shinsunyoung/springbootdeveloper/controller/BlogViewController.java", "controller/BlogApiController.java": "src/main/java/me/shinsunyoung/springbootdeveloper/controller/BlogApiController.java", "service/BlogService.java": "src/main/java/me/shinsunyoung/springbootdeveloper/service/BlogService.java", "domain/Article.java": "src/main/java/me/shinsunyoung/springbootdeveloper/domain/Article.java", "dto/ArticleListViewResponse.java": "src/main/java/me/shinsunyoung/springbootdeveloper/dto/ArticleListViewResponse.java", "dto/ArticleViewResponse.java": "src/main/java/me/shinsunyoung/springbootdeveloper/dto/ArticleViewResponse.java", "templates/articleList.html": "src/main/resources/templates/articleList.html", "templates/article.html": "src/main/resources/templates/article.html", "templates/newArticle.html": "src/main/resources/templates/newArticle.html", "static/js/article.js": "src/main/resources/static/js/article.js", "import.sql": "src/main/resources/import.sql", "수정판/static/js/article.js": "(수정판) src/main/resources/static/js/article.js", "수정판/service/BlogService.java": "(수정판) src/main/java/me/shinsunyoung/springbootdeveloper/service/BlogService.java", "수정판/templates/article.html": "(수정판) src/main/resources/templates/article.html"};

const $ = (id) => document.getElementById(id);
const stack = $('stack'), packet = $('packet');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let sc = 0, cur = 0, timer = null, bands = [], dotBtns = [], phases = [];
let STEPS = [], NODES = [];

// 시나리오 탭 만들기
const tabBtns = SCENARIOS.map((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
  b.textContent = s.tab;
  b.addEventListener('click', () => { stop(); load(i); });
  $('tabs').appendChild(b);
  return b;
});

function buildStage() {
  bands.forEach((b) => b.remove());
  bands = NODES.map((n, i) => {
    const d = document.createElement('div');
    d.className = 'band' + (n.db ? ' db' : '');
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = n.name;
    const sb = document.createElement('div'); sb.className = 'sb'; sb.textContent = n.sub;
    d.append(nm, sb);
    stack.appendChild(d);
    return d;
  });
  $('dots').innerHTML = ''; dotBtns = [];
  // 단계 번호는 단계 순서대로 놓고, 묶음(요청, 응답 등)이 바뀌는 곳에서만 묶음 이름을 붙입니다.
  phases = [];
  let g = null, last = null;
  STEPS.forEach((s, i) => {
    if (!phases.includes(s.phase)) phases.push(s.phase);
    if (s.phase !== last) {
      g = document.createElement('div'); g.className = 'grp';
      const gl = document.createElement('span'); gl.className = 'gl'; gl.textContent = s.phase;
      g.appendChild(gl);
      $('dots').appendChild(g);
      last = s.phase;
    }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dot'; b.textContent = i + 1;
    b.setAttribute('aria-label', (i + 1) + '단계 : ' + s.title);
    b.addEventListener('click', () => { stop(); go(i); });
    g.appendChild(b); dotBtns[i] = b;
  });
}

function load(i) {
  sc = i;
  const s = SCENARIOS[sc];
  STEPS = s.steps; NODES = s.nodes;
  tabBtns.forEach((b, k) => b.setAttribute('aria-selected', k === sc ? 'true' : 'false'));
  tabBtns[sc].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('scen').innerHTML = '';
  s.summary.forEach((part) => {
    if (part.code) { const c = document.createElement('code'); c.textContent = part.code; $('scen').appendChild(c); }
    else $('scen').appendChild(document.createTextNode(part.text));
  });
  buildStage();
  go(0);
}

function centerY(i) {
  const b = bands[i];
  return b.offsetTop + b.offsetHeight / 2 - 8;
}

function placePacket(step) {
  packet.className = 'packet ' + (step.dir === 'none' ? '' : step.dir);
  if (step.move) {
    const [from, to] = step.move;
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(from) + 'px)';
    void packet.offsetHeight;
    packet.style.transition = reduce ? 'none' : 'transform 1s cubic-bezier(.45,0,.2,1)';
    packet.style.transform = 'translateY(' + centerY(to) + 'px)';
  } else {
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(step.active[0]) + 'px)';
    packet.classList.add('pulse');
  }
}

function renderCode(step) {
  const wrap = $('codewrap');
  wrap.innerHTML = '';
  if (!step.file) {
    $('fname').textContent = '프로젝트 파일 없음';
    $('fpath').textContent = step.nofile || '이 단계는 스프링 부트 라이브러리나 브라우저가 처리합니다.';
    $('hlcount').textContent = '';
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = '이 단계에서는 개발자가 작성한 파일이 실행되지 않습니다. 왼쪽에서 신호가 지나가는 구간을 확인하세요.';
    wrap.appendChild(e);
    return;
  }
  $('fname').textContent = step.file.split('/').pop();
  $('fpath').textContent = PATHS[step.file];
  const box = document.createElement('div'); box.className = 'code'; box.tabIndex = 0;
  box.setAttribute('aria-label', step.file + ' 코드');
  let first = null, n = 0;
  FILES[step.file].split('\n').forEach((line, i) => {
    const row = document.createElement('div'); row.className = 'ln';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = i + 1;
    const tx = document.createElement('span'); tx.textContent = line || ' ';
    row.append(no, tx);
    if (step.hlLines.includes(i + 1)) {
      row.classList.add('hl'); n++;
      if (!first) first = row;
    }
    box.appendChild(row);
  });
  wrap.appendChild(box);
  $('hlcount').textContent = n ? '강조된 줄 ' + n + '개 : 이 단계에서 실행되거나 쓰이는 코드' : '';
  if (first) box.scrollTop = Math.max(0, first.offsetTop - box.clientHeight / 3);
}

function renderData(step) {
  const d = step.data, body = $('dbody');
  $('dlabel').textContent = d.label;
  body.innerHTML = '';
  if (d.kind === 'table') {
    const t = document.createElement('table');
    const tr = document.createElement('tr');
    d.cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); });
    t.appendChild(tr);
    d.rows.forEach((r) => {
      const row = document.createElement('tr');
      r.forEach((c) => { const td = document.createElement('td'); td.textContent = c; row.appendChild(td); });
      t.appendChild(row);
    });
    const w = document.createElement('div'); w.style.overflowX = 'auto'; w.appendChild(t);
    body.appendChild(w);
  } else if (d.kind === 'browser') {
    const b = document.createElement('div'); b.className = 'browser';
    const bar = document.createElement('div'); bar.className = 'bar'; bar.textContent = d.url;
    const v = document.createElement('div'); v.className = 'view'; v.style.whiteSpace = 'pre-wrap'; v.textContent = d.text;
    b.append(bar, v); body.appendChild(b);
  } else {
    const p = document.createElement('pre'); p.textContent = d.text; body.appendChild(p);
  }
}

function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  $('stepno').textContent = (cur + 1) + ' / ' + STEPS.length + '단계';
  const ph = $('phase');
  ph.textContent = s.phase;
  ph.className = 'phase ' + (PHASE_CLASS[s.phase] || 'p0');
  $('title').textContent = s.title;
  const ol = $('desc'); ol.innerHTML = '';
  s.desc.forEach((t) => { const li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
  bands.forEach((b, k) => { b.className = 'band' + (NODES[k].db ? ' db' : ''); });
  s.active.forEach((k) => bands[k].classList.add('active', s.dir));
  renderCode(s);
  renderData(s);
  ['desc', 'codewrap', 'dbody'].forEach((id) => { const el = $(id); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });
  placePacket(s);
  dotBtns.forEach((b, k) => { b.classList.toggle('cur', k === cur); b.classList.toggle('done', k < cur); b.setAttribute('aria-current', k === cur ? 'step' : 'false'); });
  if (dotBtns[cur]) dotBtns[cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('prev').disabled = cur === 0; $('first').disabled = cur === 0;
  $('next').disabled = cur === STEPS.length - 1;
}

function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = '자동 재생'; }
function play() {
  if (timer) { stop(); return; }
  if (cur === STEPS.length - 1) go(0);
  $('play').textContent = '멈춤';
  timer = setInterval(() => { if (cur >= STEPS.length - 1) { stop(); return; } go(cur + 1); }, 4200);
}

$('first').addEventListener('click', () => { stop(); go(0); });
$('prev').addEventListener('click', () => { stop(); go(cur - 1); });
$('next').addEventListener('click', () => { stop(); go(cur + 1); });
$('play').addEventListener('click', play);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('.code')) return;
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
});
window.addEventListener('resize', () => placePacket(Object.assign({}, STEPS[cur], { move: null })));

$('dl').addEventListener('click', () => {
  stop();
  const blob = new Blob([ORIGINAL_HTML], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "chapter7-request-flow.html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

load(0);
</script>
</body>
</html>
