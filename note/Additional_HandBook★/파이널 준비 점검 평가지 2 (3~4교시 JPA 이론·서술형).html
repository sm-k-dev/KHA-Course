<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>파이널 준비 점검 평가지 2</title><style>*{box-sizing:border-box}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#1d2540;margin:0;background:#f5f7fb;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:22px;margin:8px 0}
code{background:#eef1f8;border-radius:4px;padding:1px 5px;font-size:.92em;font-family:Consolas,"D2Coding",monospace}
.muted{color:#6b7280}
.warn{background:#fff4f2;border:1px solid #f6cdc6;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.note{background:#e7f6ec;border:1px solid #bfe5cc;border-radius:8px;padding:10px 14px;margin:14px 0}
.big{border:0;border-radius:8px;background:#1d2540;color:#fff;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14.5px}
button{font-family:inherit;cursor:pointer}
.startbox{background:#fff;border:1px solid #d9deea;border-radius:12px;padding:16px 20px;margin:12px 0}
.startbox label{display:inline-block;margin:6px 14px 6px 0;font-weight:700}
.startbox input{border:1px solid #c9cfdd;border-radius:8px;padding:8px;font:inherit;width:170px}
.statusbar{position:sticky;top:0;z-index:5;background:#1d2540;color:#fff;padding:8px 14px;border-radius:0 0 10px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.statusbar .big{margin-left:auto;background:#ffd24a;color:#1d2540}.statusbar.late{background:#b3261e}
h2.part{margin:24px 0 8px;font-size:18px;border-bottom:2px solid #1d2540;padding-bottom:4px}
.q{background:#fff;border:1px solid #d9deea;border-radius:12px;padding:10px 16px;margin:12px 0}
.qh{font-size:15px;margin-bottom:4px}.pts{color:#b3261e;font-weight:700}.tp{color:#6b7280;font-size:12.5px;margin-left:6px}
.qt{margin:4px 0 8px}
.qc{background:#fbfcfe;border:1px solid #d9deea;border-radius:8px;padding:8px 10px;font-size:12.8px;line-height:1.55;overflow-x:auto;white-space:pre;font-family:Consolas,"D2Coding",monospace;margin:6px 0}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid #d9deea;border-radius:8px;margin:5px 0;cursor:pointer;background:#fff}
.opts label:hover{background:#f6f8ff}.opts input{margin-top:5px}
.in{width:100%;border:1px solid #c9cfdd;border-radius:8px;padding:8px;font:inherit;font-size:14px}
.num .in{width:140px}
/* 채점기 */
.drop{border:2px dashed #8aa0d6;border-radius:12px;padding:16px;background:#fff;text-align:center;margin:10px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.stats div{background:#fff;border:1px solid #d9deea;border-radius:10px;padding:8px 16px;font-size:15px}
table.st,table.rep{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
.st th,.st td,.rep th,.rep td{border:1px solid #d9deea;padding:5px 8px;vertical-align:top;text-align:left}
th{background:#eef1f8}.sc{font-weight:800;text-align:center}.fl{color:#b3261e;font-size:12.5px}
.tw{overflow-x:auto}.bar{margin:10px 0}.bar button,.st button{border:1px solid #c9cfdd;background:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.detailbox{background:#fff;border:2px solid #1d2540;border-radius:12px;padding:12px 16px;margin:14px 0}
.rephead{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:6px}.rephead h2{margin:0 12px 0 0}.repinfo span{margin-right:14px}.repscore{margin-left:auto;font-size:20px}.repscore b{font-size:30px;color:#1a7f4b}
.rep tr.ok td.sc{background:#e7f6ec}.rep tr.ng td.sc{background:#fdeeee}.rep tr.pa td.sc{background:#fff7dd}
.qq{font-size:12.5px;color:#4b5563;margin-bottom:3px}.stu pre{margin:2px 0;white-space:pre-wrap;word-break:break-all;font-family:inherit;background:#f3f5fa;padding:4px 6px;border-radius:6px}
.cor{background:#f3faf5;padding:3px 6px;border-radius:6px;margin:3px 0}.crit{font-size:12.5px;color:#374151}
.kw{border-radius:10px;padding:0 6px;margin-right:2px}.kw.y{background:#e7f6ec;color:#1a7f4b}.kw.n{background:#fdeeee;color:#b3261e}
.ovi{width:58px}
#reports{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;font-size:11px}
  body.printing .wrap>*:not(#reports){display:none!important}
  body.printing #reports{display:block}
  body.printing .report{page-break-after:always}
  body.printsum .wrap>*:not(#summaryarea){display:none!important}
  body.printsum #summaryarea button,body.printsum #summaryarea .bar{display:none!important}
  .rep th,.rep td{padding:2px 5px;font-size:10px}.qq{font-size:9.5px}.crit{font-size:9.5px}
  .rep tr{page-break-inside:avoid}
  .repscore b{font-size:22px}
}
@media (max-width:700px){.statusbar .big{margin-left:0}}

.wh{margin:8px 0 4px;font-size:13px}.rep.wr td{font-size:10px}
@media print{.wh{font-size:11px}.rep td{font-size:9.5px}.rephead h2{font-size:15px}}

@media print{body.printing .report:last-child{page-break-after:auto}}

code{overflow-wrap:anywhere}.qt,.opts span,.q{overflow-wrap:anywhere}

.demobar{background:#fff3cd;border:1px solid #e0c36a;border-radius:8px;padding:6px 12px;font-weight:800;margin:0 0 8px;text-align:center}

.st td:nth-child(2),.st td:nth-child(3),.st td:nth-child(1){white-space:nowrap}

.hint{display:block;margin-top:4px;color:#1a6bb3;font-size:13.5px;background:#eef6ff;border-radius:6px;padding:3px 8px}.lv{color:#d98a00;font-size:12.5px;margin-left:4px}
</style></head><body><div class="wrap"><h1>파이널 프로젝트 준비 점검 평가 · 평가지 2 (JPA 이론 · 서술형)</h1><p class="muted">3교시 JPA 이론(20문항 100점, 50분), 쉬는 시간 10분, 4교시 JPA 서술형(5문항 100점, 50분) 순서로 진행합니다. 3교시는 보기 고르기와 숫자 계산이고, 4교시는 모두 직접 쓰는 문제입니다. 문항 옆 ★ 은 난이도(★ 쉬움 · ★★ 보통 · ★★★ 어려움)이니 <b>쉬운 문제부터</b> 푸세요. 답은 이 브라우저에 자동 저장됩니다.</p><div id="paper"></div><p class="muted"><button id="resetbtn">저장된 답 지우고 처음부터</button></p></div><script>window.PAPER={limit:50,sections:[{"id": 1, "name": "3교시 JPA 이론", "limit": 50, "parts": ["JPA", "사건"]}, {"id": 2, "name": "4교시 JPA 서술형", "limit": 50, "parts": ["서술"]}],items:[{"id": "A1", "no": 1, "part": "JPA", "topic": "A 연관관계", "pts": 5, "k": "mc", "lv": 1, "pick": [{"cls": "Zzim", "name": "member", "typ": "Member", "col": "member_id"}, {"cls": "Zzim", "name": "store", "typ": "Store", "col": "store_id"}, {"cls": "Review", "name": "store", "typ": "Store", "col": "store_id"}], "q": "<code>{cls}</code> 엔티티의 아래 필드는 외래키(FK) 컬럼 <code>{col}</code> 을 만듭니다. 이 외래키 컬럼은 <b>어느 테이블</b>에 생기나요?", "code": ["@ManyToOne", "@JoinColumn(name = \"{col}\")", "private {typ} {name};"], "ch": ["store 테이블", "review 테이블", "zzim 테이블", "members 테이블"]}, {"id": "A2", "no": 2, "part": "JPA", "topic": "A 연관관계", "pts": 5, "k": "mc", "lv": 1, "pick": [{"mode": "mirror", "code": ["Store x = storeRepository.findById(storeId).get();", "Review r = reviewRepository.findById(reviewId).get();   // r.store 는 null", "x.getReviews().add(r);", "// 트랜잭션 커밋"]}, {"mode": "owner", "code": ["Store x = storeRepository.findById(storeId).get();", "Review r = new Review(x, writer, \"맛있어요\", 5);", "reviewRepository.save(r);", "// 트랜잭션 커밋"]}], "q": "아래 코드가 커밋된 뒤 DB 의 <code>review.store_id</code> 에는 무엇이 들어 있을까요? (<code>Store.reviews</code> 는 <code>@OneToMany(mappedBy = \"store\")</code>)", "code": "v.code", "ch": ["맛집 x 의 id 가 들어 있다", "null 로 남는다", "0 이 들어 있다", "예외가 나서 저장되지 않는다"]}, {"id": "A3", "no": 3, "part": "JPA", "topic": "A 연관관계", "pts": 5, "k": "mc", "lv": 1, "q": "양방향 연관관계 <code>@OneToMany(mappedBy = \"store\")</code> 에서 <b>mappedBy</b> 에 대한 설명으로 옳은 것은?", "code": ["// Store.java", "@OneToMany(mappedBy = \"store\")", "private List<Review> reviews = new ArrayList<>();"], "ch": ["외래키를 가진 쪽(주인)에 쓰며, 이 필드에 값을 넣으면 DB 외래키가 바뀐다", "주인이 아닌 쪽에 쓰며, 읽기 전용이라 이 필드에 값을 넣어도 DB 외래키는 바뀌지 않는다", "양쪽 엔티티 모두에 반드시 써야 한다", "값에는 컬럼 이름(store_id)을 쓴다"]}, {"id": "B1", "no": 4, "part": "JPA", "topic": "B 지연로딩·N+1", "pts": 5, "k": "num", "unit": "번", "lv": 1, "vars": {"N": [3, 4, 5, 6, 8]}, "q": "<code>StoreService.findStoreList()</code> 는 하나의 트랜잭션 안에서 실행됩니다. 맛집이 <b>{N}개</b>일 때(맛집마다 리뷰 3개), 이 코드가 실행하는 <b>SQL 은 모두 몇 번</b>인가요? <span class=\"hint\">힌트: 목록 조회 1번 + 반복문에서 맛집마다 1번 (<code>Store.reviews</code> 는 기본 LAZY)</span>", "code": ["List<Store> stores = storeRepository.findAll();   // 맛집 {N}개", "for (Store store : stores) {", "    result.add(new StoreListDto(", "            store.getId(),", "            store.getName(),", "            store.getArea(),", "            store.getZzimCount(),", "            (long) store.getReviews().size()));", "}"]}, {"id": "B2", "no": 5, "part": "JPA", "topic": "B 지연로딩·N+1", "pts": 5, "k": "mc", "lv": 1, "pick": [{"code": ["// Review.java", "@ManyToOne", "@JoinColumn(name = \"store_id\")", "private Store store;"]}, {"code": ["// Store.java", "@OneToMany(mappedBy = \"store\")", "private List<Review> reviews = new ArrayList<>();"]}, {"code": ["// Zzim.java", "@ManyToOne(fetch = FetchType.LAZY)", "@JoinColumn(name = \"store_id\")", "private Store store;"]}], "q": "아래 필드의 <b>로딩 방식</b>은 무엇인가요? (설정에서 fetch 를 바꾸지 않았다고 가정)", "code": "v.code", "ch": ["즉시 로딩(EAGER): 소유한 엔티티를 읽을 때 같이 읽는다", "지연 로딩(LAZY): 실제로 쓰는 순간 SELECT 한다", "읽지 않는다: 항상 직접 조회해야 한다", "fetch join 으로만 읽을 수 있다"]}, {"id": "B3", "no": 6, "part": "JPA", "topic": "B 지연로딩·N+1", "pts": 5, "k": "num", "unit": "번", "lv": 2, "vars": {"M": [3, 4, 5, 6, 8]}, "q": "찜 <b>{M}건</b>이 있고, 찜마다 서로 다른 맛집을 가리킵니다. <code>Zzim.store</code> 는 <code>FetchType.LAZY</code> 입니다. 아래 코드가 하나의 트랜잭션 안에서 실행하는 <b>SQL 은 모두 몇 번</b>인가요? <span class=\"hint\">힌트:
