<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8장 스프링 AI 요청과 응답 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF3; --panel:#FFFFFF; --ink:#1B2433; --muted:#596577; --line:#C6D0DC;
  --req:#2457C5; --req-soft:#DCE6FA; --res:#137A50; --res-soft:#D6EFE3;
  --db:#9A5B0C; --hl:#FFEFA8; --hl-ink:#3A2E00; --code:#F4F7FA; --rail:#B9C5D3;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",Consolas,"D2Coding",monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141922; --panel:#1C232E; --ink:#E4E9F0; --muted:#9AA5B4; --line:#323E4F;
    --req:#7AA2FF; --req-soft:#1F2E4F; --res:#4CC48C; --res-soft:#173A2B;
    --db:#E2A757; --hl:#4B4220; --hl-ink:#FFF1BF; --code:#161C25; --rail:#3A4759;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:120px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-0.01em}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:62ch}
.lead code{font-family:var(--mono);font-size:14px;color:var(--ink)}
button{font-family:var(--sans);font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
button:focus-visible{outline:3px solid var(--req);outline-offset:2px}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}

.grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px;align-items:start}

/* 왼쪽 : 구간 스택 */
.stage{position:sticky;top:16px}
.stack{position:relative;padding-left:40px}
.rail{position:absolute;left:17px;top:22px;bottom:22px;width:2px;background:var(--rail)}
.band{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;transition:border-color .3s, background .3s}
.band:last-child{margin-bottom:0}
.band .nm{font-weight:600;font-size:15px}
.band .sb{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.band::before{content:"";position:absolute;left:-28px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--panel);border:2px solid var(--rail)}
.band.db{border-style:dashed}
.band.active{border-width:2px;padding:9px 13px}
.band.active.req{border-color:var(--req);background:var(--req-soft)}
.band.active.res{border-color:var(--res);background:var(--res-soft)}
.band.active.none{border-color:var(--ink)}
.band.active::before{border-color:currentColor}
.band.active.req::before{background:var(--req);border-color:var(--req)}
.band.active.res::before{background:var(--res);border-color:var(--res)}
.band.active.none::before{background:var(--ink);border-color:var(--ink)}
.packet{position:absolute;left:10px;top:0;width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--panel);z-index:2;will-change:transform}
.packet.req{background:var(--req)}
.packet.res{background:var(--res)}
.packet.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--panel)}50%{box-shadow:0 0 0 4px var(--panel),0 0 0 9px var(--rail)}}
.legend{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .lq::before{background:var(--req)}
.legend .ls::before{background:var(--res)}
.legend .ln::before{background:var(--ink)}

/* 오른쪽 : 단계 설명 */
.detail{min-width:0}
.stephead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stepno{font-family:var(--mono);font-size:14px;color:var(--muted)}
.phase{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.phase.p0{color:var(--ink)}
.phase.p1{color:var(--req);border-color:var(--req)}
.phase.p2{color:var(--res);border-color:var(--res)}
h2{font-size:22px;line-height:1.35;margin:0 0 10px;font-weight:700}
ol.desc{margin:0 0 16px;padding-left:22px;max-width:70ch}
ol.desc li{margin:3px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.boxhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.boxhead .fname{font-family:var(--mono);font-weight:600;font-size:13.5px}
.boxhead .fpath{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.code{position:relative;background:var(--code);max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.code .ln{display:flex;white-space:pre;padding:0 12px 0 0;min-width:max-content}
.code .no{display:inline-block;width:40px;flex:0 0 40px;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.code .ln.hl{background:var(--hl);color:var(--hl-ink);box-shadow:inset 4px 0 0 var(--db)}
.code .ln.hl .no{color:var(--hl-ink)}
.empty{padding:16px 14px;color:var(--muted);font-size:14px;background:var(--code)}
.data pre{margin:0;padding:12px 14px;background:var(--code);font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.data table{border-collapse:collapse;margin:12px 14px;font-family:var(--mono);font-size:14px}
.data th,.data td{border:1px solid var(--line);padding:5px 14px;text-align:left}
.data th{background:var(--code)}
.browser{margin:12px 14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.browser .bar{background:var(--code);padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.browser .view{padding:12px;font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere;background:var(--panel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.tab{border-radius:8px 8px 0 0;border-bottom-width:3px;padding:8px 14px;font-weight:600;background:transparent}
.tab[aria-selected="true"]{border-color:var(--line);border-bottom-color:var(--ink);background:var(--panel)}
.scen{margin:0 0 16px;color:var(--muted);font-size:14.5px;max-width:90ch}
.scen code{font-family:var(--mono);font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* 아래 : 조작 바 */
.controls{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.controls .in{max-width:1180px;margin:0 auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns .sp{flex:1}
.dots{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}
.dots .grp{display:flex;gap:4px;align-items:center;margin-right:10px}
.dots .gl{font-size:12px;color:var(--muted);margin-right:4px}
.dot{width:26px;height:26px;padding:0;border-radius:6px;font-size:12px;font-family:var(--mono)}
.dot.done{background:var(--code)}
.dot.cur{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kbd{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr;gap:14px}
  .stage{position:static}
  .band{padding:6px 12px;margin-bottom:5px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
  .band.active{padding:5px 11px}
  .band .nm{font-size:14px}
  .band .sb{font-size:11.5px}
  .dots{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .dots .grp{flex:0 0 auto}
  .btns button{padding:7px 12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto}
  .tab{flex:0 0 auto;padding:7px 11px;font-size:13.5px}
  h1{font-size:21px}
  h2{font-size:19px}
  .code{font-size:12.5px;max-height:280px}
  .data pre{font-size:12.5px}
  .kbd{display:none}
  body{padding-bottom:118px}
}
@media (prefers-reduced-motion: reduce){
  .packet{transition:none !important}
  .packet.pulse,.fade{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>8장 스프링 AI 요청과 응답 흐름</h1>
      <p class="lead">8장의 AI 글쓰기 도우미, 이미지 업로드, 꺼 둔 AI 섬네일 기능이 어떤 파일의 어떤 코드를 지나 동작하는지 봅니다. 응답, SQL, 화면 동작은 8장 프로젝트를 실제로 실행해서 얻은 값입니다. 단, AI 답변 내용은 실제 OpenRouter 대신 모의 서버가 돌려준 예시입니다.</p>
    </div>
    <button type="button" class="primary" id="dl">HTML 파일 다운로드</button>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="시나리오"></div>
  <p class="scen" id="scen"></p>

  <div class="grid">
    <aside class="stage" aria-label="요청이 지나가는 구간">
      <div class="stack" id="stack">
        <div class="rail"></div>
        <div class="packet" id="packet" aria-hidden="true"></div>
      </div>
      <div class="legend"><span class="lq">요청 방향</span><span class="ls">응답 방향</span><span class="ln">준비·처리</span></div>
    </aside>

    <main class="detail">
      <div class="stephead">
        <span class="stepno" id="stepno"></span>
        <span class="phase" id="phase"></span>
      </div>
      <h2 id="title" aria-live="polite"></h2>
      <ol class="desc" id="desc"></ol>

      <section class="box" aria-label="실행되는 코드">
        <div class="boxhead"><div><div class="fname" id="fname"></div><div class="fpath" id="fpath"></div></div><span id="hlcount" class="fpath"></span></div>
        <div id="codewrap"></div>
      </section>

      <section class="box data" aria-label="오가는 데이터">
        <div class="boxhead"><span class="fname" id="dlabel"></span></div>
        <div id="dbody"></div>
      </section>
    </main>
  </div>
</div>

<nav class="controls" aria-label="단계 조작">
  <div class="in">
    <div class="btns">
      <button type="button" id="first">처음</button>
      <button type="button" id="prev">이전</button>
      <button type="button" class="primary" id="play">자동 재생</button>
      <button type="button" id="next">다음</button>
      <span class="sp"></span>
      <span class="kbd">키보드 ← → 로 이동</span>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</nav>

<script>
// 다운로드용 : 화면 요소를 추가하기 전, 처음 불러온 상태의 HTML 을 저장해 둡니다.
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const PHASE_CLASS = { '시작 준비': 'p0', '준비': 'p0', '요청': 'p1', '실행': 'p1', '응답': 'p2', '확인': 'p2', '정리': 'p0' };
const FILES = {"application.yml": "spring:\n  jpa:\n    show-sql: true\n    properties:\n      hibernate:\n        format_sql: true\n    defer-datasource-initialization: true\n  datasource:\n    url: jdbc:h2:mem:testdb\n    username: sa\n  h2:\n    console:\n      enabled: true\n  ai:\n    openai:\n      base-url: https://openrouter.ai/api\n      api-key: ${OPENROUTER_API_KEY}\n      chat:\n        options:\n          model: openrouter/free\n\napp:\n  thumbnail:\n    enabled: false", "controller/BlogApiController.java": "package me.shinsunyoung.springbootdeveloper.controller;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.domain.Article;\nimport me.shinsunyoung.springbootdeveloper.dto.*;\nimport me.shinsunyoung.springbootdeveloper.service.BlogService;\nimport me.shinsunyoung.springbootdeveloper.service.WritingAssistantService;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.*;\n\nimport java.util.List;\n\n@RequiredArgsConstructor\n@RestController\npublic class BlogApiController {\n\n    private final BlogService blogService;\n    private final WritingAssistantService writingAssistantService;\n\n    @PostMapping(\"/api/articles\")\n    public ResponseEntity<Article> addArticle(@RequestBody AddArticleRequest request) {\n        Article savedArticle = blogService.save(request);\n        return ResponseEntity.status(HttpStatus.CREATED)\n                .body(savedArticle);\n    }\n\n    @GetMapping(\"/api/articles\")\n    public ResponseEntity<List<ArticleResponse>> findAllArticles() {\n        List<ArticleResponse> articles = blogService.findAll()\n                .stream()\n                .map(ArticleResponse::new)\n                .toList();\n        return ResponseEntity.ok()\n                .body(articles);\n    }\n\n    @GetMapping(\"/api/articles/{id}\")\n    public ResponseEntity<ArticleResponse> findArticle(@PathVariable long id) {\n        Article article = blogService.findById(id);\n        return ResponseEntity.ok()\n                .body(new ArticleResponse(article));\n    }\n\n    @DeleteMapping(\"/api/articles/{id}\")\n    public ResponseEntity<Void> deleteArticle(@PathVariable long id) {\n        blogService.delete(id);\n        return ResponseEntity.ok()\n                .build();\n    }\n\n    @PutMapping(\"/api/articles/{id}\")\n    public ResponseEntity<Article> updateArticle(@PathVariable long id,\n                                                 @RequestBody UpdateArticleRequest request) {\n        Article updatedArticle = blogService.update(id, request);\n        return ResponseEntity.ok()\n                .body(updatedArticle);\n    }\n\n    @PostMapping(\"/api/ai-suggestions\")\n    public ResponseEntity<WritingSuggestionsResponse> writingAssist(@RequestBody WritingSuggestionRequest request) {\n        WritingSuggestionsResponse response = writingAssistantService.getWritingAssist(request);\n\n        return ResponseEntity.ok()\n                .body(response);\n    }\n}", "service/WritingAssistantService.java": "package me.shinsunyoung.springbootdeveloper.service;\n\nimport me.shinsunyoung.springbootdeveloper.dto.WritingSuggestionRequest;\nimport me.shinsunyoung.springbootdeveloper.dto.WritingSuggestionsResponse;\nimport org.springframework.ai.chat.client.ChatClient;\nimport org.springframework.ai.chat.prompt.PromptTemplate;\nimport org.springframework.ai.converter.BeanOutputConverter;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.core.io.Resource;\nimport org.springframework.stereotype.Service;\n\n@Service\npublic class WritingAssistantService {\n\n    private final ChatClient chatClient;\n\n    private final PromptTemplate template;\n\n    private final BeanOutputConverter<WritingSuggestionsResponse> outputConverter =\n            new BeanOutputConverter<>(WritingSuggestionsResponse.class);\n\n    public WritingAssistantService(\n            ChatClient.Builder chatClientBuilder,\n            @Value(\"classpath:prompts/writing-assistant.st\") Resource promptResource\n    ) {\n        this.chatClient = chatClientBuilder.build();\n        this.template = new PromptTemplate(promptResource);\n    }\n\n    public WritingSuggestionsResponse getWritingAssist(WritingSuggestionRequest request) {\n        String prompt = template.create(request.toMap(outputConverter.getFormat())).getContents();\n\n        String response = chatClient.prompt().user(prompt).call().content();\n\n        return outputConverter.convert(response);\n    }\n}", "dto/WritingSuggestionRequest.java": "package me.shinsunyoung.springbootdeveloper.dto;\n\nimport java.util.Map;\n\npublic record WritingSuggestionRequest(\n        String title,\n        String content,\n        String question\n) {\n\n    public Map<String, Object> toMap(String format) {\n        return Map.of(\n                \"title\", title,\n                \"content\", content,\n                \"question\", question,\n                \"format\", format\n        );\n    }\n}", "dto/WritingSuggestionsResponse.java": "package me.shinsunyoung.springbootdeveloper.dto;\n\nimport java.util.List;\n\npublic record WritingSuggestionsResponse(List<String> suggestions) {}", "prompts/writing-assistant.st": "당신은 블로그 글쓰기를 도와주는 전문 작가입니다.\n\n제목: {title}\n현재 작성된 내용: {content}\n질문: {question}\n\n위 질문에 대해 3개의 구체적이고 실용적인 제안을 해주세요.\n\n{format}", "static/js/article.js": "window.addEventListener('DOMContentLoaded', () => {\n    const imageUrl = document.getElementById('image-url')?.value;\n    if (imageUrl) {\n        displayImagePreview(imageUrl);\n    }\n});\n\nconst imageUpload = document.getElementById('image-upload');\nif (imageUpload) {\n    imageUpload.addEventListener('change', async (event) => {\n        const file = event.target.files[0];\n        if (!file) return;\n\n        if (!file.type.startsWith('image/')) {\n            alert('이미지 파일만 업로드 가능합니다.');\n            return;\n        }\n\n        const formData = new FormData();\n        formData.append('file', file);\n\n        fetch('/api/upload', {\n            method: 'POST',\n            body: formData\n        }).then((response) => {\n            if (!response.ok) {\n                alert('이미지 업로드에 실패했습니다.');\n                throw new Error();\n            }\n            return response.json();\n        })\n            .then((data) => {\n                document.getElementById('image-url').value = data.imageUrl;\n                displayImagePreview(data.imageUrl);\n            })\n            .catch((e) => console.error(e));\n    });\n}\n\nfunction displayImagePreview(imageUrl) {\n    const preview = document.getElementById('image-preview');\n    const previewImg = document.getElementById('preview-img');\n\n    if (preview && previewImg && imageUrl) {\n        previewImg.src = imageUrl;\n        preview.style.display = 'block';\n    }\n}\n\nconst removeImageButton = document.getElementById('remove-image-btn');\nif (removeImageButton) {\n    removeImageButton.addEventListener('click', () => {\n        document.getElementById('image-url').value = '';\n        document.getElementById('image-upload').value = '';\n        document.getElementById('image-preview').style.display = 'none';\n    });\n}\n\nconst aiThumbnailButton = document.getElementById('ai-thumbnail-btn');\nif (aiThumbnailButton) {\n    aiThumbnailButton.addEventListener('click', async () => {\n        const title = document.getElementById('title').value;\n        const content = document.getElementById('content').value;\n\n        if (!title.trim() && !content.trim()) {\n            alert('제목이나 내용을 먼저 입력해주세요.');\n            return;\n        }\n\n        const loadingDiv = document.getElementById('ai-thumbnail-loading');\n        loadingDiv.style.display = 'block';\n        aiThumbnailButton.disabled = true;\n\n        fetch('/api/ai-thumbnails', {\n            method: 'POST',\n            body: JSON.stringify({\n                title: title,\n                content: content\n            }),\n            headers: {\n                'Content-Type': 'application/json',\n            },\n        }).then((response) => {\n            if (!response.ok) {\n                alert('썸네일 생성에 실패했습니다.');\n                throw new Error();\n            }\n            return response.json();\n        }).then((data) => {\n            document.getElementById('image-url').value = data.imageUrl;\n            displayImagePreview(data.imageUrl);\n        }).finally(() => {\n            loadingDiv.style.display = 'none';\n            aiThumbnailButton.disabled = false;\n        });\n    });\n}\n\nconst deleteButton = document.getElementById('delete-btn');\n\nif (deleteButton) {\n    deleteButton.addEventListener('click', event => {\n        let id = document.getElementById('article-id').value;\n        fetch(`/api/articles/${id}`, {\n            method: 'DELETE'\n        })\n            .then(() => {\n                alert('삭제가 완료되었습니다.');\n                location.replace('/articles');\n            });\n    });\n}\n\nconst modifyButton = document.getElementById('modify-btn');\n\nif (modifyButton) {\n    modifyButton.addEventListener('click', event => {\n        let params = new URLSearchParams(location.search);\n        let id = params.get('id');\n\n        fetch(`/api/articles/${id}`, {\n            method: 'PUT',\n            headers: {\n                \"Content-Type\": \"application/json\",\n            },\n            body: JSON.stringify({\n                title: document.getElementById('title').value,\n                content: document.getElementById('content').value,\n                imageUrl: document.getElementById('image-url').value\n            })\n        })\n            .then(() => {\n                alert('수정이 완료되었습니다.');\n                location.replace(`/articles/${id}`);\n            });\n    });\n}\n\nconst createButton = document.getElementById('create-btn');\n\nif (createButton) {\n    createButton.addEventListener('click', event => {\n        fetch('/api/articles', {\n            method: 'POST',\n            headers: {\n                \"Content-Type\": \"application/json\",\n            },\n            body: JSON.stringify({\n                title: document.getElementById('title').value,\n                content: document.getElementById('content').value,\n                imageUrl: document.getElementById('image-url').value\n            })\n        })\n            .then(() => {\n                alert('등록 완료되었습니다.');\n                location.replace('/articles');\n            });\n    });\n}\n\nconst aiAssistButton = document.getElementById('ai-assist-btn');\n\nif (aiAssistButton) {\n    aiAssistButton.addEventListener('click', event => {\n        $('#aiAssistModal').modal('show');\n        document.getElementById('ai-suggestion').style.display = 'none';\n        document.getElementById('ai-question').value = '';\n    });\n}\n\nconst getSuggestionButton = document.getElementById('get-suggestion-btn');\n\nif (getSuggestionButton) {\n    getSuggestionButton.addEventListener('click', event => {\n        const title = document.getElementById('title').value;\n        const content = document.getElementById('content').value;\n        const question = document.getElementById('ai-question').value;\n\n        if (!question.trim()) {\n            alert('고민되는 내용을 입력해주세요.');\n            return;\n        }\n\n        document.getElementById('ai-loading').style.display = 'block';\n        document.getElementById('ai-suggestion').style.display = 'none';\n\n        const body = JSON.stringify({\n            title: title,\n            content: content,\n            question: question\n        });\n\n        fetch('/api/ai-suggestions', {\n            method: 'POST',\n            headers: {\n                'Content-Type': 'application/json',\n            },\n            body: body\n        })\n            .then(response => {\n                return response.json();\n            })\n            .then(data => {\n                document.getElementById('ai-loading').style.display = 'none';\n\n                const suggestionContent = document.getElementById('ai-suggestion-content');\n\n                let html = '';\n                if (data.suggestions && data.suggestions.length > 0) {\n                    html += '<ul class=\"list-group\">';\n                    data.suggestions.forEach((suggestion, index) => {\n                        html += `<li class=\"list-group-item suggestion-item\" style=\"cursor: pointer;\" data-suggestion=\"${suggestion.replace(/\"/g, '&quot;')}\" title=\"클릭하면 본문에 추가됩니다\">\n                                ${suggestion}\n                                <small class=\"text-muted float-right\">클릭하여 추가<\/small>\n                             <\/li>`;\n                    });\n                    html += '<\/ul>';\n                }\n\n                suggestionContent.innerHTML = html;\n                document.getElementById('ai-suggestion').style.display = 'block';\n            })\n    });\n}\n\nconst suggestionContent = document.getElementById('ai-suggestion-content');\nif (suggestionContent) {\n    suggestionContent.addEventListener('click', function(e) {\n        const suggestionItem = e.target.closest('.suggestion-item');\n        if (suggestionItem) {\n            const suggestion = suggestionItem.getAttribute('data-suggestion');\n            const contentTextarea = document.getElementById('content');\n\n            const currentContent = contentTextarea.value;\n            const separator = currentContent && !currentContent.endsWith('\\n') ? '\\n\\n' : '';\n            contentTextarea.value = currentContent + separator + suggestion;\n\n            $('#aiAssistModal').modal('hide');\n\n            contentTextarea.focus();\n        }\n    });\n}", "templates/newArticle.html": "<!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>블로그 글<\/title>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\">\n<\/head>\n<body>\n    <div class=\"p-5 mb-5 text-center bg-light\">\n        <h1 class=\"mb-3\">My Blog<\/h1>\n        <h4 class=\"mb-3\">블로그에 오신 것을 환영합니다.<\/h4>\n    <\/div>\n\n    <div class=\"container mt-5\">\n        <div class=\"row\">\n            <div class=\"col-lg-8\">\n                <article>\n                    <input type=\"hidden\" id=\"article-id\" th:value=\"${article.id}\">\n                    <header class=\"mb-4\">\n                        <input type=\"text\" class=\"form-control\" placeholder=\"제목\" id=\"title\" th:value=\"${article.title}\">\n                    <\/header>\n                    <section class=\"mb-4\">\n                        <label for=\"image-upload\" class=\"form-label\">이미지 업로드<\/label>\n                        <div class=\"input-group mb-2\">\n                            <input type=\"file\" class=\"form-control\" id=\"image-upload\" accept=\"image/*\">\n                            <button type=\"button\" id=\"ai-thumbnail-btn\" class=\"btn btn-outline-secondary\" style=\"display: none;\">AI 썸네일 생성<\/button>\n\n                        <\/div>\n                        <input type=\"hidden\" id=\"image-url\" th:value=\"${article.imageUrl}\">\n                        <div id=\"ai-thumbnail-loading\" class=\"mt-2\" style=\"display: none;\">\n                            <div class=\"spinner-border spinner-border-sm text-primary\" role=\"status\">\n                                <span class=\"sr-only\">Loading...<\/span>\n                            <\/div>\n                            <span class=\"ml-2\">AI가 썸네일을 생성하고 있습니다... (30초 정도 소요됩니다)<\/span>\n                        <\/div>\n                        <div id=\"image-preview\" class=\"mt-3\" style=\"display: none;\">\n                            <img id=\"preview-img\" src=\"\" alt=\"미리보기\" style=\"max-width: 100%; max-height: 400px;\">\n                            <button type=\"button\" id=\"remove-image-btn\" class=\"btn btn-sm btn-danger mt-2\">이미지 제거<\/button>\n                        <\/div>\n                    <\/section>\n                    <section class=\"mb-5\">\n                        <textarea class=\"form-control h-25\" rows=\"10\" placeholder=\"내용\" id=\"content\" th:text=\"${article.content}\"><\/textarea>\n                    <\/section>\n                    <button type=\"button\" id=\"ai-assist-btn\" class=\"btn btn-info btn-sm\">AI 도움받기<\/button>\n                    <button th:if=\"${article.id} != null\" type=\"button\" id=\"modify-btn\" class=\"btn btn-primary btn-sm\">수정<\/button>\n                    <button th:if=\"${article.id} == null\" type=\"button\" id=\"create-btn\" class=\"btn btn-primary btn-sm\">등록<\/button>\n                <\/article>\n            <\/div>\n        <\/div>\n    <\/div>\n    <div class=\"modal fade\" id=\"aiAssistModal\" tabindex=\"-1\" role=\"dialog\" aria-labelledby=\"aiAssistModalLabel\" aria-hidden=\"true\">\n        <div class=\"modal-dialog modal-lg\" role=\"document\">\n            <div class=\"modal-content\">\n                <div class=\"modal-header\">\n                    <h5 class=\"modal-title\" id=\"aiAssistModalLabel\">AI 글쓰기 도우미<\/h5>\n                    <button type=\"button\" class=\"close\" data-dismiss=\"modal\" aria-label=\"Close\">\n                        <span aria-hidden=\"true\">&times;<\/span>\n                    <\/button>\n                <\/div>\n                <div class=\"modal-body\">\n                    <div class=\"form-group\">\n                        <label for=\"ai-question\">어떤 부분이 고민되시나요?<\/label>\n                        <textarea class=\"form-control\" id=\"ai-question\" rows=\"3\" placeholder=\"예: 이 다음에 어떤 내용을 써야 할까요?\"><\/textarea>\n                    <\/div>\n                    <button type=\"button\" id=\"get-suggestion-btn\" class=\"btn btn-primary\">제안 받기<\/button>\n                    <div id=\"ai-loading\" class=\"mt-3\" style=\"display: none;\">\n                        <div class=\"spinner-border text-primary\" role=\"status\">\n                            <span class=\"sr-only\">Loading...<\/span>\n                        <\/div>\n                        <span class=\"ml-2\">AI가 생각하고 있습니다...<\/span>\n                    <\/div>\n                    <div id=\"ai-suggestion\" class=\"mt-3\" style=\"display: none;\">\n                        <h6>AI 제안:<\/h6>\n                        <div id=\"ai-suggestion-content\"><\/div>\n                    <\/div>\n                <\/div>\n                <div class=\"modal-footer\">\n                    <button type=\"button\" class=\"btn btn-secondary\" data-dismiss=\"modal\">닫기<\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n    <script src=\"https://code.jquery.com/jquery-3.3.1.slim.min.js\"><\/script>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js\"><\/script>\n    <script src=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js\"><\/script>\n    <script src=\"/js/article.js\"><\/script>\n<\/body>\n<\/html>", "templates/article.html": "<!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>블로그 글<\/title>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\">\n<\/head>\n<body>\n    <div class=\"p-5 mb-5 text-center<\/> bg-light\">\n        <h1 class=\"mb-3\">My Blog<\/h1>\n        <h4 class=\"mb-3\">블로그에 오신 것을 환영합니다.<\/h4>\n    <\/div>\n\n    <div class=\"container mt-5\">\n        <div class=\"row\">\n            <div class=\"col-lg-8\">\n                <article>\n                    <input type=\"hidden\" id=\"article-id\" th:value=\"${article.id}\">\n                    <header class=\"mb-4\">\n                        <h1 class=\"fw-bolder mb-1\" th:text=\"${article.title}\"><\/h1>\n                        <div class=\"text-muted fst-italic mb-2\" th:text=\"|Posted on ${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}|\"><\/div>\n                    <\/header>\n                    <section class=\"mb-4\" th:if=\"${article.imageUrl != null and article.imageUrl != ''}\">\n                        <img th:src=\"${article.imageUrl}\" alt=\"게시글 이미지\" class=\"img-fluid\" style=\"max-width: 100%; height: auto;\">\n                    <\/section>\n                    <section class=\"mb-5\">\n                        <p class=\"fs-5 mb-4\" th:text=\"${article.content}\"><\/p>\n                    <\/section>\n                    <button type=\"button\" id=\"modify-btn\"\n                            th:onclick=\"|location.href='@{/new-article?id={articleId}(articleId=${article.id})}'|\"\n                            class=\"btn btn-primary btn-sm\">수정<\/button>\n                    <button type=\"button\" id=\"delete-btn\"\n                            class=\"btn btn-secondary btn-sm\">삭제<\/button>\n                <\/article>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <script src=\"/js/article.js\"><\/script>\n<\/body>", "controller/UploadController.java": "package me.shinsunyoung.springbootdeveloper.controller;\n\nimport me.shinsunyoung.springbootdeveloper.dto.UploadResponse;\nimport me.shinsunyoung.springbootdeveloper.service.FileStorageService;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.multipart.MultipartFile;\n\nimport java.io.IOException;\n\n@RestController\npublic class UploadController {\n\n    private final FileStorageService fileStorageService;\n\n    public UploadController(FileStorageService fileStorageService) {\n        this.fileStorageService = fileStorageService;\n    }\n\n    @PostMapping(\"/api/upload\")\n    public ResponseEntity<UploadResponse> uploadFile(@RequestParam(\"file\") MultipartFile file) throws IOException {\n        return ResponseEntity.status(HttpStatus.CREATED)\n                .body(fileStorageService.store(\n                        file.getBytes(),\n                        file.getOriginalFilename()\n                ));\n    }\n}", "service/LocalFileStorageService.java": "package me.shinsunyoung.springbootdeveloper.service;\n\nimport me.shinsunyoung.springbootdeveloper.dto.UploadResponse;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.stereotype.Service;\n\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.util.UUID;\n\n@Service\npublic class LocalFileStorageService implements FileStorageService {\n\n    private final Path uploadDir;\n\n    public LocalFileStorageService(@Value(\"${app.upload-dir:uploads}\") String uploadDir) {\n        this.uploadDir = Paths.get(uploadDir).toAbsolutePath().normalize();\n    }\n\n    @Override\n    public UploadResponse store(byte[] bytes, String filename) {\n        try {\n            Files.createDirectories(uploadDir);\n\n            String ext = filename.contains(\".\")\n                    ? filename.substring(filename.lastIndexOf('.'))\n                    : \".png\";\n\n            String saved = UUID.randomUUID() + ext;\n\n            Files.write(uploadDir.resolve(saved), bytes);\n\n            return new UploadResponse(\"/uploads/\" + saved);\n\n        } catch (IOException e) {\n            throw new RuntimeException();\n        }\n    }\n}", "config/WebMvcConfig.java": "package me.shinsunyoung.springbootdeveloper.config;\n\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.web.servlet.config.annotation.ResourceHandlerRegistry;\nimport org.springframework.web.servlet.config.annotation.WebMvcConfigurer;\n\n@Configuration\npublic class WebMvcConfig implements WebMvcConfigurer {\n\n    @Override\n    public void addResourceHandlers(ResourceHandlerRegistry registry) {\n        registry.addResourceHandler(\"/uploads/**\")\n                .addResourceLocations(\"file:uploads/\");\n    }\n}", "controller/ThumbnailApiController.java": "package me.shinsunyoung.springbootdeveloper.controller;\n\nimport lombok.RequiredArgsConstructor;\nimport me.shinsunyoung.springbootdeveloper.dto.GeneratorThumbnailRequest;\nimport me.shinsunyoung.springbootdeveloper.dto.GeneratorThumbnailResponse;\nimport me.shinsunyoung.springbootdeveloper.service.ThumbnailGeneratorService;\nimport org.springframework.boot.autoconfigure.condition.ConditionalOnProperty;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RestController;\n\n@RequiredArgsConstructor\n@RestController\n@ConditionalOnProperty(name = \"app.thumbnail.enabled\", havingValue = \"true\")\npublic class ThumbnailApiController {\n\n    private final ThumbnailGeneratorService thumbnailGeneratorService;\n\n    @PostMapping(\"/api/ai-thumbnails\")\n    public ResponseEntity<GeneratorThumbnailResponse> thumbnailGenerator(@RequestBody GeneratorThumbnailRequest request) {\n        GeneratorThumbnailResponse response = thumbnailGeneratorService.generateThumbnail(request);\n\n        return ResponseEntity.ok()\n                .body(response);\n    }\n}", "service/ThumbnailGeneratorService.java": "package me.shinsunyoung.springbootdeveloper.service;\n\nimport me.shinsunyoung.springbootdeveloper.dto.GeneratorThumbnailRequest;\nimport me.shinsunyoung.springbootdeveloper.dto.GeneratorThumbnailResponse;\nimport me.shinsunyoung.springbootdeveloper.dto.UploadResponse;\nimport org.springframework.ai.chat.prompt.PromptTemplate;\nimport org.springframework.ai.image.Image;\nimport org.springframework.ai.image.ImageModel;\nimport org.springframework.ai.image.ImagePrompt;\nimport org.springframework.ai.image.ImageResponse;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.boot.autoconfigure.condition.ConditionalOnProperty;\nimport org.springframework.core.io.Resource;\nimport org.springframework.stereotype.Service;\nimport org.springframework.web.client.RestClient;\n\nimport java.net.URI;\n\n@Service\n@ConditionalOnProperty(name = \"app.thumbnail.enabled\", havingValue = \"true\")\npublic class ThumbnailGeneratorService {\n\n    private final ImageModel imageModel;\n    private final PromptTemplate template;\n    private final FileStorageService fileStorageService;\n    private final RestClient restClient = RestClient.create();\n\n    public ThumbnailGeneratorService(\n            ImageModel imageModel,\n            FileStorageService fileStorageService,\n            @Value(\"classpath:prompts/thumbnail-generator.st\") Resource promptResource\n    ) {\n        this.imageModel = imageModel;\n        this.fileStorageService = fileStorageService;\n        this.template = new PromptTemplate(promptResource);\n    }\n\n    public GeneratorThumbnailResponse generateThumbnail(GeneratorThumbnailRequest request) {\n        String prompt = template.create(request.toMap()).getContents();\n\n        ImageResponse response = imageModel.call(new ImagePrompt(prompt));\n        Image image = response.getResult().getOutput();\n\n        byte[] bytes = restClient.get()\n                .uri(URI.create(image.getUrl()))\n                .retrieve()\n                .body(byte[].class);\n\n        UploadResponse saved = fileStorageService.store(bytes, \"thumbnail.png\");\n\n        return new GeneratorThumbnailResponse(saved.imageUrl());\n    }\n}"};
const PATHS = {"application.yml": "src/main/resources/application.yml", "controller/BlogApiController.java": "src/main/java/me/shinsunyoung/springbootdeveloper/controller/BlogApiController.java", "service/WritingAssistantService.java": "src/main/java/me/shinsunyoung/springbootdeveloper/service/WritingAssistantService.java", "dto/WritingSuggestionRequest.java": "src/main/java/me/shinsunyoung/springbootdeveloper/dto/WritingSuggestionRequest.java", "dto/WritingSuggestionsResponse.java": "src/main/java/me/shinsunyoung/springbootdeveloper/dto/WritingSuggestionsResponse.java", "prompts/writing-assistant.st": "src/main/resources/prompts/writing-assistant.st", "static/js/article.js": "src/main/resources/static/js/article.js", "templates/newArticle.html": "src/main/resources/templates/newArticle.html", "templates/article.html": "src/main/resources/templates/article.html", "controller/UploadController.java": "src/main/java/me/shinsunyoung/springbootdeveloper/controller/UploadController.java", "service/LocalFileStorageService.java": "src/main/java/me/shinsunyoung/springbootdeveloper/service/LocalFileStorageService.java", "config/WebMvcConfig.java": "src/main/java/me/shinsunyoung/springbootdeveloper/config/WebMvcConfig.java", "controller/ThumbnailApiController.java": "src/main/java/me/shinsunyoung/springbootdeveloper/controller/ThumbnailApiController.java", "service/ThumbnailGeneratorService.java": "src/main/java/me/shinsunyoung/springbootdeveloper/service/ThumbnailGeneratorService.java"};

const $ = (id) => document.getElementById(id);
const stack = $('stack'), packet = $('packet');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let sc = 0, cur = 0, timer = null, bands = [], dotBtns = [], phases = [];
let STEPS = [], NODES = [];

// 시나리오 탭 만들기
const tabBtns = SCENARIOS.map((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
  b.textContent = s.tab;
  b.addEventListener('click', () => { stop(); load(i); });
  $('tabs').appendChild(b);
  return b;
});

function buildStage() {
  bands.forEach((b) => b.remove());
  bands = NODES.map((n, i) => {
    const d = document.createElement('div');
    d.className = 'band' + (n.db ? ' db' : '');
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = n.name;
    const sb = document.createElement('div'); sb.className = 'sb'; sb.textContent = n.sub;
    d.append(nm, sb);
    stack.appendChild(d);
    return d;
  });
  $('dots').innerHTML = ''; dotBtns = [];
  // 단계 번호는 단계 순서대로 놓고, 묶음(요청, 응답 등)이 바뀌는 곳에서만 묶음 이름을 붙입니다.
  phases = [];
  let g = null, last = null;
  STEPS.forEach((s, i) => {
    if (!phases.includes(s.phase)) phases.push(s.phase);
    if (s.phase !== last) {
      g = document.createElement('div'); g.className = 'grp';
      const gl = document.createElement('span'); gl.className = 'gl'; gl.textContent = s.phase;
      g.appendChild(gl);
      $('dots').appendChild(g);
      last = s.phase;
    }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dot'; b.textContent = i + 1;
    b.setAttribute('aria-label', (i + 1) + '단계 : ' + s.title);
    b.addEventListener('click', () => { stop(); go(i); });
    g.appendChild(b); dotBtns[i] = b;
  });
}

function load(i) {
  sc = i;
  const s = SCENARIOS[sc];
  STEPS = s.steps; NODES = s.nodes;
  tabBtns.forEach((b, k) => b.setAttribute('aria-selected', k === sc ? 'true' : 'false'));
  tabBtns[sc].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('scen').innerHTML = '';
  s.summary.forEach((part) => {
    if (part.code) { const c = document.createElement('code'); c.textContent = part.code; $('scen').appendChild(c); }
    else $('scen').appendChild(document.createTextNode(part.text));
  });
  buildStage();
  go(0);
}

function centerY(i) {
  const b = bands[i];
  return b.offsetTop + b.offsetHeight / 2 - 8;
}

function placePacket(step) {
  packet.className = 'packet ' + (step.dir === 'none' ? '' : step.dir);
  if (step.move) {
    const [from, to] = step.move;
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(from) + 'px)';
    void packet.offsetHeight;
    packet.style.transition = reduce ? 'none' : 'transform 1s cubic-bezier(.45,0,.2,1)';
    packet.style.transform = 'translateY(' + centerY(to) + 'px)';
  } else {
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(step.active[0]) + 'px)';
    packet.classList.add('pulse');
  }
}

function renderCode(step) {
  const wrap = $('codewrap');
  wrap.innerHTML = '';
  if (!step.file) {
    $('fname').textContent = '프로젝트 파일 없음';
    $('fpath').textContent = step.nofile || '이 단계는 스프링 부트 라이브러리나 브라우저가 처리합니다.';
    $('hlcount').textContent = '';
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = '이 단계에서는 개발자가 작성한 파일이 실행되지 않습니다. 왼쪽에서 신호가 지나가는 구간을 확인하세요.';
    wrap.appendChild(e);
    return;
  }
  $('fname').textContent = step.file.split('/').pop();
  $('fpath').textContent = PATHS[step.file];
  const box = document.createElement('div'); box.className = 'code'; box.tabIndex = 0;
  box.setAttribute('aria-label', step.file + ' 코드');
  let first = null, n = 0;
  FILES[step.file].split('\n').forEach((line, i) => {
    const row = document.createElement('div'); row.className = 'ln';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = i + 1;
    const tx = document.createElement('span'); tx.textContent = line || ' ';
    row.append(no, tx);
    if (step.hlLines.includes(i + 1)) {
      row.classList.add('hl'); n++;
      if (!first) first = row;
    }
    box.appendChild(row);
  });
  wrap.appendChild(box);
  $('hlcount').textContent = n ? '강조된 줄 ' + n + '개 : 이 단계에서 실행되거나 쓰이는 코드' : '';
  if (first) box.scrollTop = Math.max(0, first.offsetTop - box.clientHeight / 3);
}

function renderData(step) {
  const d = step.data, body = $('dbody');
  $('dlabel').textContent = d.label;
  body.innerHTML = '';
  if (d.kind === 'table') {
    const t = document.createElement('table');
    const tr = document.createElement('tr');
    d.cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); });
    t.appendChild(tr);
    d.rows.forEach((r) => {
      const row = document.createElement('tr');
      r.forEach((c) => { const td = document.createElement('td'); td.textContent = c; row.appendChild(td); });
      t.appendChild(row);
    });
    const w = document.createElement('div'); w.style.overflowX = 'auto'; w.appendChild(t);
    body.appendChild(w);
  } else if (d.kind === 'browser') {
    const b = document.createElement('div'); b.className = 'browser';
    const bar = document.createElement('div'); bar.className = 'bar'; bar.textContent = d.url;
    const v = document.createElement('div'); v.className = 'view'; v.style.whiteSpace = 'pre-wrap'; v.textContent = d.text;
    b.append(bar, v); body.appendChild(b);
  } else {
    const p = document.createElement('pre'); p.textContent = d.text; body.appendChild(p);
  }
}

function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  $('stepno').textContent = (cur + 1) + ' / ' + STEPS.length + '단계';
  const ph = $('phase');
  ph.textContent = s.phase;
  ph.className = 'phase ' + (PHASE_CLASS[s.phase] || 'p0');
  $('title').textContent = s.title;
  const ol = $('desc'); ol.innerHTML = '';
  s.desc.forEach((t) => { const li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
  bands.forEach((b, k) => { b.className = 'band' + (NODES[k].db ? ' db' : ''); });
  s.active.forEach((k) => bands[k].classList.add('active', s.dir));
  renderCode(s);
  renderData(s);
  ['desc', 'codewrap', 'dbody'].forEach((id) => { const el = $(id); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });
  placePacket(s);
  dotBtns.forEach((b, k) => { b.classList.toggle('cur', k === cur); b.classList.toggle('done', k < cur); b.setAttribute('aria-current', k === cur ? 'step' : 'false'); });
  if (dotBtns[cur]) dotBtns[cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('prev').disabled = cur === 0; $('first').disabled = cur === 0;
  $('next').disabled = cur === STEPS.length - 1;
}

function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = '자동 재생'; }
function play() {
  if (timer) { stop(); return; }
  if (cur === STEPS.length - 1) go(0);
  $('play').textContent = '멈춤';
  timer = setInterval(() => { if (cur >= STEPS.length - 1) { stop(); return; } go(cur + 1); }, 4200);
}

$('first').addEventListener('click', () => { stop(); go(0); });
$('prev').addEventListener('click', () => { stop(); go(cur - 1); });
$('next').addEventListener('click', () => { stop(); go(cur + 1); });
$('play').addEventListener('click', play);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('.code')) return;
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
});
window.addEventListener('resize', () => placePacket(Object.assign({}, STEPS[cur], { move: null })));

$('dl').addEventListener('click', () => {
  stop();
  const blob = new Blob([ORIGINAL_HTML], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "chapter8-request-flow.html";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

load(0);
</script>
</body>
</html>
