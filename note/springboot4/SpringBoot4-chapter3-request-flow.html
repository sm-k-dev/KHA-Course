<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3장 요청과 응답 흐름 : GET /test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF3; --panel:#FFFFFF; --ink:#1B2433; --muted:#596577; --line:#C6D0DC;
  --req:#2457C5; --req-soft:#DCE6FA; --res:#137A50; --res-soft:#D6EFE3;
  --db:#9A5B0C; --hl:#FFEFA8; --hl-ink:#3A2E00; --code:#F4F7FA; --rail:#B9C5D3;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",Consolas,"D2Coding",monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141922; --panel:#1C232E; --ink:#E4E9F0; --muted:#9AA5B4; --line:#323E4F;
    --req:#7AA2FF; --req-soft:#1F2E4F; --res:#4CC48C; --res-soft:#173A2B;
    --db:#E2A757; --hl:#4B4220; --hl-ink:#FFF1BF; --code:#161C25; --rail:#3A4759;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:120px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-0.01em}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:62ch}
.lead code{font-family:var(--mono);font-size:14px;color:var(--ink)}
button{font-family:var(--sans);font-size:14px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
button:focus-visible{outline:3px solid var(--req);outline-offset:2px}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}

.grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px;align-items:start}

/* 왼쪽 : 구간 스택 */
.stage{position:sticky;top:16px}
.stack{position:relative;padding-left:40px}
.rail{position:absolute;left:17px;top:22px;bottom:22px;width:2px;background:var(--rail)}
.band{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;transition:border-color .3s, background .3s}
.band:last-child{margin-bottom:0}
.band .nm{font-weight:600;font-size:15px}
.band .sb{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.band::before{content:"";position:absolute;left:-28px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--panel);border:2px solid var(--rail)}
.band.db{border-style:dashed}
.band.active{border-width:2px;padding:9px 13px}
.band.active.req{border-color:var(--req);background:var(--req-soft)}
.band.active.res{border-color:var(--res);background:var(--res-soft)}
.band.active.none{border-color:var(--ink)}
.band.active::before{border-color:currentColor}
.band.active.req::before{background:var(--req);border-color:var(--req)}
.band.active.res::before{background:var(--res);border-color:var(--res)}
.band.active.none::before{background:var(--ink);border-color:var(--ink)}
.packet{position:absolute;left:10px;top:0;width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--panel);z-index:2;will-change:transform}
.packet.req{background:var(--req)}
.packet.res{background:var(--res)}
.packet.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--panel)}50%{box-shadow:0 0 0 4px var(--panel),0 0 0 9px var(--rail)}}
.legend{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend .lq::before{background:var(--req)}
.legend .ls::before{background:var(--res)}
.legend .ln::before{background:var(--ink)}

/* 오른쪽 : 단계 설명 */
.detail{min-width:0}
.stephead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stepno{font-family:var(--mono);font-size:14px;color:var(--muted)}
.phase{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.phase.p0{color:var(--ink)}
.phase.p1{color:var(--req);border-color:var(--req)}
.phase.p2{color:var(--res);border-color:var(--res)}
h2{font-size:22px;line-height:1.35;margin:0 0 10px;font-weight:700}
ol.desc{margin:0 0 16px;padding-left:22px;max-width:70ch}
ol.desc li{margin:3px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.boxhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.boxhead .fname{font-family:var(--mono);font-weight:600;font-size:13.5px}
.boxhead .fpath{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.code{position:relative;background:var(--code);max-height:340px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.code .ln{display:flex;white-space:pre;padding:0 12px 0 0;min-width:max-content}
.code .no{display:inline-block;width:40px;flex:0 0 40px;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.code .ln.hl{background:var(--hl);color:var(--hl-ink);box-shadow:inset 4px 0 0 var(--db)}
.code .ln.hl .no{color:var(--hl-ink)}
.empty{padding:16px 14px;color:var(--muted);font-size:14px;background:var(--code)}
.data pre{margin:0;padding:12px 14px;background:var(--code);font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.data table{border-collapse:collapse;margin:12px 14px;font-family:var(--mono);font-size:14px}
.data th,.data td{border:1px solid var(--line);padding:5px 14px;text-align:left}
.data th{background:var(--code)}
.browser{margin:12px 14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.browser .bar{background:var(--code);padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.browser .view{padding:12px;font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere;background:var(--panel)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* 아래 : 조작 바 */
.controls{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.controls .in{max-width:1180px;margin:0 auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns .sp{flex:1}
.dots{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:wrap}
.dots .grp{display:flex;gap:4px;align-items:center;margin-right:10px}
.dots .gl{font-size:12px;color:var(--muted);margin-right:4px}
.dot{width:26px;height:26px;padding:0;border-radius:6px;font-size:12px;font-family:var(--mono)}
.dot.done{background:var(--code)}
.dot.cur{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kbd{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr;gap:14px}
  .stage{position:static}
  .band{padding:6px 12px;margin-bottom:5px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
  .band.active{padding:5px 11px}
  .band .nm{font-size:14px}
  .band .sb{font-size:11.5px}
  .dots{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .dots .grp{flex:0 0 auto}
  .btns button{padding:7px 12px}
  h1{font-size:21px}
  h2{font-size:19px}
  .code{font-size:12.5px;max-height:280px}
  .data pre{font-size:12.5px}
  .kbd{display:none}
  body{padding-bottom:118px}
}
@media (prefers-reduced-motion: reduce){
  .packet{transition:none !important}
  .packet.pulse,.fade{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>3장 요청과 응답 흐름</h1>
      <p class="lead">브라우저에서 <code>http://localhost:8080/test</code> 를 열었을 때, 어떤 파일의 어떤 코드가 순서대로 실행되어 화면에 JSON 이 보이는지 단계별로 따라갑니다. 로그와 응답은 3장 프로젝트를 실제로 실행해서 얻은 값입니다.</p>
    </div>
    <button type="button" class="primary" id="dl">HTML 파일 다운로드</button>
  </header>

  <div class="grid">
    <aside class="stage" aria-label="요청이 지나가는 구간">
      <div class="stack" id="stack">
        <div class="rail"></div>
        <div class="packet" id="packet" aria-hidden="true"></div>
      </div>
      <div class="legend"><span class="lq">요청 방향</span><span class="ls">응답 방향</span><span class="ln">시작 준비</span></div>
    </aside>

    <main class="detail">
      <div class="stephead">
        <span class="stepno" id="stepno"></span>
        <span class="phase" id="phase"></span>
      </div>
      <h2 id="title" aria-live="polite"></h2>
      <ol class="desc" id="desc"></ol>

      <section class="box" aria-label="실행되는 코드">
        <div class="boxhead"><div><div class="fname" id="fname"></div><div class="fpath" id="fpath"></div></div><span id="hlcount" class="fpath"></span></div>
        <div id="codewrap"></div>
      </section>

      <section class="box data" aria-label="오가는 데이터">
        <div class="boxhead"><span class="fname" id="dlabel"></span></div>
        <div id="dbody"></div>
      </section>
    </main>
  </div>
</div>

<nav class="controls" aria-label="단계 조작">
  <div class="in">
    <div class="btns">
      <button type="button" id="first">처음</button>
      <button type="button" id="prev">이전</button>
      <button type="button" class="primary" id="play">자동 재생</button>
      <button type="button" id="next">다음</button>
      <span class="sp"></span>
      <span class="kbd">키보드 ← → 로 이동</span>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</nav>

<script>
// 다운로드용 : 화면 요소를 추가하기 전, 처음 불러온 상태의 HTML 을 저장해 둡니다.
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const STEPS = [{"phase": "시작 준비", "title": "프로그램 시작 : main 메소드 실행", "file": "SpringbootDeveloperApplication.java", "hl": ["@SpringBootApplication", "SpringApplication.run("], "active": [1], "move": null, "dir": "none", "desc": ["JVM 이 SpringbootDeveloperApplication 의 main 메소드를 호출합니다.", "SpringApplication.run(...) 이 스프링 컨테이너(톰캣)를 만듭니다.", "@SpringBootApplication 의 컴포넌트 검색으로 @RestController, @Service, @Repository 가 붙은 클래스를 찾아 빈(객체)을 자동 생성하고 보관합니다.", "내장 톰캣이 8080 포트에서 요청을 기다립니다."], "data": {"kind": "pre", "label": "실제 실행 로그", "text": "Tomcat started on port 8080 (http) with context path '/'"}}, {"phase": "시작 준비", "title": "빈(객체) 연결 : @Autowired", "file": "TestController.java", "hl": ["@Autowired", "TestService testService;"], "active": [3, 4, 5], "move": null, "dir": "none", "desc": ["스프링 컨테이너(톰캣)가 보관 중인 TestService 빈을 TestController 의 testService 변수에 넣습니다.", "같은 방식으로 TestService 의 memberRepository 변수에는 MemberRepository 구현 객체(빈)를 넣습니다.", "개발자는 new 로 객체를 만들지 않습니다. 이 연결은 요청이 오기 전, 시작할 때 한 번 끝납니다."], "data": {"kind": "pre", "label": "연결 결과", "text": "TestController.testService     ← TestService 빈\nTestService.memberRepository  ← MemberRepository 구현 객체(빈)"}}, {"phase": "시작 준비", "title": "member 테이블 생성", "file": "Member.java", "hl": ["@Entity", "@Id", "@GeneratedValue", "@Column(name = \"id\"", "@Column(name = \"name\"", "private Long id;", "private String name;"], "active": [5, 6], "move": [5, 6], "dir": "req", "desc": ["Hibernate 가 @Entity 가 붙은 Member 클래스를 읽고 member 테이블을 만드는 create table 구문을 실행합니다.", "@Id → primary key (id), @GeneratedValue(IDENTITY) → generated by default as identity 가 됩니다.", "nullable = false → name 열의 not null 제약조건이 됩니다."], "data": {"kind": "pre", "label": "실제 실행 SQL (시작 로그)", "text": "create table member (\n    id bigint generated by default as identity,\n    name varchar(255) not null,\n    primary key (id)\n)"}}, {"phase": "시작 준비", "title": "data.sql 실행 : 회원 3명 넣기", "file": "data.sql", "hl": ["INSERT INTO member"], "active": [6], "move": null, "dir": "none", "desc": ["application.yml 의 defer-datasource-initialization: true 때문에, 테이블이 만들어진 뒤에 data.sql 이 실행됩니다.", "INSERT 구문 3개가 member 테이블에 행 레코드 3줄을 넣습니다.", "data.sql 은 스프링이 실행하므로 Hibernate 의 show-sql 로그에는 나오지 않습니다."], "data": {"kind": "table", "label": "member 테이블 (H2 메모리 DB)", "cols": ["id", "name"], "rows": [["1", "name 1"], ["2", "name 2"], ["3", "name 3"]]}}, {"phase": "요청", "title": "브라우저가 GET /test 요청을 보냄", "file": null, "hl": [], "active": [0, 1], "move": [0, 1], "dir": "req", "desc": ["주소창에 http://localhost:8080/test 를 입력하면 브라우저가 GET 방식 요청을 보냅니다.", "8080 포트에서 기다리던 내장 톰캣이 이 요청을 받습니다.", "아직 개발자가 작성한 자바 코드는 실행되지 않았습니다."], "data": {"kind": "pre", "label": "HTTP 요청", "text": "GET /test HTTP/1.1\nHost: localhost:8080"}}, {"phase": "요청", "title": "톰캣이 DispatcherServlet 에 전달", "file": null, "hl": [], "active": [1, 2], "move": [1, 2], "dir": "req", "desc": ["톰캣은 받은 요청을 스프링의 DispatcherServlet 에 넘깁니다.", "DispatcherServlet 은 스프링 부트가 자동으로 등록한 객체입니다. 프로젝트에는 이 파일이 없습니다.", "DispatcherServlet 은 모든 요청을 먼저 받아서, 어느 컨트롤러 메소드를 실행할지 정합니다."], "data": {"kind": "pre", "label": "전달되는 정보", "text": "요청 방식 : GET\n요청 주소 : /test"}}, {"phase": "요청", "title": "주소에 맞는 메소드 찾기", "file": "TestController.java", "hl": ["@RestController", "@GetMapping(\"/test\")"], "active": [2, 3], "move": null, "dir": "none", "desc": ["DispatcherServlet 이 시작할 때 만들어 둔 주소 목록에서 GET /test 를 찾습니다.", "@GetMapping(\"/test\") 가 붙은 TestController 의 getAllMembers 메소드가 대상입니다.", "@RestController 가 붙어 있으므로, 이 메소드의 return 값은 화면 파일이 아니라 응답 본문으로 쓰입니다."], "data": {"kind": "pre", "label": "찾은 대상", "text": "GET /test  →  TestController.getAllMembers()"}}, {"phase": "요청", "title": "TestController.getAllMembers() 실행", "file": "TestController.java", "hl": ["public List<Member> getAllMembers()"], "active": [3], "move": [2, 3], "dir": "req", "desc": ["DispatcherServlet 이 TestController 빈의 getAllMembers 메소드를 호출합니다.", "이 메소드는 List<Member>(회원 객체 목록)를 돌려주도록 선언되어 있습니다."], "data": {"kind": "pre", "label": "호출", "text": "testController.getAllMembers()"}}, {"phase": "요청", "title": "TestService 에게 업무를 맡김", "file": "TestController.java", "hl": ["List<Member> members = testService.getAllMembers();"], "active": [3, 4], "move": [3, 4], "dir": "req", "desc": ["TestController 는 DB 에 직접 접근하지 않습니다.", "@Autowired 로 넣어 둔 testService 변수의 getAllMembers 메소드를 호출합니다.", "결과가 돌아올 때까지 이 줄에서 기다립니다."], "data": {"kind": "pre", "label": "호출", "text": "testService.getAllMembers()"}}, {"phase": "요청", "title": "MemberRepository.findAll() 호출", "file": "TestService.java", "hl": ["public List<Member> getAllMembers()", "return memberRepository.findAll();"], "active": [4, 5], "move": [4, 5], "dir": "req", "desc": ["TestService.getAllMembers 가 memberRepository 변수의 findAll 메소드를 호출합니다.", "memberRepository 에는 시작할 때 넣어 둔 MemberRepository 구현 객체(빈)가 들어 있습니다."], "data": {"kind": "pre", "label": "호출", "text": "memberRepository.findAll()"}}, {"phase": "요청", "title": "SELECT 구문을 DB 로 보냄", "file": "MemberRepository.java", "hl": ["extends JpaRepository<Member, Long>"], "active": [5, 6], "move": [5, 6], "dir": "req", "desc": ["MemberRepository 에는 findAll 메소드를 적지 않았습니다. JpaRepository 에서 물려받은 메소드입니다.", "구현 객체가 Hibernate 를 통해 member 테이블 전체를 조회하는 select 구문을 만들어 H2 DB 로 보냅니다.", "application.yml 의 show-sql: true 와 format_sql: true 때문에 아래처럼 콘솔에 줄을 나눠 출력됩니다."], "data": {"kind": "pre", "label": "실제 콘솔 로그 (요청 시)", "text": "Hibernate:\n    select\n        m1_0.id,\n        m1_0.name\n    from\n        member m1_0"}}, {"phase": "응답", "title": "DB 가 행 레코드 3줄을 돌려줌", "file": "data.sql", "hl": ["INSERT INTO member"], "active": [6, 5], "move": [6, 5], "dir": "res", "desc": ["H2 DB 가 member 테이블의 행 레코드 3줄을 조회 결과로 돌려줍니다.", "이 3줄은 시작할 때 data.sql 이 넣은 데이터입니다."], "data": {"kind": "table", "label": "조회 결과 (select)", "cols": ["id", "name"], "rows": [["1", "name 1"], ["2", "name 2"], ["3", "name 3"]]}}, {"phase": "응답", "title": "행 레코드를 Member 객체로 바꿈", "file": "Member.java", "hl": ["@NoArgsConstructor", "private Long id;", "private String name;"], "active": [5], "move": null, "dir": "res", "desc": ["Hibernate 가 행 레코드 한 줄마다 Member 객체 한 개를 만듭니다.", "@NoArgsConstructor 가 만든 빈 생성자로 객체를 먼저 만들고, id 열 값은 id 변수에, name 열 값은 name 변수에 넣습니다.", "만들어진 객체 3개를 List 에 담습니다."], "data": {"kind": "pre", "label": "만들어진 객체 (List<Member>)", "text": "Member  id=1  name=\"name 1\"\nMember  id=2  name=\"name 2\"\nMember  id=3  name=\"name 3\""}}, {"phase": "응답", "title": "목록이 TestService 로 돌아감", "file": "TestService.java", "hl": ["return memberRepository.findAll();"], "active": [5, 4], "move": [5, 4], "dir": "res", "desc": ["findAll() 의 결과인 List<Member> 가 호출한 곳인 TestService.getAllMembers 로 돌아옵니다.", "같은 줄의 return 이 이 목록을 다시 호출한 곳(TestController)으로 돌려줍니다."], "data": {"kind": "pre", "label": "돌아가는 값", "text": "List<Member>  (객체 3개)"}}, {"phase": "응답", "title": "목록이 members 변수에 담김", "file": "TestController.java", "hl": ["List<Member> members = testService.getAllMembers();"], "active": [4, 3], "move": [4, 3], "dir": "res", "desc": ["TestService 가 돌려준 목록이 TestController 의 members 변수에 담깁니다.", "기다리던 줄의 실행이 끝나고 다음 줄로 넘어갑니다."], "data": {"kind": "pre", "label": "members 변수", "text": "members = [Member(1), Member(2), Member(3)]"}}, {"phase": "응답", "title": "return members : 목록을 JSON 글자로 바꿈", "file": "TestController.java", "hl": ["@RestController", "return members;"], "active": [3, 2], "move": [3, 2], "dir": "res", "desc": ["return members 로 목록이 DispatcherServlet 으로 돌아갑니다.", "@RestController(@ResponseBody) 이므로 Jackson 라이브러리가 목록을 JSON 글자로 바꿉니다.", "Jackson 은 Member 의 @Getter 가 만든 getId(), getName() 메소드를 호출해서 값을 꺼냅니다.", "실제 결과에서는 name 이 id 보다 먼저 나옵니다. JSON 속성의 순서는 Jackson 이 정하며, 순서가 달라도 담긴 데이터는 같습니다."], "data": {"kind": "pre", "label": "만들어진 JSON (실제 응답 본문)", "text": "[{\"name\":\"name 1\",\"id\":1},{\"name\":\"name 2\",\"id\":2},{\"name\":\"name 3\",\"id\":3}]"}}, {"phase": "응답", "title": "HTTP 응답을 브라우저로 보냄", "file": null, "hl": [], "active": [2, 1, 0], "move": [2, 0], "dir": "res", "desc": ["DispatcherServlet 이 JSON 글자를 응답 본문에 넣고, 톰캣이 브라우저로 보냅니다.", "상태 코드 200 은 요청이 성공했다는 뜻입니다.", "Content-Type: application/json 은 본문이 JSON 이라는 뜻입니다."], "data": {"kind": "pre", "label": "실제 HTTP 응답", "text": "HTTP/1.1 200\nContent-Type: application/json\n\n[{\"name\":\"name 1\",\"id\":1},{\"name\":\"name 2\",\"id\":2},{\"name\":\"name 3\",\"id\":3}]"}}, {"phase": "응답", "title": "브라우저 화면에 결과 표시", "file": null, "hl": [], "active": [0], "move": null, "dir": "res", "desc": ["브라우저가 받은 JSON 글자를 화면에 보여 줍니다.", "한 번의 요청이 이렇게 끝납니다. 같은 주소를 다시 열면 요청 단계부터 다시 실행됩니다.", "시작 준비 단계(빈 생성, 테이블 생성, data.sql)는 다시 실행되지 않습니다."], "data": {"kind": "browser", "label": "브라우저 화면", "url": "localhost:8080/test", "text": "[{\"name\":\"name 1\",\"id\":1},{\"name\":\"name 2\",\"id\":2},{\"name\":\"name 3\",\"id\":3}]"}}];
const FILES = {"SpringbootDeveloperApplication.java": "package me.shinsunyoung.springbootdeveloper;\n\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\npublic class SpringbootDeveloperApplication {\n\n    public static void main(String[] args) {\n\n        SpringApplication.run(SpringbootDeveloperApplication.class, args);\n\n    }\n\n}", "TestController.java": "package me.shinsunyoung.springbootdeveloper;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\nimport java.util.List;\n\n@RestController\npublic class TestController {\n\n    @Autowired\n    TestService testService;\n\n    @GetMapping(\"/test\")\n    public List<Member> getAllMembers() {\n\n        List<Member> members = testService.getAllMembers();\n\n        return members;\n    }\n}", "TestService.java": "package me.shinsunyoung.springbootdeveloper;\n\nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\n\nimport java.util.List;\n\n@Service\npublic class TestService {\n\n    @Autowired\n    MemberRepository memberRepository;\n\n    public List<Member> getAllMembers() {\n\n        return memberRepository.findAll();\n    }\n}", "MemberRepository.java": "package me.shinsunyoung.springbootdeveloper;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.stereotype.Repository;\n\n@Repository\npublic interface MemberRepository extends JpaRepository<Member, Long> {\n\n}", "Member.java": "package me.shinsunyoung.springbootdeveloper;\n\nimport jakarta.persistence.*;\n\nimport lombok.AccessLevel;\nimport lombok.Getter;\nimport lombok.NoArgsConstructor;\n\n@Getter\n@Entity\n@NoArgsConstructor(access = AccessLevel.PROTECTED)\npublic class Member {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Column(name = \"id\", updatable = false)\n    private Long id;\n\n    @Column(name = \"name\", nullable = false)\n    private String name;\n\n    public Member(String name) {\n        this.name = name;\n    }\n}", "application.yml": "spring:\n\n  jpa:\n\n    show-sql: true\n\n    properties:\n\n      hibernate:\n\n        format_sql: true\n\n    defer-datasource-initialization: true", "data.sql": "INSERT INTO member (id, name) VALUES (1, 'name 1')\n\nINSERT INTO member (id, name) VALUES (2, 'name 2')\n\nINSERT INTO member (id, name) VALUES (3, 'name 3')"};
const PATHS = {"SpringbootDeveloperApplication.java": "src/main/java/me/shinsunyoung/springbootdeveloper/SpringbootDeveloperApplication.java", "TestController.java": "src/main/java/me/shinsunyoung/springbootdeveloper/TestController.java", "TestService.java": "src/main/java/me/shinsunyoung/springbootdeveloper/TestService.java", "MemberRepository.java": "src/main/java/me/shinsunyoung/springbootdeveloper/MemberRepository.java", "Member.java": "src/main/java/me/shinsunyoung/springbootdeveloper/Member.java", "application.yml": "src/main/resources/application.yml", "data.sql": "src/main/resources/data.sql"};
const NODES = [{"name": "브라우저", "sub": "Chrome, Edge 등"}, {"name": "내장 톰캣", "sub": "8080 포트"}, {"name": "DispatcherServlet", "sub": "스프링 자동 등록 (파일 없음)"}, {"name": "TestController", "sub": "TestController.java"}, {"name": "TestService", "sub": "TestService.java"}, {"name": "MemberRepository", "sub": "MemberRepository.java + Hibernate"}, {"name": "H2 DB", "sub": "member 테이블 (메모리)"}];

const $ = (id) => document.getElementById(id);
const stack = $('stack'), packet = $('packet');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = 0, timer = null;

// 구간(브라우저 ~ H2 DB) 만들기
const bands = NODES.map((n, i) => {
  const d = document.createElement('div');
  d.className = 'band' + (i === NODES.length - 1 ? ' db' : '');
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = n.name;
  const sb = document.createElement('div'); sb.className = 'sb'; sb.textContent = n.sub;
  d.append(nm, sb);
  stack.appendChild(d);
  return d;
});

// 단계 번호 버튼 (시작 준비 / 요청 / 응답 묶음)
const phases = ['시작 준비', '요청', '응답'];
const dotBtns = [];
phases.forEach((ph) => {
  const g = document.createElement('div'); g.className = 'grp';
  const gl = document.createElement('span'); gl.className = 'gl'; gl.textContent = ph;
  g.appendChild(gl);
  STEPS.forEach((s, i) => {
    if (s.phase !== ph) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dot'; b.textContent = i + 1;
    b.setAttribute('aria-label', (i + 1) + '단계 : ' + s.title);
    b.addEventListener('click', () => { stop(); go(i); });
    g.appendChild(b); dotBtns[i] = b;
  });
  $('dots').appendChild(g);
});

function centerY(i) {
  const b = bands[i];
  return b.offsetTop + b.offsetHeight / 2 - 8;
}

function placePacket(step) {
  packet.className = 'packet ' + (step.dir === 'none' ? '' : step.dir);
  if (step.move) {
    const [from, to] = step.move;
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(from) + 'px)';
    void packet.offsetHeight;
    packet.style.transition = reduce ? 'none' : 'transform 1s cubic-bezier(.45,0,.2,1)';
    packet.style.transform = 'translateY(' + centerY(to) + 'px)';
  } else {
    packet.style.transition = 'none';
    packet.style.transform = 'translateY(' + centerY(step.active[0]) + 'px)';
    packet.classList.add('pulse');
  }
}

function renderCode(step) {
  const wrap = $('codewrap');
  wrap.innerHTML = '';
  if (!step.file) {
    $('fname').textContent = '프로젝트 파일 없음';
    $('fpath').textContent = '톰캣과 DispatcherServlet 은 스프링 부트 라이브러리 안의 코드입니다.';
    $('hlcount').textContent = '';
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = '이 단계에서는 개발자가 작성한 파일이 실행되지 않습니다. 왼쪽에서 신호가 지나가는 구간을 확인하세요.';
    wrap.appendChild(e);
    return;
  }
  $('fname').textContent = step.file;
  $('fpath').textContent = PATHS[step.file];
  const box = document.createElement('div'); box.className = 'code'; box.tabIndex = 0;
  box.setAttribute('aria-label', step.file + ' 코드');
  let first = null, n = 0;
  FILES[step.file].split('\n').forEach((line, i) => {
    const row = document.createElement('div'); row.className = 'ln';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = i + 1;
    const tx = document.createElement('span'); tx.textContent = line || ' ';
    row.append(no, tx);
    if (line.trim() && step.hl.some((h) => line.includes(h))) {
      row.classList.add('hl'); n++;
      if (!first) first = row;
    }
    box.appendChild(row);
  });
  wrap.appendChild(box);
  $('hlcount').textContent = n ? '강조된 줄 ' + n + '개 : 이 단계에서 실행되거나 쓰이는 코드' : '';
  if (first) box.scrollTop = Math.max(0, first.offsetTop - box.clientHeight / 3);
}

function renderData(step) {
  const d = step.data, body = $('dbody');
  $('dlabel').textContent = d.label;
  body.innerHTML = '';
  if (d.kind === 'table') {
    const t = document.createElement('table');
    const tr = document.createElement('tr');
    d.cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); });
    t.appendChild(tr);
    d.rows.forEach((r) => {
      const row = document.createElement('tr');
      r.forEach((c) => { const td = document.createElement('td'); td.textContent = c; row.appendChild(td); });
      t.appendChild(row);
    });
    body.appendChild(t);
  } else if (d.kind === 'browser') {
    const b = document.createElement('div'); b.className = 'browser';
    const bar = document.createElement('div'); bar.className = 'bar'; bar.textContent = d.url;
    const v = document.createElement('div'); v.className = 'view'; v.textContent = d.text;
    b.append(bar, v); body.appendChild(b);
  } else {
    const p = document.createElement('pre'); p.textContent = d.text; body.appendChild(p);
  }
}

function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  $('stepno').textContent = (cur + 1) + ' / ' + STEPS.length + '단계';
  const ph = $('phase');
  ph.textContent = s.phase;
  ph.className = 'phase p' + phases.indexOf(s.phase);
  $('title').textContent = s.title;
  const ol = $('desc'); ol.innerHTML = '';
  s.desc.forEach((t) => { const li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
  bands.forEach((b, k) => { b.className = 'band' + (k === NODES.length - 1 ? ' db' : ''); });
  s.active.forEach((k) => bands[k].classList.add('active', s.dir));
  renderCode(s);
  renderData(s);
  ['desc', 'codewrap', 'dbody'].forEach((id) => { const el = $(id); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });
  placePacket(s);
  dotBtns.forEach((b, k) => { b.classList.toggle('cur', k === cur); b.classList.toggle('done', k < cur); b.setAttribute('aria-current', k === cur ? 'step' : 'false'); });
  if (dotBtns[cur]) dotBtns[cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('prev').disabled = cur === 0; $('first').disabled = cur === 0;
  $('next').disabled = cur === STEPS.length - 1;
}

function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = '자동 재생'; }
function play() {
  if (timer) { stop(); return; }
  if (cur === STEPS.length - 1) go(0);
  $('play').textContent = '멈춤';
  timer = setInterval(() => { if (cur >= STEPS.length - 1) { stop(); return; } go(cur + 1); }, 4200);
}

$('first').addEventListener('click', () => { stop(); go(0); });
$('prev').addEventListener('click', () => { stop(); go(cur - 1); });
$('next').addEventListener('click', () => { stop(); go(cur + 1); });
$('play').addEventListener('click', play);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('.code')) return;
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
});
window.addEventListener('resize', () => placePacket(Object.assign({}, STEPS[cur], { move: null })));

$('dl').addEventListener('click', () => {
  stop();
  const blob = new Blob([ORIGINAL_HTML], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chapter3-request-flow.html';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

go(0);
</script>
