<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>멀티미디어 파일 삽입하기</title>
</head>
<body>
  <!--
    <embed>는 
      - 웹페이지 안에 미디어(소리, 영상 등)를 삽입해서 재생할 수 있게 해주는 태그입니다.
      - 보통 오디오(mp3), 비디오(mp4), PDF, 플래시 등을 삽입할 때 사용합니다.
      - 닫는 태그는 필요 없습니다 (<embed>는 빈 태그입니다)

     <embed> 태그 기본 문법
           <embed src="파일경로" type="파일형식" width="너비" height="높이">
  -->

    <!--'spring.mp3'라는 음악 파일을 재생할 수 있도록 삽입합니다.-->
    <embed src="./medias/spring.mp3">        


</body>
</html>
