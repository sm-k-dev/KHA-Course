<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>멀티미디어 파일 삽입하기</title>
</head>
<body>
  <h1>웹 문서에 PDF 파일 삽입하기</h1>
<!-- 
  <object> 태그는 웹페이지 안에 다른 문서나 파일(PDF, 영상 등)을 불러와 보여주는 태그입니다.
  예를 들어, 웹페이지 안에 PDF 문서를 바로 볼 수 있도록 삽입할 때 사용합니다.

  <object> 태그 기본 문법
    
    <object data="파일경로" width="너비" height="높이"></object>
-->
    <object data="product.pdf" width="900" height="800"></object>

  
</body>
</html>
