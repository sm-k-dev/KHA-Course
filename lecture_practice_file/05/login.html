<!DOCTYPE html>
<html lang="ko">
  <head>
		<meta charset="UTF-8">
		<title>로그인</title>
  </head>
  <body>
 <!-- 
		1. <input>태그?
		   - 다양한 입력할수 있는 화면을 보여주며, 사용자가 입력한 정보를 받을떄 사용되는 태그.
		   - 기본문법
		   		<input 속성=값>
		
		2. <input>태그에 다양한 입력할 디자인 유형을 설정하는 type속성?
		   		
		   	- 기본문법
		   		<input type="다양한종류의값중하나" >
		   		
		3.  type="text" 와 type="password"
		
			-  <input type="text">
				
				주로 아이디나 , 이름, 주소 등 한줄짜리 일반텍스트를 입력할때 사용합니다.
				
			-  <input type="password">
			   		
		   		비밀번호를 입력할때 사용합니다.
		   		이때 비밀번호를 화면에 노출되지 않고  * 기호나 ● 기호로 표시됩니다.
		 
		 4. <input type="text"> 텍스트필드와 
		    <input type="password">인 비밀번호필드에서 사용하는 주요 다른 속성들
		    
		    - size속성 : 텍스트필드와 비밀번호필드 화면에 입력한 데이터가 
		    			몇 글자가 보이도록할 것인지를 지정하는 속성입니다.
		    			예를 들어 최대로 입력할수 있는 글자수가 10개인데 
		    			size속성값을 5로 지정하면
		    			필드 크기는 5개 글자 크기에 맞추고 나머지 5개 글자는 화면에 
		    			보이지 않습니다.
		    
		    - value속성 : 텍스트필드 요소가 화면에 표시될때 텍스트필드 부분에 보여주는 내용을
		    			 설정하는 속성입니다.
		    			 이 value속성을 작성하지 않으면 빈 공백문자열 텍스트가
		    			 텍스트필드에 표시됩니다.
		    			 비밀번호 필드에는 사용하지 않는 속성입니다.
		    
		    - maxlength속성 : 텍스트필드와 비밀번호필드에 입력할수 있는
		    				 최대 문자 수를 지정하는 속성입니다.
	
	 -->

	<form>
    <fieldset>
    	<label>아이디:<input type="text" size="10" value=""> </label>
      <label>비밀번호:<input type="password" size="10"> </label>
      <input type="submit" value="로그인">
    </fieldset>
  </form>
  </body>
</html>
