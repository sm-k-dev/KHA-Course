<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<!--
		<form></form> 태그?

		- <form>태그는 몇가지 속성을 사용해서 입력받은 자료를 어떤 전송 방식으로
			서버페이지로 넘겨서 요청할 것인지 지정하는 태그 입니다.

		- 기본 문법
			<form 속성1="값" 속성2="값">
				여러 입력 태그들을 넣을 수 있다.
			</form>

		- <form></form> 태그의 속성 종류들
		1. method속성 : 사용자가 입력한 내용을 WAS서버쪽 프로그램(.jsp)로
										어떻게 넘겨줄것인지 지정하는 속성으로 값으로 get과 post중 하나를 사용함
						
				get 방식 : 요청할 데이터를 256 ~ 4,096 byte까지만 서버페이지쪽으로 넘길수 있는 방식
									 웹브라우저 주소창에서 사용자가 입력한 요청한 데이터들이
									 그대로 노출된다는 단점이 있습니다.
				post 방식 : 입력한 내용의 길이에 제한을 받지 않고 사용자가 입력한 내용도
										웹브라우저 주소창에 드러나지 않습니다. 보안에 좋습니다.
										대량의 요청할 값이 있을때 이 전송 요청 방식을 사용합니다.

			2. name속성 : 자바스크립트 언어 문법으로 <form></form>요소를 제어할때 사용함
										<form> 태그의 이름을 지정할 때 사용하는 속성.
			
			3. action속성 : <form></form>으로 감싼 <input>태그들에 입력한 요청하는 데이터들을
											WAS가 실행하는 어떤 서버페이지로 넘겨 줄지
											서버페이지의 경로를 설정하는 속성입니다.

											<form action="a.jsp"></form>

			4. target속성 : action속성에 지정한 서버페이지를 현재 브라우저 창이 아닌
			                다른 웹브라우저 창에서 열어 요청할 수 있도록 하는 속성입니다.
			
			5. autocomplete속성 : <form>태그로 감싸져 있는 자식태그에 데이터를 입력할때
														예전에 입력했던 내용을 자동으로 표시 해주는 속성입니다.
														autocomplete속성의 기본값은 "on"입니다.
														즉! 자동완성이 기본으로 켜져 있으므로 한번이라도 입력한 적이 있는값을
														한 두 글자만 입력하면 예전에 입력한 내용을 자동으로 보여줍니다.
														"off"로 지정하면 자동완성 기능을 끌 수 있습니다.
				--------------------------------------------------------------------------
			
			
		  <fieldset></fieldset> 태그?
		   - 하나의 <form></form>태그안에서 여러 구역을 나누어 표시할떄 사용하는 태그.
		   - 기본문법
		   		 <fieldset>
		   		 	<lengend>그룹 이름</lengend>
		   		 </fieldset>
		  -----------------------------------------------------------------
		  
		  <label></label> 태그?
		   - 한줄 텍스트를 입력 받을수 있는 <input>태그 앞에 텍스트를 표시할 영역을 지정하는 태그.
		   - 기본문법1.
		   		  <label>레이블명<input></label>
		  		  설명 : <label></label>태그 안에 <input>태그를 넣는 문법
		   - 기본문법2.
		   		  <label for="id">레이블명</label>
		   		  <input id="id명">		  
		   		  설명 : <label></label>태그와 <input>태그를 따로 작성 해 놓고
		   		  		<label>태그의 for속성값과 <input>태그의 id속성값을 서로 같게 입력하여
		   		  		서로 연결하는 것입니다.
		   		  		다시 말해 <input>태그의 id속성값을 
		   		  		<label>태그의 for속성에게 알려주는 방법을 사용합니다.
		   		  		
		   	결론: 첫번째 기본문법1. 보다 	두번째 기본문법2를 사용하면
		   	     <label>과 <input>사이 서로 떨어져 작성되더라도 둘 사이를 
		   	     쉽게 연결할수 있다는 장점이 있습니다.  									
	-->
	 <h1>레드향 주문하기</h1>
	 <form action="request.jsp" method="get"  >
			<fieldset>
				<legend>상품 선택</legend>
				<label>아이디(6자이상)<input></label>
			</fieldset>
			<fieldset>
				<legend>배송 정보</legend>
				<label for="user-id">아이디(6자이상)</label>
				<input type="text" id="user-id">
			</fieldset>
	 </form>


</body>
</html>
