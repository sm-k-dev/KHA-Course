<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날짜와 시간</title>
</head>
<body>
  <form>

    <!--
      날짜 입력을 나타내는 type="date", type="month", type="week" 

      - 달력에서 날짜를 선택해서 입력할때는 type="date" 사용
       
        기본 작성 문법
          <input type="date">
          -> 달력에서 날짜를 선택해서 입력하게 합니다.
          -> 날짜를 선택하면 필드에 'yyyy-mm-dd' 형식으로 연도, 월, 일이 표시됩니다.
                                    '2025-10-01'
    

      - 달력에서 날짜 중 월을 선택해서 입력할때는 type="month" 사용
            
              기본 작성 문법
                <input type="month">
                -> 달력에서 날짜 중 월을 선택해서 입력하게 합니다.
                -> 날짜 중 월을 선택하면 필드에 'yyyy-mm' 형식으로 연도, 월 까지만 표시됩니다.


      - 달력에서 주를 선택해서 입력할때는 type="week" 사용
                
                  기본 작성 문법
                    <input type="week">
                    -> 달력에서 주를 선택해서 입력하게 합니다.
                    -> 주를 선택하면 1월 첫째 주를 기준으로 몇 번째 주인지 '연도-주' 가 표시됩니다.
    -->

    <!--예제. 3가지 형식의 날짜 입력하기 -->
    <h1>날짜 지정하기</h1>
    <input type="date">
    <input type="month">
    <input type="week">
    <hr>

    <!--
      시간 입력을 나타내는 type="time", type="datetime", type="datetime-local"

      - 시간을 지정할때는 type="time" 사용
          기본 작성 문법
              <input type="time">
              -> 시간을 입력하게 합니다. 
              -> 입력 항목이 3개로 구성됩니다. 
                 첫번째 항목부터 '오전'과 '오후'를 의미하고
                 나머지 항목은 '시'와 '분'을 의미 압니다.

      - 날짜와 시간을 함께 지정할떄는 type="datetime" 이나 type="datetime-loacal" 사용
           기본 작성 문법
               <input type="datetime"> 
               또는
               <input type="datetime-local">
               -> 사용자가 웹 문서를 보고 있는 지역에 맞는 날짜와 시간을 함꼐 입력할수 있습니다.  
    -->

    
    <!--예제. 2가지 형식의 시간 입력하기 -->
    <h1>시간 지정하기</h1>
    <!-- 
      type="time":
      - 시간만 입력 받는 입력칸.
      - 예: 14:30, 09:15 같은 형식으로 '시:분' 을 선택할 수 있음.
      - 달력은 안 나오고 시간 선택 UI만 나옴.
    -->
    <input type="time">

    <!-- 
      type="datetime-local":
      - 날짜 + 시간 모두 입력 받는 입력칸.
      - 예: 2025-07-14 14:30 같은 형식으로 날짜와 시간을 한 번에 선택.
      - 'local'은 사용자의 로컬(브라우저) 기준으로 선택된다는 의미.
    -->
    <input type="datetime-local">

    <hr> <!-- 위와 아래 내용을 구분해주는 가로선 (수평선) -->



    

     <!--예제. 날짜의 범위를 제한하여 입력하기 -->
    <h1>범위 제한하기</h1>

    <!-- 
      type="date":
      - 날짜만 선택할 수 있는 입력칸.
      - 사용자가 달력에서 원하는 날짜를 고름.
      - 아래 min, max 속성으로 선택할 수 있는 날짜 범위를 제한할 수 있음.
      
      min="2020-02-01":
      - 선택할 수 있는 최소 날짜를 지정.
      - 이 예제에서는 2020년 2월 1일 이후만 선택 가능.

      max="2020-02-15":
      - 선택할 수 있는 최대 날짜를 지정.
      - 이 예제에서는 2020년 2월 15일 이전까지만 선택 가능.

      즉, 사용자는 2020년 2월 1일부터 2월 15일 사이의 날짜만 선택할 수 있음.
    -->
    <input type="date" min="2020-02-01" max="2020-02-15">

    <!-- 
      다시 type="time":
      - 시간만 선택할 수 있는 입력칸.
      - 위와 동일하게 시:분만 선택.
      - 이 칸은 범위 제한이 따로 없음.
    -->
    <input type="time">

  </form>
</body>
</html>
