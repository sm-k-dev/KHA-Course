<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레드향 주문하기</title>
</head>
<body>
  <h1>레드향 주문하기</h1>
  <form>
	 <!-- 
	 	  6.  type="checkbox"
	 	      type="radio"
	 
	 		- <input type="checkbox">
	 		
	 			여러 항목 중에서 1개 이상의 원하는 항목을 체크해서 선택할 때 사용되는 요소이다
	 
	 		- <input type="radio">
	 		
	 			여러 항목 중에서 원하는 1개의 항목을 선택할 떄 사용되는 요소이다.
	 
	 	 7. <input type="checkbox">인 체크박스와
	 	    <input type="radio">인 라디오버튼에서 사용하는 주요 다른 속성들
	 	    
	 	     -  value속성 : 선택한 체크박스나 라디오버튼을 서버페이지에게 알려줄때 넘겨줄값을
	 	     			   지정하는 속성으로 요청하는 값은 영문이거나 숫자여야하며
	 	     			   필수 속성입니다.
	 	     			   
	 	     -  checked속성 : 체크박스나 라디오버튼의 항목은 
	 	     				 처음에 아무것도 선택되지 않은 상태로
	 	     				 웹브라우저 화면에 표시되는데			
	 	     				 여러 항목 중에서 기본으로 선택해 놓고 싶은 항목에 사용합니다.
	 	     				 속성에 대한 값을 따로 없습니다.   
	 	     	
	  -->    
	 
	 <!-- 실습.  체크박스와  라디오 버튼을 삽입하는 폼(디자인) 만들기  -->    
    <fieldset>
      <legend>상품 선택</legend>
      <p><b>주문할 상품을 선택해 주세요.</b></p>
      <ul>
        <li>
          <label><input type="checkbox" value="s_3">선물용 3kg</label>
          <input type="number">개
        </li>
        <li>
          <label><input type="checkbox" value="s_5" checked>선물용 5kg</label>
          <input type="number">개
        </li>
        <li>
          <label><input type="checkbox" value="f_3" checked>가정용 3kg</label>
          <input type="number">개
        </li>
        <li>
          <label><input type="checkbox" value="f_5">가정용 5kg</label>
          <input type="number">개
        </li>
      </ul>   
      <p><b>포장 선택</b></p>
      <ul>
        <li><label><input type="radio" name="gift" value="yes" >선물 포장</label></li>
        <li><label><input type="radio" name="gift" value="no">선물 포장 안 함</label></li>
      </ul>     
    </fieldset>
    <fieldset>
      <legend>배송 정보</legend>
      <ul>
        <li>
          <label for="user-name">이름 </label>
          <input type="text" id="user-name">
        </li>
        <li>
          <label for="addr">배송 주소</label>
          <input type="text" id="addr">
        </li>
        <li>
          <label for="mail">메일 주소</label>
          <input type="email" id="mail">
        </li>        
        <li>
          <label for="phone">연락처</label>
          <input type="tel" id="phone">
        </li>
      </ul>  
    </fieldset>      
  </form>
</body>
</html>
