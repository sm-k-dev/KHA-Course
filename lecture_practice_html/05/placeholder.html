<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레드향 주문하기</title>
  <link rel="stylesheet" href="css/order.css">
</head>
<body>
  <div id="container">
    <h1>레드향 주문하기</h1>
    <form>
      <fieldset>
        <legend>배송 정보</legend>
        <ul id="shipping">
          <li>
            <!--
              autofocus 속성 : 웹 문서를 불러오자 마자 '이름' 옆 <input>텍스트 필드에 입력커서가 표시되도록 설정
              placeholder 속성 : 연락처 <input>필드에 힌트 메세지를 표시하도록 설정

              예제. autofocus 속성과  placeholder 속성 사용하기
            -->
            <label for="user-name">이름 </label>
            <input type="text" id="user-name" placeholder="한글로 이름 입력 해 주세요."  >
          </li>
          <li>
            <label for="addr">배송 주소</label> 
            <input type="text" id="addr" required placeholder="사는 지역만 입력해 주세요.">
          </li>
          <li>
            <label for="mail">이메일</label>
            <input type="email" id="mail" autofocus placeholder="이메일 형식에 맞게 입력 해 주세요.">
          </li>        
          <li>
            <label for="phone">연락처</label>
            <input type="tel" id="phone"   placeholder="하이픈 빼고 입력해 주세요.(01012345678)" required>
          </li>
          <li>
            <label for="d-day">배송 지정</label>
            <input type="date" id="d-day"> <small>(주문일로부터 최소 3일 이후)</small>
          </li>        
        </ul>  
      </fieldset>
      <div id="buttons">
        <input type="submit" value="주문하기"> 
        <input type="reset" value="취소하기">
      </div>        
    </form>
  </div>
</body>
</html>
