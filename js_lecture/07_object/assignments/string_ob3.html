<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            주제: 웹사이트 방문자에게 이름을 영문으로 입력받아
                    방문자가 입력한 영문 이름에 소문자가 포함되어 있으면
                    모두 대문자로 변경해서 출력

                또한 사이트 방문자로부터 연락처를 입력받은 후
                    연락처 정보중 뒷번호가 노출되지 않도록 뒷 네자리는 ****로 변경하여 출력
        */
        // 1. prompt() 메소드를 호출하는 구문 작성
        let userName = prompt("이름을 영문으로 입력해 주세요", "Hong kildong");

        // 2. 입력받은 영문 이름에 소문자가 섞여 있으면 모두 대문자로 변경한 전체 문자열을 반환받아
        //      upperName 변수에 저장.
        let upperName = userName.toUpperCase();

        // 3. upperName 변수에 저장된 이름을 출력 후 줄바꿈
        document.write("사용자 이름: ", upperName, "<br>");

        // 1. prompt() 메소드를 호출해서 userPhone 변수에 저장
        let userPhone = prompt("핸드폰 번호를 입력해 주세요 (- 없이, 공백 없이)", "01012345678");

        // 2. 입력받은 전화번호 문자열 중에서 전화번호 뒷자리 4자리를 제외한 앞 전화번호 문자열을 자른후
        //    뒷 네자리는 "****" 문자열과 결합한 후 하나의 문자열 형태로 만든 뒤 result 변수에 저장
        let result = userPhone.substr( 0, userPhone.length-4 ).concat("****");

        document.write("사용자 폰번호: ", result, "<br>");
    </script>
</body>
</html>
