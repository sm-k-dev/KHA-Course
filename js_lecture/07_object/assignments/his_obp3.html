<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>세 번째 (his_obp3.html) 페이지 화면</h1>
    <!--
        history 객체의 go() 메소드 호출시
        
        매개변수로 -1을 집어 넣으면 이전 방문했던 1단계 이전페이지(his_obp2.html)를
        재요청해서 같은 브라우저 창화면에 보여줌

        만약 -2를 집어 넣으면 이전에 한번이라도 방문했던 2단계 이전페이지(his_obp1.html)를
        재요청해서 같은 브라우저 창화면에 보여줌
    -->
    <button onclick="history.go(-1);">1단계 이전 페이지</button> <br>

    <button onclick="history.go(-2)">2단계 이전 페이지</button>
</body>
</html>
