<body>

    <a href="his_obp2.html">두번재 페이지 이동</a>

        다음 페이지 버튼을 클릭하면
        history 객체의 forward(); 메소드가 실행되어
        같은 브라우저 창에서 현재 보고 있는 페이지 다음으로 요청했었던 화면(his_obp3.html)을 
        재요청해서 같은 브라우저 화면에 보여준다.
    -->
    <button onclick="history.forward();">다음 페이지</button>

</body>
