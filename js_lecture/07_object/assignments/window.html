<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>

<body>
    <!-- 
		아래의 버튼에 클릭하는 행위(click이벤트)를 등록 할때 onclick속성을 작성합니다.
		사이트 이용자가  화면으로 보고 팝업창 열기 <button>을 클릭하는 행위가 발생되면
		popup();함수 호출구문이 실행되어 popup()함수의 기능을 수행합니다. (click이벤트 처리 합니다.)
	-->
    <button onclick="popup();">팝업창 열기</button>

    <script>
        /*
            브라우저 객체 모델(BOM, Browser Object Model)?
                - 웹브라우저 창에 관련한 정보를 제공하는 객체들

            주요 BOM객체 종류
                1. window객체
                    - BOM의 최상위 객체로, 웹브라우저 창을 나타내는 객체.
                    - 전역객체이므로 window키워드를 생략하고 사용할수 있습니다.
                    - 주요 기능
                            1.1. 창크기 조절    ( window.innerWidth, window.innerHeight )
                            1.2. 새창 열기      ( window.open() )
                            1.3. 타이머 설정    ( setTimeout(),  setInterval() )
                            1.4. 대화상자 표시  ( alert(), prompt(), confirm() )
    
                2. navigator객체
                3. location객체
                4. history객체
                5. screen객체
                6. document객체
                ....
    
                1.window객체
                    - 사이트 이용자가 사용하고 있는 웹브라저 창 하나의 정보를 제공하는 객체
                    - open()메소드
                        : 새로운 윈도우창(팝업창)을 띄울떄 사용되는 메소드
                        : 사용법
                            window.open( "팝업창에 띄울 html파일의 경로", "팝업창 창제목", "옵션속성1 = 값1, 옵션속성2 = 값2" );
                            * 팁: 옵션에는 창의 가로(width), 세로(height) 크기 등을 지정함.
            
                    - close()메소드
                        : 현재 메소드가 속해있는 창을 닫는 기능을 하는 메소드
                        : 사용법
                            window.close();
                        웹 브라우저의 보안 규칙: 
                            현재 모든 현대 웹 브라우저(크롬, 사파리, 엣지 등)는 보안상 
                            "스크립트(코드)로 직접 띄운 팝업창(window.open()을 통해 열린 팝업창)"만 window.close()로 닫을 수 있게 제한하고 있습니다.
        */

        // 새로운 웹브라우저 창을 여는 기능의 함수 정의
        function popup() {
            // 새로운 팝업창을 띄우는 기능
            window.open("popup.html", "팝업창 창제목", "width=200, height=100, left=400, top=400");
        }
    </script>

</body>

</html>
