<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        class?
            - 객체메모리를 생성하는 규칙을 더 명확한 형태로 작성하는 설계도이다.
            - class 내부에는 생성자 함수를 안에 포함해서 만들어 놓을 수 있다.
        
            class 생성 문법

            class
                ---------------------------------------------
                class 클래스명 {
                    constructor( 매개변수1, 매개변수2 ) {
                        this.속성명1 = 매개변수1;
                        this.속성명2 = 매개변수2;
                    }
                    
                    메소드명() {
                        실행할 코드
                    }
                }
                ---------------------------------------------
            
            class 이용해서 객체 메모리 만드는 문법 (객체 생성)
                ---------------------------------------------
                let 객체참조변수 = new 클래스명( 인수1, 인수2 );
    -->
    <script>
        /*
            예제 주제 : class 설계도 작성 방식으로 객체 메모리 만들기 

            참고. class는 같은 구조의 객체 메모리를 만들기 위해 작성 해 놓은 설계도 이다.
                constructor는 객체 메모리가 생성될때 자동으로 실행되는 메소드 종류중 하나.
        */
        // 1. 제품 객체메모리를 만들기위한 class 설계도 하나 만들기
        class Product {

            // 생성자(constructor)는 객체 메모리가 만들어질 때 자동으로 호출되어 실행된다.
            constructor( name, price ) {
                // name 매개변수로 전달받은 이수값을 생성되는 객체 메모리의 name 속성명과 함께 저장
                this.name = name;
                this.price = price;
            }

            // 메소드
            // printInfo - 제품 정보를 화면에 출력하는 기능
            printinfo() {
                document.write("제품명: ", this.name, "<br>");
                document.write("가  격: ", this.price, " 원<br>");
                document.write("<hr>");
            }
        }

        // 2. Product 클래스 설계도 하나를 이용해 실제 제품 객체 메모리 2개 만든다.
        let product1 = new Product("키보드", 30000);
        let product2 = new Product("마우스", 15000);

        // 만들어진 객체 메모리의 printinfo 메소드를 호출해서 제품 정보를 출력
        product1.printinfo();
        product2.printinfo();
    </script>
</body>
</html>
