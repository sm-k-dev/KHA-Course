<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        window 객체의 close 메소드
        : 현재 메소드가 속해있는 창을 닫는 기능의 메소드
    -->
    <button onclick="window.close();">팝업창 닫기</button>
</body>
</html>
