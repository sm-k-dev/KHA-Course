<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            0.0 ~ 1.0 랜덤 실수값 하나 발생시키려면?

                Math.random();

            원하는 구간 3 ~ 7 사이의 랜덤수를 정수형태로 하나 발생시키려면?

                원하는 구간에서 난수 (랜덤값)을 정수로 발생하는 식
                    Math.floor( Math.random() * ( 최대값 - 최소값 + 1 ) ) + 최소값
                    
                    ex) Math.floor( Math.random() * ( 7 - 3 + 1 )) + 3;

                ===================================================================
                    최소값부터 최대값까지 정수가 총 몇개인지 계산
                    ( 최대값 - 최소값 + 1 ) 
                     7 - 3 + 1
                        5
                    
                    3, 4, 5, 6, 7
                ===================================================================
                    Math.floor( Math.random() * (7 - 3 + 1 ))
                    로 만들어진 정수는 
                        0, 1, 2, 3, 4
                    이다. 따라서 만들어진 숫자에 최소값 3을 더한다.
                        3, 4, 5, 6, 7
        */
        // 120 ~ 150 사이의 난수 하나를 정수로 발생
        let ranNum = Math.floor( Math.random() * ( 150 - 120 + 1)) + 120;
        document.write("ranNum: ", ranNum, "<br>");
    </script>
</body>
</html>
