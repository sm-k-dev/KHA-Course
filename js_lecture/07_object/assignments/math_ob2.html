<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<h1>컴퓨터가 랜덤으로 내는 가위, 바위, 보 중 하나 맞추는 게임</h1>");

        // prompt 메소드: 윈도우 메모리 내부에 만들어져있는 메소드
        // 클라이언트에게 "가위", "바위", "보" 중에 하나의 단어를 입력받아 t 변수에 저장
        let t = window.prompt("가위, 바위, 보 중에서 하나의 단어만 입력하세요", "가위"); // window 객체는 최 상위 객체라서 생략가능하다.

        // 클라이언트가 "가위" 입력시 -> 1 저장
        // 클라이언트가 "바위" 입력시 -> 2 저장
        // 클라이언트가 "보" 입력시 -> 3 저장
        // 위 처럼 저장할 tNum 생성
        let tNum;

        switch ( t ) { // 클라이언트가 입력한 값으로 판단할 값

            case "가위":
                tNum = 1;
                break;
            
            case "바위":
                tNum = 2;
                break;
            
            case "보":
                tNum = 3;
                break;
        
            default:
                window.alert("잘 못 작성하셨습니다."); // window 메모리 내부에 만들어져있는 alert 메소드, 알림창(경고메세지)
                
                // F5를 자동으로 누른 기능과 같다.
                location.reload(); // 새로고침 처럼 현재 보고 있는 math_ob2.html URL을 주소창에 자동으로 입력해 주고 엔터를 눌러 현재 페이지를 재요청하는 기능의 메소드
                break;
        }

        /*
            컴퓨터가 내는 랜덤수(난수) 구하기
            - 1 부터 3까지 중에서 랜덤수(난수)를 정수 하나로 발생시킨다.

                1 -> 가위, 2 -> 바위, 3 -> 보
        */
        let com = Math.ceil( Math.random() * 3 ); 
        /*
            0.0 <= n < 1.0 임의의 부동소수점 수 하나를 반환해 준다.
                - 예를들어 0.123 또는 0.567 또는 0.999 등의 값

            Math.random() * 3
            - Math.random() 메소드의 반환값에 3을 곱한다.
                이렇게 하면 0과 3사이의 임의의 수가 생성
                - 예를들어 만약 Math.random() 이 0.123을 반환했다면 3을 곱해 0.369가 된다.
            
            Math.ceil( 0.369 )
            - ceil 메소드는 소수점 첫자리 3에서 올림 처리하여 정수 1로 만들어 반환한다.
                위에서 계산된 0과 3사이의 0.369를 매개변수로 전달.
                - 예를들어 0.369 는 소수점 첫자리 3에서 올림 처리하여 1이 되고,
                    2.5는 소수점 첫자리 5에서 오림처리하여 3이 된다.
        */
        
        document.write("<img src='../images/math_img_", com, ".jpg' alt='가위, 바위, 보'>");

        /*
            클라이언트가 입력한 "가위" "바위" "보" 중 하나와
            컴퓨터가 낸 난수 (1 2 3) 과 비교
            요약: tNum 변수에 저장된 값과 com 변수의 값이 같은지 비교
        */
        if ( tNum === com ) {
            window.alert("컴퓨터가 낸 값과 당신이 입력한 값은 같습니다.");
            window.alert("상품은 없습니다.");
        } else if ( tNum !== com ) {
            alert("틀렸네요. 다음 기회에 도전하세요");
        }
    </script>
</body>
</html>
