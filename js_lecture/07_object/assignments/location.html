<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            location 객체에서 제공하는 href 속성
            - href 속성명만 호출하면 웹브라우저 주소창에 사이트 이용자가 입력했던 
                전체 요청 주소 (URL)를 얻을 수 있다
        */

        document.write( location.href );

        /*
            location 객체의 href="재요청할URL";
            - href 속성명에 재요청할 주소를 저장시키면 저장된 주소가 브라우저 창에 자동으로 입력되고 엔터까지 눌러 재요청하게 된다.
            - 문법
                location.href = "재요청할 URL";
        */
        // 3초 쉬었다가, 한번만 function(){}을 실행하게 해서 네이버 사이트 재요청
        window.setTimeout( function(){

            document.write("3초가 지나면 naver 사이트를 재요청하게 됩니다.");
            location.href = "https://www.naver.com";

        }, 3000 );

        /*
            location 객체에서 제공하는 reload() 메소드
            - 현재 클라이언트가 보고 있는 화면(location.html)을 재요청하기 위해
                웹브라우저 주소창에 현재 보고 있는 화면의 URL 주소가
                자동으로 입력되어 자동으로 재요청 하게 하는 기능의 메소드

                요약: F5 자동으로 눌러지고 새로고침 되는 것.
        */
        // location.reload();
    </script>
</body>
</html>
