<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비교 연산자 2</title>
</head>
<body>
    <script>
        let a = 10; let b = 20; let c = 10; let f = "20"; let result;

        /*
            a 변수에 저장된 값이 b 변수에 저장된 값보다 더 크냐, 조건식 작성후
            조건식의 결과값을 result 변수에 저장
        */
        result = a > b; // 10 > 20 false
        console.log(`a > b result = ${result}`);

        /*
            a 변수에 저장된 값이 b 변수에 저장된 값보다 더 작으냐, 조건식 작성후
            조건식의 결과값을 result 변수에 저장
        */
        result = a < b; // 10 < 20 true
        console.log(`a < b result = ${result}`);

        /*
            b 변수에 저장된 값 20이 f 변수에 저장된 "20"과 숫자형태만 같으냐, 조건식 작성후
            조건식의 결과 값을 result 변수에 저장
        */
        result = b == f; // 20 == "20" -> 20 == 20 true
        console.log(`b == f result = ${result}`);

        /*
            a 변수에 저장된 값 10이 b 변수에 저장된 값 20의 숫자형태만 다르냐, 조건식 작성후
            조건식의 결과 값을 result 변수에 저장
        */
        result = a != b; // 10 != 20 true
        console.log(`a != b result = ${result}`);

        /*
            b 변수에 저장된 20과 f 변수에 저장된 "20"이 숫자형태도 같고 자료형도 정확히 같으냐, 조건식 작성후
            조건식의 결과 값을 result 변수에 저장
        */
        result = b === f; // 20 === "20" false
        console.log(`b === f result = ${result}`);

        /*
            b 변수에 저장된 20이 f 변수에 저장된 "20"과 숫자형태 그리고 자료형 모두 다르냐, 조건식 작성후
            조건식의 결과 값을 result 변수에 저장
        */
        result = b !== f; // 20 !== "20" true
        console.log(`b !== f result = ${result}`);
    </script>
</body>
</html>
