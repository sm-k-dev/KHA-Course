<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>증감 연산자 4</title>
</head>
<body>
    <script>
        let num3 = 10;

        document.write("num3: ", num3, "<br>");
        document.write("num3--: ", num3--, "<br>");
        // 출력은 3이 되고 num3 은 9가 된다.
        document.write("num3: ", num3, "<br>");

        document.write("--num3: ", --num3, "<br>");
        document.write("num3: ", num3, "<br>");
    </script>
</body>
</html>
