<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        
        */
        let numberA = 2; let numberB = 2; let numberC = "2";

        // numberA 변수에 저장된 값과 numberB 변수에 저장된 저장된 값이 자료종류 + 값 이 모두 일치하는가
        document.write("numberA === numberB: ", numberA === numberB, "<br>"); // true

        // numberB 변수에 저장된 값 2와 numberC 변수에 저장된 값 "2"가 자료종류 + 값이 모두 일치하는가
        document.write("numberB === numberC: ", numberB === numberC, "<br>"); // false

        document.write("numberB == numberC: ", numberB == numberC, "<br>"); // true

        document.write("numberB != numberC: ", numberB != numberC, "<br>"); // false
    </script>
</body>
</html>
