<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼항 조건 연산자 3</title>
</head>
<body>
    <script>
        // 주제: 세개의 숫자 중 가장 큰 수를 삼항 조건 연산자 식으로 구하는 예

        // 세개의 숫자를 각각 상수메모리를 만들어 저장
        const num1 = 10; const num2 = 20; const num3 = 15;

        // 삼항 조건 연산자식 을 사용하여 가장 큰 수 찾기
        const max = ( num1 > num2 ) ? ( num1 > num3 ? num1 : num3 ) : ( num2 > num3 ? num2 : num3 ) ;
        console.log(`max: ${max}`);
    </script>
</body>
</html>
