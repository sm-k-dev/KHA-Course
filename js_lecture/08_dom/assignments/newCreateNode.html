<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 웹 브라우저 창(window 객체)이 현재 html문서 안의 모든 HTML을 읽어들였을때
        // function함수가 호출되어 실행되게 하는 구문
        // body 태그보다 script를 먼저 작성했을 때 필요한 이벤트
        window.onload = function () {}
        
        /*
            HTML 태그 (요소노드) 를 문자열로 직접 작성해서 
            <body>< /body> 안에 한번에 추가 하는 방식 <- 현업 추천
            
            * 하지만 노드들을 세밀하게 조정할 수 없는 단점이 있다.
        */
       
        // 1. <body>< /body> 사이에 추가할 HTML 태그를 문자열로 작성
        const html = '<a href="http://www.gilbut.co.kr">길벗</a>';

        // 2. <body>< /body> 사이에 문자열 HTML 태그 추가
        document.body.innerHTML = html;
        // document.body.innerHTML = '<a href="http://www.gilbut.co.kr">길벗</a>';
    </script>
</body>
</html>
