<!DOCTYPE html> <!-- 최상위 요소 -->
<html lang="ko"> <!-- html 요소는 부모 요소 노드, lang="ko"는 속성 노드 -->
    <head> <!-- html 요소의 자식 요소 노드 -->
        <title>DOM Test</title> <!-- <title>요소 노드는 <head>요소 노드의 자식 요소 노드, DOM test는 텍스트 노드 -->
    </head>
    <body> <!-- html 요소의 자식 요소 노드, head 요소 노드의 형제 요소 노드 -->
        <h1 id="main">Hello</h1> <!-- <h1>은 요소 노드, id="main"은 속성 노드, Hello는 텍스트 노드 -->
    </body>
</html>
