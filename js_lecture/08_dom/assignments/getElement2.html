<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>

<body>
    <h1 id="title">title</h1> <!-- 요소, 요소 노드 객체 -->
    <p class="text">text-1</p>
    <p class="text">text-2</p>

    <script type="text/javascript">
        /*
            getElementsByTagName("p")
                메소드 호출시 요소노드명 "p", 즉 태그명 "p"를 매개변수로 전달하면
                p 와 일치하는 모든 p 요소들을 배열에 담아 선택해 옵니다.
                [ <p class="text">text-1</p>  ,  <p class="text">text-2</p> ]  <--- HTMLCollection 이라는 배열
                            0                               1                  <--- index
        */
        const tagEls = document.getElementsByTagName("p");
        console.log( tagEls );
        console.log( tagEls[0] ); // 출력: <p class="text">text-1< /p>
        
        /*
            getElementsByClassName("text")
                class 이름 속성에 부여한 값이 text와 일치하는 모든 요소들
                <p class="text">text-1</p>
                <p class="text">text-2</p> 을 배열에 담아 배열자체를 반환해 줍니다.
                [ <p class="text">text-1</p> , <p class="text">text-2</p> ]  <--- HTMLCollection 이라는 배열
                            0                            1                   <--- index
        */
        const classEls = document.getElementsByClassName("text");
        console.log( classEls );
        console.log( classEls[0] ); // 출력: <p class="text">text-1< /p>
        console.log( classEls[1] ); // 출력: <p class="text">text-2< /p>

        /*
            getElementById("title")
                id 속성에 부여한 값이 title과 일치하는 노드 요소를
                    하나만 선택해서 반환해 옵니다.
        */
        const idEl = document.getElementById("title");
        console.log( idEl ); // 출력: <h1 id="title">title< /h1>

        /*
            document객체에 만들어져 있는 메소드
            1. getElementById("요소노드의id속성에부여한값");
                -> 요소노드의부여한 id속성값을 매개변수로 전달하면
                전달한 id속성값과 일치하는 요소노드를 1개만 선택해 반환해 줍니다.

            2. getElementsByClassName("요소노드의class속성에부여한값");
                -> 요소노드의 부여한 class속성값을 매개변수로 전달하면
                전달한 class속성값과 일치하는 모든 요소들을 배열에 담아 배열을 선택해서
                반환해 줍니다.

            3. getElementsByTagName("요소노드명");
                -> 작성해 놓은 HTML요소노드명을 매개변수로 전달하면
                전달한 요소노드명과 일치하는 모든 요소노드들을 배열에 담아
                배열을 선택해서 반환해 줍니다.
 
        */
        // class속성값, id속성값, HTML태그명을 이용해 노드를 선택합니다.

    </script>

</body>

</html>
