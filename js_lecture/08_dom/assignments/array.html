<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>

<body>
    <!-- 주제 : Array객체의 from메소드의 사용법 -->
    <script>
        // 1. 유사배열객체
        //  - 유사배열객체는 length 속성을 가지며 index 번호로 요소에 접근할 수 있는 배열객체
        //    유사배열객체는 반복문 사용을 하지 못 한다.
        const arrayLike = { 0: 'a', 1: 'b', 2: 'c', length: 3};

        // 유사 배열 객체를 일반 배열로 변환
        const arr = Array.from( arrayLike );
        // arr = [ a, b, c ]
        //         0  1  2   index

        arr.forEach( function( charValue ) {
            console.log( charValue );
            document.write( charValue , "<br>");
        } );

        // 2. 반복가능한객체
        //  - 반복가능한객체는 Symbol.itarator 메소드를 가진 객체 입니다
        const set = new Set( [ 'a', 'b', 'c' ] ); // Set() 자체가 반복 가능한 객체, 하지만 추출할 수 없다.

        // 반복가능한 객체를 일반배열로 변환
        const arr2 = Array.from( set );

        console.log( arr2 );

        // 결론
        // Array객체의 from메소드를 사용하면 NodeList유사배열을 실제일반배열로 변환하여
        // 일반 배열의 메서드를 사용할수 있습니다.
        // 이를 통해 중간에 노드를 삭제하더라도 안전하게 순회할수 있습니다.
    </script>
    
</body>

</html>
