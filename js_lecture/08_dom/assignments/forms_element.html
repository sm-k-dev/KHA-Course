<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>

<body>
    <form name="frm1">
        <label for="uname">이름</label>
        <input type="text" id="uname" name="uname" value="김길동">

        <label for="age">나이</label>
        <input type="text" id="age" name="age" value="">

        <select id="gender" name="gender">
            <option value="male">male</option>
            <option value="female">female</option>
        </select>

        <button type="submit">전송</button>
    </form>

    <script type="text/javascript">
        /*
            1. document.frm1
                -> document객체의 하위 <form>태그들 중에서 name속성값이 frm1인
                    <form>......< /form>선택해 옴
            
            2. document.frm1.elements
                -> <form>.....< /form>내부에 작성된 하위 입력할수 있는 태그들을
                    모두 HTMLFormControlsCollection배열에 담아 배열자체를 반환해줍니다.
            
        */
        const HCC = document.frm1.elements;

        console.log( JSON.stringify(HCC) );

        // 0 index 위치에 저장된 자식 아래의 요소노드를 선택해 옵니다.
        // <input type="text" id="uname" name="uname" value="김길동">
        const input1 = HCC[0];
        console.log( input1 );

        // 위 선택한 <form>...< /form>태그 안에 작성된 하위 태그들중에서
        // [    ]대괄호 안에 적은 name속성값이 uname인
        // <input type="text" id="uname" name="uname" value="김길동"> 자식 요소를 선택해 옵니다.
        const input2 = HCC['uname'];
        console.log( input2 );

        // ==================================================================================

        /*
            1. document.frm1
            -> <form name="frm1">< /form> 태그를 선택해 오는데
                name속성값이 frm1인 <form>한쌍을 선택합니다.
        
            2. document.frm1.uname;
            -> document.frm1으로 인해서 선택한 <form>< /form> 내부에 작식 입력태그들 중에서
                name속성값이 uname인 <input type="text" id="uname" name="uname" value="김길동">
                자식 입력 태그를 최종 선택
        */
        const input3 = document.frm1.uname;
        console.log( input3 );

        // name속성값이 frm1인 <form>< /form>을 먼저 선택하고
        // 그안에 작성되어 있는 하위 태그를 선택해 오는데
        // name속성값이 age인 <input type="text" id="age" name="age">을 최종 선택해 와서 input2상수에 저장
        const input4 = document.frm1.age;
        console.log( input4 );

        /*
            1. document.forms
                document.forms속성을 호출하면 작성되어 있는 <form>< /form>태그를 배열에 담아 선택해오는데
                [ <form> ... ... ... < /form> ]
                            0                   index

            2. document.forms[0]
                <form>< /form>태그는 0 index위치에 배열에 저장되어 있으므로 
                document.forms[0] 를 이용해서 정확히 선택해 옵니다.

            3. document.forms[0].gender;
                정확히 선택해온 <form>< /form> 사이에 작성된 하위 태그들 중에서 
                name속성값이 gender인 자식요소 자식 <select id="gender" name="gender">...< /select>한쌍을 최종 선택 해 온다.
        */
        const selectElement = document.forms[0].gender;
        /*
            <select id="gender" name="gender">
                <option value="male">male< /option>
                <option value="female">female< /option>
            < /select> 요소를 최종 선택해 옵니다.
        */
        
        // select요소를 선택해서 가져옴
        // 선택된 option요소의 value속성의 값 가져오기
        const selectedValue = selectElement.value;
        console.log(selectedValue);
    </script>

</body>

</html>
