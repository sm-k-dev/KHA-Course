<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>

<body>
    <a href="http://www.naver.com">네이버</a>
    <br>
    <h1 id="hi">안녕</h1>
    <br>
    <p class="p1" id="p2">안녕하세요 반갑습니다</p>
    <br>
    <h2 class="red-color" id="h">안녕2</h2>
    <script>
        /*
            주제1. 선택한 요소노드의 속성 삭제
        */
        // 순서1. <h2 class="red-color" id="h">안녕2< /h2> 요소노드 선택
        const h2 = document.querySelector(".red-color"); // 클래스는 . 아이디는 #
        // 순서2. id="h" 삭제
        // 결과 -> <h2 class="red-color">안녕2< /h2>
        h2.removeAttribute("id");

        /*
            주제2. 속성명 = "값" 중에서 "값"을 변경
        */
        // 순서1. <p class="p1" id="p2">안녕하세요 반갑습니다< /p> 요소노드 선택
        const p = document.getElementsByTagName("p")[0];

        // 순서2. <p class="p1" id="p2">안녕하세요 반갑습니다< /p> 중에서
        // id속성값 p2를 p1으로 변경 하면 아래와 같습니다.
        // 결과 -> <p class="p1" id="p1">안녕하세요 반갑습니다< /p>
        p.setAttribute("id", "p1");

        /*
            주제3. 속성 = "값" 중에서 "값" 얻기
        */
        // 순서1. <h1 id="hi">안녕< /h1> 요소노드를 선택해서 가져와
        const h1 = document.querySelector("#hi");

        // 순서2. getAttribute메소드를 호출시 값이 저장된 속성명인 id속성명을 매개변수로 전달하면
        // id속성의 값 "hi"을 반환해 준다.
        console.log(h1.getAttribute("id"));

        // 순서1. <a href="http://www.naver.com">네이버< /a> 요소노드를 선택해서 가져와
        // aEl 상수에 저장
        const aEl = document.querySelector("a");

        // 순서2. 그리고 "네이버" -> "구글"로 변경
        aEl.textContent = "구글";
        // aEl.innerText = "구글";

        // 그리고 href속성에 대한 주소값 "http://www.naver.com"을 얻어
        // href 상수에 저장
        const href = aEl.getAttribute("href");

        // href상수메모리에 저장된 주소값 출력
        console.log(href);

        // href 속성의 "http://www.naver.com" 을 "http://www.google.com"으로 변경
        aEl.setAttribute("href", "https://google.com")
    </script>

</body>

</html>
