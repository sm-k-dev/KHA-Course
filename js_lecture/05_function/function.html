<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            함수 선언 방법 2

                1. 함수 선언문
                
                    function 함수명 (매개변수1, 매개변수2) {
                        실행할 코드;

                        return 반환값;
                    }
                
                2. 함수 호출
                    
                    함수명(인수1, 인수2);
                
                3. 이 실습의 핵심
                    - 함수 선언은 실행할 코드를 준비하는 단계이다.
                    - 함수 호출은 준비된 코드를 실행하는 단계이다.
                    - 매개변수는 함수가 갑(인수)를 받기 위해서 선언한 변수이다.
                    - 인수는 함수를 호출할 때 전달하는 실제 값이다.
                    - return은 함수 코드 실행 결과를 함수를 호출한 줄의 자리로 반환하는 예약어이다.
        */
        
        // 문제1. 두 수를 더해서 반환하는 add 함수 선언
        function add ( a, b ) {
            return a + b;
        }

        // add 함수 호출
        // 3은 a에 저장되고, 5는 b에 저장된다
        // 반환값 8이 console.log()에 전달되어 출력된다.
        document.write( add(3, 5), "<br>" );

        document.write("====================================<br>");

        // 문제2. 매개변수로 두개의 인수를 전달받아 두 값 중에서 큰 값 하나를 반환하는 max 함수 정의

        function max ( a, b ) {
            return (document.write("max( " , a , ", " , b , " ) = " , ( a > b ? a : b ), "<br>"));
        }

        max( 7, 10 );

        document.write("====================================<br>");

        // 문제3. 매개변수로 한개의 숫자를 전달 받아 양수이면 true 반환, 음수이면 false를 반환하는 기능의
        // isPositive 함수 정의

        function isPositive ( a ) {
            return (document.write( a , " = ", ( a >= 0 ), "<br>"));
        }

        isPositive(5);
        document.write("<br>");
        isPositive(-2);
        document.write("====================================<br>");

        // 문제4. 매개변수로 한개의 숫자를 전달받아 전달받은 숫자가 짝수이면 true, 홀수이면 flase 반환. isEven
        function isEven ( a ) {
            return (document.write( a , " = ", ( a % 2 === 0 ), "<br>"));
        }

        isEven(4);
        document.write("<br>");
        isEven(7);
        document.write("====================================<br>");

        // 문제5. 숫자 1부터 매개변수 n으로 전달받은 인수 하나의 합을 구하는 기능의 sumUpTo 함수 정의
        function sumUpTo ( n ) {
            var sum = 0;
            var formula = "";
            for ( let i = 1 ; i <= n ; i++) {
                sum += i;

                formula += i !== 5 ? i + " + " : i;
                // if ( i === 5 ) {
                //     formula += i;
                // } else {
                //     formula += i + " + ";
                // }
                
            }
            return document.write(formula + " = " + sum);
        }

        sumUpTo(5);

    </script>
</body>
</html>
