<!DOCTYPE html>

    <script type="text/javascript">
        //구구단 3단을 출력하는 코드를 수동으로 작성하면 불편합니다

        //for반복문을 이용하면 간단하게 코드를 줄일수 있습니다.

        //구구단 3단 코드를 함수 안에 만들어 놓고  함수를 호출해서 사용하면  매번 for문을 작성하지 않아도 된다
        //즉! 재호출 가능하니 유지보수도 편리하다.

        //gugudan함수의 기능을 코드로 작성할 영역

        function gugudan ( n ) {
            document.write("<h1>", n, " 단</h1><br>");
            for ( let i = 1 ; i <= 9 ; i++ ) {
                document.write(n , " X ", i, " = ", n*i, "<br>");
            }
        }

        //함수 호출 구문
        gugudan(3);

        document.write("=====================================<br>");

        gugudan(7);

    </script>
