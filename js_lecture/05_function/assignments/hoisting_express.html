<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>

<body>
    <script type="text/javascript">
        //함수를 만드는 방법 3가지중!!!
        
        /* 
            함수 선언문 (function) 으로 함수를 만들경우, 
                호출문을 먼저 적고 함수를 작성해도 오류가 생기지 않는다.

                function 함수명 ( 매개변수1, 매개변수2 ) {
                    실행할 코드;
                    return 반환값;
                }

                함수명 ( 인수1, 인수2 ); <- 함수 호출 구문


            함수 표현식 (const) 으로 함수를 만들경우, 
                호출문을 먼저 적고 함수를 작성하면 오류가 생긴다
            
                const 상수명 = function( 매개변수1, 매개변수2 ) {
                    실행할 코드;
                    return 반환값;
                };
                
                상수명( 인수1, 인수2 ); <- 함수 호출 구문

            
            화살표 => 함수 정의 및 매개변수 처리

                const 상수명 = ( 매개변수1, 매개변수2 ) {
                    실행할 코드;
                    return 반환값;
                };
                
                상수명( 인수1, 인수2 ); <- 함수 호출 구문

        */

        printHello1();
        printHello2();

        //방법2. 표현식 방식으로 만들기
        //     const 변수명 = fuction(){};
        //     const 변수명 = function 함수명(){};
        const printHello1 = function () { document.write("hello1 <br>")};
        const printHello2 = function printHello3() {document.write("hello2 <br>")};

        //2. 함수 표현식 방식으로 함수 만들기
        // -> 호이스팅이 안되어 실제 실행 결과를 보면
        //    'printHello()는 함수가아니다'라는 오류메세지가 나옵니다.

        //함수 호출해보자
        printHello1();
        printHello2();

        // TODO 1: 문제 설명과 주석을 읽고 필요한 변수/함수/이벤트를 작성하세요.
        // TODO 2: 화면 또는 콘솔 결과가 원본 실습 목표와 같아지는지 확인하세요.
        // TODO 3: 완성 후 브라우저 콘솔 오류가 없는지 확인하세요.
    </script>

</body>

</html>
