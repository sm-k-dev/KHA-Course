    <script type="text/javascript">
        /*
                    함수를 정의 하는 방법(만드는 방법) 중에서  2번째 방법   함수표현식 이용방법
        
                    함수 정의   문법
                         const 상수명 = function 함수명(){
        
                            함수의 기능을 코드로 작성;
        
                         };
        
                    함수 호출해서 사용하는 문법
        
                        상수명();
                */
        //실습1.  함수표현식 작성 방법으로 구구단 3단을 반복해서 출력하는 기능의  함수 정의

        const gugudan2 = function gugudan1 ( n = 3 ) {
            document.write("<h1>구구단 ", n, "단</h1><br>");
            for ( let i = 1 ; i <= 9 ; i++ ) {
                document.write( n , " X ", i , " = ", n * i, "<br>");
            }
        }

        //실습2. 위 정의 해 놓은 naming함수 호출
        //  상수명();
        gugudan2();
        document.write("===============================<br>");

        // 4단의 기능을 출력하기 위해 gugudan2상수메모리에 저장된 익명함수 호출
        //상수명();

        const gugudan3 = function ( n = 3 ) {
            document.write("<h1>구구단 ", n, "단</h1><br>");
            for ( let i = 1 ; i <= 9 ; i++ ) {
                document.write( n , " X ", i , " = ", n * i, "<br>");
            }
        }
        gugudan3(4);
        document.write("===============================<br>");

        /*
                 함수 표현식으로 함수를 정의할때는 const키워드를 주로 사용합니다.

               const키워드로 정의하는 것이 좋습니다.
