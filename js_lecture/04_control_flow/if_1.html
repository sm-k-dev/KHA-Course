<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            예제: 사이트 방문자에게 입력받은 걸음수를 조건문 if로 만들고
                    입력받은 하루 걸음수가 10,000보 이상일 경우만 실행문 출력
            
            if 조건문
                if (조건식) {
                    조건식이 참일 때 실행 할 실행문;
                } else {
                    조건식이 거짓일 때 실행 할 실행문;
                }
        */
        // 순서1. 웹사이트 방문자에게 하루 걷는 걸음수를 입력받아 walkAmount 변수 메모리에 저장
        let walkAmount = prompt("당신의 하루 걸음수를 입력하시오", "0");
        // 만약 웹사이트 이용자가 10000을 입력하고 확인 버튼을 누르는 순간 prompt 함수가 10000을 되돌려줘서
        // let walkAmount 변수에 대입해서 저장

        // 순서2. 하루 걷는 걸음수가 10000보 이상이냐? 묻는 조건 식을 if 조건문으로 작성
        if (walkAmount > 10000) {
            document.write("매우 좋은 습관을 지니고 계시는군요!");
        }

        // 결론:
        // 화면에 입력한 값이 10,000 보 이상일 경우에는 조건식의 결과가 true를 반환하여 실행문 코드를 실행해서 보여주지만,
        // 화면에 입력한 값이 10,000 보 미만일 경우에는 조건식의 결과가 false를 반환하여 실행문 코드를 실행하지 않아 보여주지 않는다.
    </script>
</body>
</html>
