<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            문제 4: 간단한 계산기

            사용자에게 두 숫자와 연산자 (+, -, *, /) 기호 중 하나를 입력 받아 연산결과를 출력하는 프로그램을 작성하세요.
        */
        // 사용자에게 첫 번째 숫자를 입력 받아 변수 num1에 저장
        // parseFloat 는 실수로 변경 (소숫점 있는 값)
        let num1 = parseFloat( prompt("첫 번째 숫자를 입력하세요", "1"), 10 );
        console.log(`num1 = ${num1}`, `${typeof num1}`);

        // 사용자에게 연산자 기호 (+, -, *, /)를 입력 받아 변수 operator에 저장
        let operator = prompt("연잔자 기호 중 하나를 입력하세요 (+, -, *, / 중 하나)", "+");
        console.log(`operator = ${operator}`, `${typeof operator}`);

        // 사용자에게 두 번째 숫자를 입력 받아 변수 num2에 저장
        let num2 = parseFloat( prompt("두 번째 숫자를 입력하세요", "1"), 10);
        console.log(`num2 = ${num2}`, `${typeof num2}`);

        // 연산 결과를 저장할 변수 result 선언
        let result;

        /*
            switch 선택문을 사용하여 operator의 값에 따라 num1과 num2의 연산 결과를 result 변수에 저장하세요
            덧셈 +, 뺄셈 -, 곱셈 *, 나눗셈 / 을 처리하고,
            나눗셈의 경우 num2가 0일 때는 오류 메세지를 출력
        */
        
        switch ( operator ) {

            // operator 변수의 값이 "+" 와 같을 경우
            case "+": 
                    result = num1 + num2;
                break;
            
            case "-":
                    result = num1 - num2;
                break;
            
            case "*":
                    result = num1 * num2;
                break;
            
            case "/":

                    /*
                        if else 조건문 사용 > num2가 0이 아닐 경우와 0일 경우를 각각 나눠
                                            0이 아닐 경우에는 num1을 num2로 나눈 값을 result에 저장
                                            num2가 0일 경우 "0으로 나눌 수 없습니다." 오류 메세지를 result에 저장
                    */
                    if ( num2 == 0 ) {
                        alert("두번째 숫자가 0 이라 나눌 수 없습니다.");
                    } else {
                        result = num1 / num2;
                    }
                break;
            
            default:
                    alert("잘못된 연산자 기호를 입력하셨습니다.");
                break;
        }

        document.write( num1, operator, num2, " = ", result );
    </script>
</body>
</html>
