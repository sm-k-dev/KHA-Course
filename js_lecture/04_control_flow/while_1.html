<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            let 변수 = 초깃값; // 1. 변수에 조건을 판단하는 조건 초깃값 저장

            while (조건식) {    // 2. 그 다음 while 문을 작성해 사용
                실행문;

                증감식;
            }
        */
        
        // while문의 조건식을 검사할 조건변수 선언 후 초기값 저장
        let i = 1;
        
        // i 변수에 저장된 값이 10보다 작거나 같을 동안만 ~~~ 계속 반복해서 실행문 실행
        while ( i <= 10 ) {
            // 위 조건식 i <= 10 의 결과가 true일 동안만 반복해서 실행될 실행문과 증감식

            // 실행문: 조건식의 결과가 참(true) 일때만 반복실행될 문장
            document.write("안녕하세요 " + i + "<br>");

            // 증감식: i 변수에 저장된 값을 1씩 반복해서 증가해서 저장
            i++;
        }
        /*
            while문의 조건식 i<=10을 검사한 후 만족(true)하면 
            중괄호 {...}에 있는 실행문을 실행하고,
            증가 연산자로 변수i의 값이 1증가 됩니다.
            다시 조건식 만족 여부를 검사한후, 만족(true)하면 다시 중괄호에 실행문을 실행하고,
            거짓(false)이면 while문을 종료 합니다. 
        */
    </script>
</body>
</html>
