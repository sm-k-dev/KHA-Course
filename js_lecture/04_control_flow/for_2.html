<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            문제: for 반복문을 작성하여 20번 반복해서 "안녕"을 출력
        */

        for ( let i = 1 ; i <= 20 ; i++ ) {
            document.write("안녕 " + i + "<br>");
        }
    </script>
</body>
</html>
