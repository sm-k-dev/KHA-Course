<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            switch (비교할 값) {
                case 비교할 값과 같은지 판단 값1 :
                    비교할 값과 판단 값 1 이 같으면 실행할 실행문 코드;
                    break;
                
                case 비교할 값과 같은지 판단 값2:
                    비교할 값과 판단 값 2 가 같으면 실행할 실행문 코드;
                    break;
                
                ...

                default :
                    위에 작성된 모든 case 유형의 판단 값1, 값2 ... 가 비교할 값과 같지 않으면 실행할 실행문 코드;
                    break;
            }
        */

        switch ( 10 ) {
            case 1 : // 10과 1이 같으냐 라고 물어보는 조건
                document.write("10과 1은 같다.");
                break;
            
            case 2 : // 10과 2가 같으냐 라고 물어보는 조건
                document.write("10과 2는 같다.");
                break;
            
            case 3, 4, 5 : // 10이 3 혹은 4 혹은 5와 같으냐 라고 물어보는 조건
                document.write("10이 3 또는 4 또는 5와 같다.");
                break;
            
            case 10 : // 10과 10이 같으냐 라고 물어보는 조건
                document.write("10과 10은 같다.");
                break;
            
            default : // 비교할 식이 위에 작성한 모든 case 유형의 판단 값 들과 다를 경우
                document.write("다르다");
                break;
        }

        document.write("----------------------------------------------<br>");

        /*
            주제: 사이트 이용자에게 즐겨 이용하는 사이트 명을 입력받아
                입력받은 사이트를 자동으로 재요청해서 웹브라우저 화면에 보여주는 예.
        */
        
        // 순서1. prompt 함수를 작성해서 즐겨 이용하는 사이트 명을 입력받아 site라는 변수 메모리에 저장
        let site = prompt("'네이버, 다음, 네이트, 구글' 중 즐겨 이용하는 사이트 명을 써주세요", "네이버");

        // 순서2. 입력받은 사이트명에 따라 실제 http 요청할 URL 주소를 저장할 변수 선언
        let url;

        // 순서3. switch 선택문을 이용하여 입력받은 사이트 명에 따라
        //          각 사이트 주소를 각각 url 변수에 저장시키자
        switch ( site ) { // 사용자로 부터 입력 받은 사이트 명이

            case "네이버" : // site 변수에 저장된 입력한 사이트명이 "네이버" 문자열과 같으냐
                    url = "www.naver.com"; // url 변수에 네이버 사이트 주소 저장
                break; // switch 문의 {} 중에서 닫는 기호 (}) 영역을 벗어나는 예약어
            
            case "다음" :
                    url = "www.daum.net";
                break;
            
            case "네이트" :
                    url = "www.nate.com";
                break;
            
            case "구글" :
                    url = "www.google.com";
                break;
            
            default : // "네이버", "다음", "네이트", "구글" 이외 다른 사이트 명을 사용자가 입력했다면
                    // 알림 메세지창 띄우기 alert("알림 메세지");   
                    alert("보기에 없는 사이트입니다.");
                break;
        } // switch 문 중괄호 닫기

        // 순서4. 조건문 if를 활용하여 변수 url에 주소가 저장되어 있다면? 이라는 조건식 작성

        if (url) { // url !== null 과 같다. false === false, 0 === false, "" === false, null === false, undefiend === false, NaN === false
            // 자바스크립트 문법
            // location 객체: 웹브라우저 주소창에 작성한 주소정보를 제공하는 객체
            // location 객체 메모리 내부에 href변수(속성)에 재요청할 주소를 저장시키면
            // 이 코드를 실행했을때 웹브라우저 주소창에 자동으로 재요청할 주소가 적히면서 엔터를 누른 효과를 주어 재요청하게 된다.
            // location.href = "재요청할 URL";
            location.href = "https://" + url;
        }
    </script>
</body>
</html>
