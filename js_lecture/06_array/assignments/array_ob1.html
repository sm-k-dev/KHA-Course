<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>

<body>
    <script type="text/javascript">
        /*
            변수 메모리
                - 하나의 데이터를 저장할 메모리 공간
                예) let 변수명;
                    | undefined |

                    변수명      = 데이터;
                    | 데이터 |

                    변수명      = 데이터2;
                    | 데이터2 |

                - 결론: 하나의 데이터만 저장할 하나의 메모리 공간

            배열 객체 메모리(Array)
            - 하나의 메모리에 칸을 나누어서 하나 이상의 데이터를 저장할 전체 메모리공간
            - [1,  2,  3,  4];  <--- 하나의 배열 메모리(Array) 공간

            이때  각 칸에 저장된 1  또는 2 또는 3또는 4 등의 데이터를 요소라고 부른다

            - 배열 메모리는 각 칸의 데이터에 접근하거나  저장된 데이터를 불러오거나
                각 칸에 저장된 값을 변경하기 위해  각 칸  위치에 번호가 0 부터 ~ 1씩 증가하면서
                붙게 되는데.. 이번호를 index라고 부릅니다.
                [ 1 ,  2,  3,  4 ]; <- 하나의 배열 메모리 전체 공간
                  0    1   2   3   <- index

            - 배열 메모리의 각 칸에 저장된 데이터(요소)는 index를 사용하여 각요소에 접근하며
                배열 메모리에 어떤 데이터유형(문자열, 숫자, 객체, 다른배열)이든 추가 저장, 삭제할 수 있습니다.

            - 자바스크립트 배열메모리는 동적배열로 , 크기가 (칸의 갯수가)자동으로 조절됨

            - 자바스크립트 배열메모리(Array)다양한 내장메소드(함수)와 속성(변수)등을 제공함
                예)  length 속성,  push()메소드, shift()메소드, unshift()메소드 등.......

            --------------------------------------------------------------------------------
            배열 메모리 생성 방법 2가지

                방법1.  리터털 표기법  [  ] 대괄호 이용

                    let  배열_메모리의_주소번지가 저장될 참조변수 = ["저장할값1", 저장할값2, 저장할값3];
                            | 0x16 |                               0          1         2      index

                            예)   let colors = ["Red", "Green",  "Blue"];
                                                  0       1        2      index

                방법2.  Array 생성함수(생성자)를 이용

                    let  배열_메모리의_주소번지가 저장될 참조변수 = new Array("저장할값1", "저장할값2");
                            | 0x17 |                                        0           1       index

                        예)   let colors  = new Array("Red", "Green","Blue");
                                                        0      1       2     index

                    단점 : 과도한 new키워를 사용해야 하므로, 코드가 다소 장황해 질수 있습니다. 혼동 가능성 있음
                        예) 만약 하나의 숫자인자를 전달하면, 해당 숫자를 길이로 가지는
                            비어있는 칸의 배열이 생성됩니다.
                            예를 들어 new Array(3) 은 길이가 3인 비어 있는 배열을 생성하게됨

            배열 생성 방법 요약

                1. 리터럴 표기법 [] 은 배열을 더 쉽고 빠르게 만들수 있는 방법.
                    코드가 간결하고 가독성이 띄어납니다. <- 현업에서 사용
                
                2. Array 생성자는 보다 명시적인 배열생성방법이지만,
                    사용시 주의가 필요하며 코드가 다소 복잡해 질수 있습니다.

                결론 : 일반적으로 리터럴 표기법 [] 으로 배열 메모리를 생성해서 사용하는 것을 더 권장합니다.

            ----------------------------------------------------------------------------------

            생성된 배열 메모리의 각 index 위치 번호의 칸에 저장된 요소(값, 데이터)을 불러와 사용하는 방법

                방법. 배열_메모리의_주소가 저장된 변수명[index];

                    예.  let colors = ["Red", "Green", "Blue"];
                                0        1       2    index

                        colors[0];  //"Red"

                        colors[1];  //"Green"

                        colors[3];  // 이경우는 생성한 배열 메모리에 존재하지 안는
                                    // 배열의 index위치에 접근하므로 배열을 참조하는 범위 벗어남
            
            변수 -  하나의 값을 저장할 한칸의 메모리 공간  - 단독주택 메모리
            배열 -  하나의 이상의 값을 저장할 메모리 공간  - 한동 짜리 빌라 메모리
        */

        /*
            배열 메모리 생성 (리터럴표기법 사용)
                참조변수명은  arr
                배열 메모리의 각 index 칸에 순서대로 저장할 값들
                -> 10, 20, 30
                    0   1   2     index
        */
        let arr = [ 10, 20, 30 ];

        //10을 꺼내와 출력
        document.write("arr[0]: ", arr[0], "<br>");
        //20을 꺼내와 출력
        document.write("arr[1]: ", arr[1], "<br>");
        //30을 꺼내와 출력
        document.write("arr[2]: ", arr[2], "<br>");

        document.write("======================================<br>");

        //const arr = [ 10, 20, 30 ];
        //			     0   1   2     index
        //				 i < 3;
        //i->0일때 index 0칸에서 10을 꺼내와 출력
        //i->1일때 index 1칸에서 20을 꺼내와 출력
        //i->2일때 index 2칸에서 30을 꺼내와 출력
        //i->3일떄 조건식 i < 3에서  3 < 3라고 물었기떄문에 거짓 false 이므로 for반복종료
        for ( let i = 0 ; i < arr.length ; i++ ) {
            document.write("arr[", i, "]: ", arr[i], "<br>");
        }
        document.write("======================================<br>");

        /*
            배열에 저장된 원본 데이터를 변경하는 메소드들을 파괴적 메소드들이라 부른다

                배열객체에서 제공하는 push()메소드
                    - 배열메모리의 가장뒤에 새로운 데이터를 추가시킬때 사용하는 메소드
                    - 배열명.push(새 데이터);

                배열객체에서 제공하는 pop()메소드
                    - 배열메모리의 가장뒤에 저장된 데이터만 추출(가져옴, 잘라냄)하는 메소드
                    - 배열명.pop();

                배열객체에서 제공하는 unshift()메소드
                    - 배열메모리의 가장앞에 새로운 데이터를 동적으로 추가 시켜 한칸을 늘리는 기능의 메소드
                    - 배열명.unshift(새 데이터);

                배열객체에서 제공하는 shift()메소드
                    - 배열메모리의 가장앞에 저장된 데이터만 추출(가져옴, 잘라냄)하는 메소드
                    - 배열명.shift();
        */

        //           0   1   2   3     index
        let arr2 = [ 10, 20, 30, 40 ];

        // arr2 배열메모리 가장 뒷편에 50추가
        //  0    1    2    3    4    index
        arr2.push(50);

        for ( let i = 0 ; i < arr2.length ; i++ ) {
            document.write("arr2[", i, "]: ", arr2[i], "<br>");
        }
        document.write("======================================<br>");

        //arr2 배열메모리 가장 뒷편에 저장된 데이터 50을 추출
        document.write("arr2.pop(): ", arr2.pop(), "<br>");
        document.write("<br>");

        for ( let i = 0 ; i < arr2.length ; i++ ) {
            document.write("arr2[", i, "]: ", arr2[i], "<br>");
        }
        document.write("======================================<br>");

        // arr2 배열에 저장된 모습 ->  [10,  20,  30,  40]
        //						      0    1    2    3   index

        // arr2 배열 메모리의 가장 앞칸 0 위치에 저장된 10을 추출(반환)!
        document.write("arr2.shift(): ", arr2.shift(), "<br>");
        document.write("<br>");

        for ( let i = 0 ; i < arr2.length ; i++ ) {
            document.write("arr2[", i, "]: ", arr2[i], "<br>");
        }
        document.write("======================================<br>");

        /*
            -----------------------------------------------------------------------

            배열 객체 메모리가 제공하는 forEach()메소드
                - 배열 메모리에 저장된 전체 요소의 갯수만큼 반복하는데
                배열 메모리에 저장된 요소(데이터)를 하나씩 순회하면서 요소마다 콜백함수function을 호출하여 사용하는 메소드

            문법
                const 배열명 = [ 데이터1, 데이터2, 데이터3 ];

                배열명.forEach( function( 현재 처리중인 배열 요소를 받을 매개변수(필수),
                                         현재 처리중인 요소의 index를 받을 매개변수,
                                         foreach 메소드를 호출한 배열 메모리 주소 자체를 받을 매개변수 )
                    {
                        반복 실행할 코드 작성 할 영역
                    }, this.속성명);

                this.속성명 자리에는 콜백함수 function 내부에서 this로 사용할 값 (선택)

            -----------------------------------------------------------------------------------
            간단한 문법
                배열명.forEach( function( 매개변수 ){ 반복시 구현할 코드 작성 }, this.속성명 );
        */

        let arr3 = [ 10, 20, 30, 40 ];
        //           0   1   2   4    index

        // function 콜백함수의 매개변수 value로 전달 받는값
        // arr3배열 메모리에 저장된 0 index 위치 칸에 저장된 10부터 3 index위치 칸에 저장된 40까지의 값을 차례대로 반복해서 얻어 출력
        arr3.forEach( function(value, value2, value3) {
            document.write("arr3.forEcah의 value: ", value, ", index ", value2, " 번째, arr3[] = ", value3, "<br>");
        });
        document.write("======================================<br>");

        // 배열 복사
        // numbers배열에 저장된 요소의 갯수만큼 function(num){} 이 자동으로 호출되어
        // num매개변수로 받은 1, 2, 3 을 각각 차례대로 copy빈 배열에 추가해서 저장 시키자
        let copy = [];
        arr3.forEach( function(value){
            copy.push(value);
        })

        document.write("copy[0]: ", copy[0], ", copy[1]: ", copy[1], ", copy[2]: ", copy[2], ", copy[3]: ", copy[3], ", copy[4]: ", copy[4], "<br>");
        document.write("======================================<br>");

        // 매개변수 2개를 사용 한경우
        const fruits = [ "apple", "banana", "cherry" ];
        //                  0        1         2        index
        fruits.forEach( function( item, index ) {
            console.log(`${index} index 위치 칸에 저장된 데이터: ${item}`);
        });

        // this 사용

        // 참고. this? {} 중괄호로 생성된 객체 메모리 주소번지를 기억하고 있는 예약어
        const obj = {
              multiplier: 2
            , multiply: function(array){ // array 매개변수로 [ 1, 2, 3 ] 배열 주소를 받는다.
                array.forEach( function( value1, value2, value3 ){
                    console.log( value1 * this.multiplier );
                }, this )
              }
        };
        // obj 객체 메모리 안에 만들어져 있는 multiply 메소드 호출할때 인수 자리에 array 매개변수가 받을 [ 1, 2, 3 ] 배열 생성 후 전달하면서 호출.
        obj.multiply( [1, 2, 3] );

        // TODO 1: 문제 설명과 주석을 읽고 필요한 변수/함수/이벤트를 작성하세요.
        // TODO 2: 화면 또는 콘솔 결과가 원본 실습 목표와 같아지는지 확인하세요.
        // TODO 3: 완성 후 브라우저 콘솔 오류가 없는지 확인하세요.
    </script>

</body>

</html>
