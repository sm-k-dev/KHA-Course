<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*
            주제: <button>< /button> 에 두 가지 이벤트 등록 방식으로 click 이벤트와 mouseover 이벤트를 등록시켜
                사용자가 이벤트를 했을때 배경색이 바뀌도록 하는 예제
            
            이벤트 등록 방식 1. 요소에 직접 이벤트를 등록하는 방식
                문법) <태그명 on이벤트종류명="이벤트처리함수호출;"></태그명>
            
            이벤트 등록 방식 2. DOM을 이용한 이벤트 등록하는 방식
                문법) 요소노드선택.on이벤트종류명 = "이벤트처리함수작성";
            
            이벤트 등록 방식 3. addEventListener 메소드를 이용하여 선택한 요소에 이벤트 종류 하나 이상 등록
                문법) 요소선택.addEventListener( "등록할이벤트종류1 등록할이벤트종류2 ...", 이벤트핸들러함수, 옵션작성 );

                작성문법 참고. 옵션작성 자리에 작성할 코드 종류
                    { once : true } => 선택한 요소에 이벤트종류 등록하면 이벤트핸들러 함수가 여러번의 이벤트가 발생해도
                                        이벤트 처리를 단 한번만 수행함
                    
                    { capture : true } => 이벤트 캡처링 단계에서 이벤트처리 실행하는 값

                    { capture : false } => 옵션작성 자리에 작성을 생략하면 적용되는 기본값 false 이다. 이벤트 버블링 단계에서 이벤트처리 실행하는 값
        */

        /*
            이벤트 등록 방식 1
        */
        // 1. <body>< /body> 배경색상 설정할 문자열들을 배열을 생성해서 보관
        let color = [ "white", "yellow", "aqua", "green" ];
        //              0          1        2       3           index

        // 2. 위 color 배열의 index 위치 번호가 저장될 변수
        let i = 0;

        // 3. 위 color 배열에 배경색상 문자열을 이용해 아래에 작성된 <button>< /button>을 클릭할때마다 호출되어
        //      <body>< /body> 영역의 배경색상을 변경하는 기능의 함수
        function colorBg(){
            if ( i >= 3) {
                i = 0;
            } else {
                i++; // 0 => 1
            }
            
            
            // <body>< /body> 요소 한쌍 선택해서 변수에 저장
            let bodyTag = document.getElementsByTagName("body")[0];

            // 선택해 온 <body>< /body> 요소 영역의 배경색을 color 배열에 각 칸에 저장된 i 변수번째 index 위치 값으로 설정
            bodyTag.style.backgroundColor = color[i];
        }

        /*
            이벤트 등록 방식 2
        */
        // 1. window 객체 (웹브라우저창)에 load 이벤트 등록
        window.onload = function() {
            // 2. <button id="btn2">버튼2< /button> 요소를 선택해서 변수에 저장
            let btn2 = document.querySelector("#btn2");

            // 3. <button id="btn2">버튼2< /button>요소에 click 이벤트 등록 후 처리 구문 작성
            // btn2.onclick = function() {
            //     colorBg();
            // }
            btn2.onclick = colorBg;

            let btn4 = document.querySelectorAll("button")[3];
            btn4.onmouseout = colorBg;
        }
    </script>
</head>
<body>
    <p>
        <!--
            이벤트 등록 방식 1. 요소에 직접 on이벤트종류명 을 작성해서 이벤트 등록

            => 버튼1 을 한번 클릭하면 colorBg(); 함수를 호출되게 하여 이벤트 처리
        -->
        <button onclick="colorBg();">버튼1</button>
    </p>
    <p>
        <!--
            이벤트 등록 방식 2. 자바스크립트 코드로 등록할 요소를 선택 후 on이벤트종류명 을 작성해 이벤트 등록

            => 버튼2 를 한번 클릭하면 colorBg(); 함수를 호출되게 하여 이벤트 처리
        -->
        <button id="btn2">버튼2</button>
    </p>
    <p>
        <!-- 
            이벤트 등록 방식 1. 요소에 직접 on이벤트종류명 을 작성해서 이벤트 등록
            => 버튼3에 마우스 포인터를 올리는 동작 (mouseover 이벤트)을 했을때 colorBg() 함수 호출
        -->
        <button onmouseover="colorBg();">버튼3</button>
    </p>
    <p>
        <!--
            이벤트 등록 방식 2. 자바스크립트 코드로 등록할 요소를 선택 후 on이벤트종류명 을 작성해 이벤트 등록

            => 버튼4에 마우스 포인터가 올라가 있다가 마우스 포인터가 벗어나는 동작(mouseout 이벤트)을 했을때
                colorBg() 함수 호출
        -->
        <button id="btn4">버튼4</button>
    </p>
</body>
</html>
