<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노드 삭제하기</title>
</head>
<body>
    <h1>Web Programming</h1>
    <ul id ="items">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <script>
        // <li>HTML< /li>, <li>CSS< /li>, <li>JavaScript< /li> 요소를 선택하여 변수 items에 저장.
        const items = document.querySelectorAll('li');

        // for of 문을 사용하여 선택한 <li> 요소에 click 이벤트를 등록.
        for (const item of items) {
            item.addEventListener('click', () => {
                // this: click 이벤트가 발생한 대상 요소를 삭제.
                // this.parentNode: 이벤트가 발생한 대상 요소의 부모 노드(ul#items)를 선택.
                // removeChild(): 선택한 부모 노드에서 자식 노드를 삭제. (this) 괄호 안에는 삭제할 자식 노드를 지정.

                // 방법 1
                // this.parentNode.removeChild(this);

                // 방법 2
                // this.remove(this);

                // 올바른 수정 (괄호 안의 item은 생략해도 됩니다)
                item.remove(); 
            });
        }
    </script>
</body>
</html>
