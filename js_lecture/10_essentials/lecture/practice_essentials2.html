<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>실습 - 실무 필수 2차시</title>
<style>body{font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.7}
.g{background:#fff7e8;border:1px solid #f0d999;border-radius:10px;padding:14px 16px;color:#6b4e16}
code{background:#eee;border-radius:4px;padding:1px 6px;font-family:monospace}</style></head><body>
  <h1>⌨️ 실습 - 인벤토리 합치기 (스프레드)</h1>
  <div class="g"><b>준비:</b> 브라우저로 열고 <code>F12</code> → <b>콘솔</b> 탭을 켜두세요.</div>
  <script>
/*
    주제 : 스프레드 연산자 (...)

    - 스프레드(...) : 배열/객체의 내용물을 펼침
    - 배열 합치기 : [...배열1, ...배열2]
    - 객체 복사+변경 : { ...객체, key: 새값 }
*/

// [1] 1,2 를 담은 'a', 3,4 를 담은 'b' 배열을 만드세요.
//     작성 공식: let 배열이름 = [값들];

// [2] 스프레드로 a 와 b 를 합친 새 배열을 'merged' 에 저장하세요.
//     작성 공식: let 새배열 = [...배열1, ...배열2];

// [3] merged 를 출력하세요.

// [4] "칼","방패"를 담은 'items' 배열을 만드세요.

// [5] 스프레드로 items 앞에 "갑옷"을 추가한 새 배열을 출력하세요.
//     작성 공식: ["새값", ...배열]

// [6] name "기사", hp 100 을 담은 'character' 객체를 만드세요.

// [7] 스프레드로 character 를 복사하되 hp 만 70으로 바꾼 새 객체를 출력하세요.
//     작성 공식: { ...객체, key: 새값 }

// [8] 스프레드로 character 에 level 5 를 추가한 새 객체를 출력하세요.
  </script></body></html>
