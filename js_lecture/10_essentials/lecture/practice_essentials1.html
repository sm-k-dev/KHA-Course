<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>실습 - 실무 필수 1차시</title>
<style>body{font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.7}
.g{background:#fff7e8;border:1px solid #f0d999;border-radius:10px;padding:14px 16px;color:#6b4e16}
code{background:#eee;border-radius:4px;padding:1px 6px;font-family:monospace}</style></head><body>
  <h1>⌨️ 실습 - 캐릭터 분해 (구조분해)</h1>
  <div class="g"><b>준비:</b> 브라우저로 열고 <code>F12</code> → <b>콘솔</b> 탭을 켜두세요.</div>
  <script>
/*
    주제 : 구조분해 할당

    - 객체 구조분해 : let { key } = 객체;  → key 이름과 같은 변수로 꺼냄
    - 배열 구조분해 : let [a, b] = 배열;   → 순서대로 꺼냄
    - 한 줄로 여러 값을 꺼내 코드를 짧게
*/

// [1] name "기사", hp 100, level 5 를 담은 'character' 객체를 만드세요.
//     작성 공식: let 객체 = { key: value, ... };

// [2] 구조분해로 character 에서 name 과 hp 를 한 번에 꺼내세요.
//     작성 공식: let { key1, key2 } = 객체;

// [3] name 과 hp 를 함께 출력하세요.
//     작성 공식: console.log(값1, 값2);

// [4] 구조분해로 character 에서 level 만 꺼내 출력하세요.

// [5] "빨강","파랑","초록"을 담은 'colors' 배열을 만드세요.

// [6] 구조분해로 colors 에서 순서대로 first, second 를 꺼내세요.
//     작성 공식: let [a, b] = 배열;

// [7] first 와 second 를 함께 출력하세요.
  </script></body></html>
