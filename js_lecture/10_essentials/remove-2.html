<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노드 삭제하기</title>
</head>
<body>
    <h1>Web Programming</h1>
    <ul id ="items">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <script>
        // <h1>Web Programming< /h1> 요소를 선택하여 변수 title에 저장.
        const title = document.querySelector('h1');

        // 선택한 <h1>Web Programming< /h1> 요소에 click 이벤트를 등록.
        title.addEventListener('click', () => {
            // click 이벤트가 발생한 <h1>Web Programming< /h1> 요소를 삭제.
            title.remove();
        });

        /*
            주제: DOM 트리에서 특정 노드를 삭제하는 방법

            remove() 메서드
                - 선택한 요소를 DOM 트리에서 삭제합니다.
                - 선택한 요소의 부모 노드에서 해당 요소를 제거합니다.
                - 선택한 요소가 DOM 트리에 존재하지 않으면 아무런 동작도 수행하지 않습니다.
        */
    </script>
</body>
</html>
