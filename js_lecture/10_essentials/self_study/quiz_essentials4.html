<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>실무필수 실습</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:0 20px;line-height:1.8;font-size:16px}button{padding:8px 16px;font-size:15px;cursor:pointer;margin:4px}input{padding:8px;font-size:15px;width:250px}#out{margin-top:16px;padding:12px;background:#eef1fb;border-radius:8px;min-height:24px}</style>
</head>
<body>
<h3>출력 결과는 F12 → Console 탭에서 확인하세요. 주석 설명을 보며 직접 코드를 작성하세요.</h3>
<script>
/*
    주제 : 비동기 fetch (async / await)

    - 서버 데이터는 받는 데 시간이 걸림 → 기다려야 함
    - async function : 안에 '기다리는 작업'이 있다는 표시
    - await : 결과를 기다림 (async 함수 안에서만 사용)
    - 순서 : fetch(요청) → await(대기) → .json()(변환) → 사용
    - await 를 빠뜨리면 데이터 도착 전에 넘어가 undefined 가 됨
*/

// [1] 'getData' 라는 async 함수를 만드세요.
//     작성 공식: async function 함수이름() { ... }

// [2] (함수 안) await 로 fetch 요청을 보내 결과를 'res' 에 저장하세요.
//     주소: "https://jsonplaceholder.typicode.com/users/1"
//     작성 공식: let res = await fetch("주소");

// [3] (함수 안) await 로 res 를 json 으로 변환해 'data' 에 저장하세요.
//     작성 공식: let data = await res.json();

// [4] (함수 안) data 전체를 출력하세요.
//     작성 공식: console.log(data);

// [5] (함수 안) data.name 만 꺼내 출력하세요.

// [6] getData 함수를 호출하세요.
//     작성 공식: 함수이름();

// F12 → Console 에서 서버로부터 받아온 사용자 데이터가 나오면 성공입니다.
</script>
</body>
</html>
