<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>실무필수 실습</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:0 20px;line-height:1.8;font-size:16px}button{padding:8px 16px;font-size:15px;cursor:pointer;margin:4px}input{padding:8px;font-size:15px;width:250px}#out{margin-top:16px;padding:12px;background:#eef1fb;border-radius:8px;min-height:24px}</style>
</head>
<body>
<h3>출력 결과는 F12 → Console 탭에서 확인하세요. 주석 설명을 보며 직접 코드를 작성하세요.</h3>
<script>
/*
    주제 : 스프레드 연산자 (...)

    - 스프레드(...) : 배열/객체의 내용물을 낱개로 펼침
    - 배열 합치기 : [...배열1, ...배열2]
    - 객체 복사 + 일부 변경 : { ...객체, key: 새값 }
    - 원본은 그대로 두고 '새 것'을 만듦 (실무에서 매우 자주 사용)
*/

// [1] 숫자 1,2 를 담은 'a' 배열과 3,4 를 담은 'b' 배열을 만드세요.
//     작성 공식: let 배열이름 = [값들];

// [2] 스프레드로 a 와 b 를 합친 새 배열을 'merged' 에 저장하세요.
//     작성 공식: let 새배열 = [...배열1, ...배열2];

// [3] merged 를 출력하세요.

// [4] "칼","방패"를 담은 'items' 배열을 만드세요.

// [5] 스프레드로 items 앞에 "갑옷"을 추가한 새 배열을 출력하세요.
//     작성 공식: ["새값", ...배열]

// [6] name "기사", hp 100 을 담은 'character' 객체를 만드세요.

// [7] 스프레드로 character 를 복사하되 hp 만 70으로 바꾼 새 객체를
//     'damaged' 에 저장하세요.
//     작성 공식: let 새객체 = { ...객체, key: 새값 };

// [8] damaged 를 출력하세요. (name 은 그대로, hp 만 70)

// [9] 스프레드로 character 를 복사하며 level 5 를 추가한 새 객체를 출력하세요.
//     작성 공식: { ...객체, 새key: 값 }

// [10] 원본 character 는 안 바뀌었는지 출력해 확인하세요.
</script>
</body>
</html>
