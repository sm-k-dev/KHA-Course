<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레드향 주문하기</title>
</head>
<body>
  <h1>레드향 주문하기</h1>
  <form action="">
    <fieldset>
      <legend>상품 선택</legend>
     
    </fieldset>
	 <!-- 
	 		5. 
	 			type="search"
	 			type="url"
	 			type="email"
	 			type="tel"
	 			
	 			- <input type="search">
	 			
	 			   검색을 위한 텍스트필드로 크롬이나 엣지 브라우저를 비롯해
	 			   모바일 기기의 웹브라우저에서는 이필드에 검색어를 입력하면
	 			   오른쪽에 x가 표시되어 입력한 검색어를 손쉽게 지울수 있습니다.
	 			
	 			- <input type="url">
	 			
	 			   웹브라우저를 이용해 웹서버 하드공간에 저장된 .html파일이나
	 			   .jsp등의 파일을 요청하기 위한 텍스트필드를 만들수 있습니다.
	 			 
	 			-  <input type="email">
	 				
	 				이메일 주소 입력을 위한 텍스트필드로
	 				입력한 이메일 값이 지정한 이메일형식에 맞지 않는다면
	 				웹브라우저에서 오류 메세지를 보여줍니다.
	 			
	 			- <input type="tel">
	 				
	 				전화번호 입력을 위한 텍스트필드로
	 				모바일 페이지에서 이 값을 이용하면 바로 전화걸 수 있습니다.		   
	  --> 
	
	 <!-- 실습.  배송 정보 입력하는 디자인 폼 만들기  -->    
    <fieldset>
      <legend>배송 정보</legend>      
      <ul id="shipping">
        <li>
          <label for="user-name">이름 </label>
          <input type="text" id="user-name">
        </li>
        <li>
          <label for="addr">배송 주소</label>
          <input type="text" id="addr">
        </li>
        <li>
          <label for="mail">이메일</label>
          <input type="email" id="mail">
        </li>        
        <li>
          <label for="phone">연락처</label>
          <input type="tel" id="phone">
        </li>
      </ul>  
    </fieldset> 
  </form>
</body>
</html>
