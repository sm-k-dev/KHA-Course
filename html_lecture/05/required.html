<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레드향 주문하기</title>
  <link rel="stylesheet" href="css/form2.css">
</head>
<body>
  <h1>레드향 주문하기</h1>
  <form action="result.jsp">
    <fieldset>
      <legend>배송 정보</legend>
      <ul id="shipping">
      <!--
        읽기 전용 필드를 만들어 주는 readonly 속성
        - readonly는 '읽기만 가능하다'는 뜻.
        - 사용자가 해당 입력 필드 안의 내용을 **직접 수정하거나 입력할 수 없음**.
        - 하지만 입력칸 안의 내용은 화면에 표시되고 읽을 수는 있음.
        - 예: 사용자 이름을 변경 못 하게 하고 보여주기만 할 때 사용.
        - 문법 예시:
              <input type="text" value="홍길동" readonly>
      -->

      <!--
        필수 입력 필드를 지정하는 required 속성
        - required는 '반드시 입력해야 한다'는 뜻.
        - 사용자가 해당 입력 칸에 값을 입력하지 않으면 **폼(form) 제출이 되지 않음**.
        - 주로 이름, 이메일, 비밀번호처럼 꼭 필요한 값에 사용.
        - 입력하지 않고 제출하려 하면 브라우저가 경고 메시지를 띄워줌.
        - 문법 예시:
              <input type="email" required>
        - 이 경우 이메일 칸을 비워두면 제출할 수 없음.
      -->
      <!-- 예제. readonly와 required 속성 사용하기-->
        <li>
          <label for="prod">주문 상품</label>
          <input type="text" id="prod" value="상품용 3KG" readonly>
        </li>
        <li>
          <label for="user-name">이름 </label>
          <input type="text" id="user-name" autofocus required>
        </li>
        <li>
          <label for="addr">배송 주소</label> 
          <input type="text" id="addr" >
        </li>
        <li>
          <label for="mail">이메일</label>
          <input type="email" id="mail">
        </li>        
        <li>
          <label for="phone">연락처</label>
          <input type="tel" id="phone" placeholder="하이픈 빼고 입력해 주세요.(01012345678)" required>
        </li>
        <li>
          <label for="d-day">배송 지정</label>
          <input type="date" id="d-day"> <small>(주문일로부터 최소 3일 이후)</small>
        </li>        
      </ul>  
    </fieldset>
    <div>
      <input type="submit" value="주문하기"> 
      <input type="reset" value="취소하기">
    </div>        
  </form>
</body>
</html>
