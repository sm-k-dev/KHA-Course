<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>웹 폼</title>
</head>
<body>
	<!--
		아무런 기능이 없는 기본 일반 버튼을 나타내는 type="button"
		- type="button" 은 submit이나 reset버튼 과 같은 기능이 없고 오직 버튼 형태만 삽입합니다.
		- 주로  버튼을 클릭해서 자바스크립트 언어의 함수를 호출할 때 쓰입니다.
		- 기본 작성 문법
				<input type="button" value="버튼에 표시할 텍스트">
	-->
	<!--예제. type="button" 을 사용해 [공지 창 열기] 버튼을 만들고, 이 버튼을 클릭하면 
			  자바스크립트의 window객체의 open함수를 호출해 notice.html의 새로운 팝업창을 띄우는 예
	-->
	<form>
    <!-- 일반 기본 버튼을 만든다 									    "자바스크립트 문법의 코드 작성" -->
		<input type="button" value="공지 창 열기" onclick="window.open('notice.html')" >
		<!--
			<input type="button">
			-> 화면에 버튼 하나를 만든다.
			-> type="button"은 그냥 누를 수 있는 아무런 기능이 없는 버튼 이라는 뜻.(submit버튼 처럼 서버페이로 전송 은 안함)

			value="공지 창 열기"
			-> 버튼 위에 보일 글자를 정한다.
			
			onclick="..."
			->"버튼을 클릭했을 떄 어떤 동작을 실행할까?"를 정하는 속성.
			-> on(무언가 일어났을때) + click(클릭) = "클릭 이벤트가 발생하면 실행하라"

			window.open('notice.html')
			-> window = 현재 브라우저 창 객체(브라우저 자체라고 이해하면됨)
			-> open('notice.html') = "새 브라우저 창을 열어서 notice.html 페이지의 코드 내용을 띄워라"
			-> 즉, 버튼을 클릭하면 공지사항 페이지(notice.html)가 새 브라우저 창에서 열림 


			 📌 쉽게 풀어서 설명

					<input type="button"> : 화면에 아무런 기능이 없는 "버튼"을 하나 만든다.

					value="공지 창 열기" : 버튼 위에 보이는 글자.

					onclick="..." : 사용자가 버튼을 "클릭했을 때 실행되는 동작"을 적는 자리.

					window.open('notice.html') : 새로운 브라우저 창(또는 탭)을 열어서, 그 안에 notice.html 페이지를 보여준다.

		-->


  </form>
</body>
</html>
