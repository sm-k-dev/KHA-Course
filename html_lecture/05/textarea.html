<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레드향 주문하기</title>
  <link rel="stylesheet" href="css/order.css">
</head>
<body>
  <div id="container">
    <h1>레드향 주문하기</h1>
    <form>
      <fieldset>
        <legend>배송 정보</legend>
        <ul id="shipping">
          <li>
            <label for="user-name">이름 </label>
            <input type="text" id="user-name">
          </li>
          <li>
            <label for="addr">배송 주소</label>
            <input type="text" id="addr">
          </li>
          <li>
            <label for="mail">이메일</label>
            <input type="email" id="mail">
          </li>        
          <li>
            <label for="phone">연락처</label>
            <input type="tel" id="phone">
          </li>
          <li>
            <label for="d-day">배송 지정</label>
            <input type="date" id="d-day"> <small>(주문일로부터 최소 3일 이후)</small>
          </li>     
          <li>
            <label for="memo">메모</label>
            <!--
              <textarea> 태그:
                - HTML에서 여러 줄 텍스트(긴 글)를 입력할 수 있게 해주는 입력 양식 태그.
                - 예: 메모장, 글쓰기, 댓글 작성, 문의사항 입력 등 길이가 긴 내용을 입력할 때 사용.
                - <input type="text">는 한 줄만 입력 가능하지만,
                  <textarea>는 여러 줄을 입력할 수 있음.

              기본 작성 문법:
                <textarea 속성="값" 속성="값"></textarea>
                - 여는 태그와 닫는 태그 사이에 기본 텍스트를 넣으면,
                  사용자에게 미리 보이는 기본값(기본 글)이 됨.
                - 빈 상태로 두면 아무 내용도 없이 빈 텍스트박스가 출력됨.
            -->

            <!--
              id="memo":
                - 이 textarea에 'memo'라는 ID를 부여.
                - ID는 하나의 고유한 이름으로, CSS나 자바스크립트에서 이 박스를 선택할 때 사용.
              
              cols="40":
                - textarea의 가로 크기를 열(column) 개수로 지정.
                - 숫자가 클수록 가로 폭이 넓어짐.
                - 실제 화면에서는 픽셀(px)로 변환되어 표시됨.

              rows="4":
                - textarea의 세로 크기를 줄(row) 개수로 지정.
                - 숫자가 클수록 세로로 더 많은 줄을 표시할 수 있음.
            -->
          
              <textarea id="memo" cols="40" rows="4"></textarea>



           

          </li>   
        </ul>  
      </fieldset>
      <div>
        <input type="submit" value="주문하기"> 
        <input type="reset" value="취소하기">
      </div>        
    </form>
  </div>
</body>
</html>
