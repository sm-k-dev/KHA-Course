<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>장바구니 예제</title>
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		<style>
			body {
				font-family: Arial, sans-serif;
				text-align: center;
				margin-top: 50px;
			}
			
			table {
				margin: 0 auto;
				border-collapse: collapse;
				width: 80%;
			}
			
			th, td {
				border: 1px solid #ddd;
				padding: 8px;
				text-align: center;
			}
			
			th {
				background-color: #f4f4f4;
			}
			
			.button {
				padding: 5px 10px;
				cursor: pointer;
				margin: 2px;
			}
		</style>
	</head>
	<body>
	
		<h1>온라인 쇼핑몰</h1>
		<h2>상품 목록</h2>
		<table id="productTable">
			<thead>
				<tr>
					<th>상품명</th>
					<th>가격</th>
					<th>추가</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>상품 1</td>
					<td>10,000원</td>
					<td><button class="add-to-cart button">장바구니에 추가</button></td>
				</tr>
				<tr>
					<td>상품 2</td>
					<td>20,000원</td>
					<td><button class="add-to-cart button">장바구니에 추가</button></td>
				</tr>
				<tr>
					<td>상품 3</td>
					<td>30,000원</td>
					<td><button class="add-to-cart button">장바구니에 추가</button></td>
				</tr>
			</tbody>
		</table>
	
		<div id="cart">
			<h2>장바구니</h2>
			<table id="cartTable">
				<thead>
					<tr>
						<th>상품명</th>
						<th>수량</th>
						<th>총 가격</th>
						<th>삭제</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
			<button id="clearCart" class="button">장바구니 비우기</button>
		</div>
		<script>
			/*
				장바구니를 표현하는 비어있는 객체 { }로 생성
					참고. 여기서 상품명을 속성명으로 작성하고, 가격과 수량을 값으로 저장할 것이다.
					{ "상품명1" : "가격과 수량", "상품명2" : "가격과 수량", ... } <-- 장바구니 객체
			*/
			let cart = {};
					
			/*
				장바구니 추가 button 3개를 모두 다중 선택해서 'click' 이벤트 등록
				또한 3개의 버튼 중, 하나의 버튼에 click 이벤트가 발생하면 실행되는 이벤트 핸들러 함수 정의
			*/
			$(".add-to-cart").on("click", function(){
				
				/*
					$(this)
						'click' 이벤트가 발생한 <button>장바구니에 추가</button> 요소를 선택
					
					$(this).closest(selectors);
						$(this) <= 탐색을 시작할 button요소
						.closest <= 찾고자 하는 상위 요소의 css 선택자 문법 작성자리 (예: '.my-class', 'div')
				*/
				
				// 1. click된 장바구니 추가 button을 감싸고 있는 부모 tr 요소를 찾아 선택해 가져온다.
				let row = $(this).closest('tr');
				
				// 2. 해당 tr 요소 행의 첫번째 <td>상품 1</td>셀에서 '상품 1'을 가져온다.
				//		click한 장바구니 추가 button행의 상품명 '상품 1' 얻기
				let productName = row.find('td:first').text();
				
				// 3. 가격 '10,000원'을 가져와서 숫자로 변환
				//		여기서는 replace() 메소드를 사용하여 문자열에서 쉼표와 '원'을 제거
				let productPrice = parseInt(row.find('td:nth-child(2)').text().replace(',', '').replace('원', ''));
				
				// 4. 장바구니 cart {} 객체에 상품 추가 또는 수량 증가
				
				if ( cart[productName] ) { // 장바구니 역할을 하는 cart{} 객체에 클릭한 button의 행의 상품이 이미 저장되어 있다면?
					/*
						cart[productName] 는 객체 (cart) 에서 특정 속성명(productName)을 이용해 값을 저장하거나 불러오는 방법
						
						cart 객체 모습
						{
							"상품 1": { price: 10000, quantity: 1 }
						}
					*/
					// 이미 같은 상품 1이 장바구니 cart 객체에 추가되어 있으면? 수량만 증가
					cart[productName].quantity++;
					
				} else { // 장바구니 역할을 하는 cart {} 객체에 클릭한 button의 행의 상품 정보가 없다면?
					// 클릭한 button의 행의 상품 정보를 cart {} 객체에 "상품명": {"가격": 가격, "수량": 수량} 형태로 추가
					cart[productName] = {price:productPrice, quantity: 1};
				}
				
				// 5. 장바구니에 담긴 브라우저 화면을 업데이트 하는 함수 호출
				updateCart();
			});
			
			// 5-1. 장바구니 화면을 업데이트 하는 기능의 함수
			function updateCart(){
				
				// 장바구니 <table></table>부모요소 아래에 만들어져 있는 자식 <tbody></tbody> 요소 선택
				let cartTableBody = $("#cartTable tbody");
				
				// 만약 <tbody> ... </tbody> 사이에 추가된 상품 정보의 행이 있으면? 모든 자식요소를 제거 (비우자)
				cartTableBody.empty();
				
				// <tbody></tbody> 사이에 표시할 상품들의 총가격을 저장할 변수 선언
				let totalPrice = 0;
				
				// cart 객체를 순회하면서 각 상품의 이름과 상품명과 가격과 수량정보를 얻어 사용
				$.each(cart, function(name, item){
					
					// 클릭한 장바구니 추가 <button>이 속한 행의 상품 가격 = 가격 * 수량
					let totalItemPrice = item.price * item.quantity;
					
					totalPrice += totalItemPrice;
					
					// 클릭한 장바구니 추가 <button> 하나의 상품 정보가 보여질 <tr></tr>한쌍을 새로 만들어 <tbody></tbody> 사이에 추가
					cartTableBody.append(`
							<tr>
								<td>${name}</td>
								<td>
									<button class="decrease-quantity button">-</button>
									<span>${item.quantity}</span>
									<button class="increase-quantity button">+</button>
								</td>
								<td>${totalItemPrice.toLocaleString()} 원</td>
								<td><button class="remove-item button">삭제</button></td>
							</tr>
						`);
				});
				
				// 장바구니 cart 객체에 추가한 상품들의 총 가격을 표시할 새로운 <tr></tr> 행을 만들어 <tbody></tbody> 끝에 추가
				cartTableBody.append(`
							<tr>
								<td colspan="2"><strong>총 가격</strong></td>
								<td colspan="2"><strong>${totalPrice.toLocaleString()} 원</strong></td>
							</tr>
						`);
				
				// 수량 증가 <button class='increase-quantity button'>+</button> 요소 선택 후 'click' 이벤트 등록 후 처리
				$('.increase-quantity').off('click').on('click', function(){
					// 목적1: click 이벤트가 발생한 <button>+ 이 속한 상품 명을 찾아야 한다.
					
					/*
						$(this)
							click 이벤트가 발생한 <button>+ 요소를 선택
						
						$(this).closest('tr')
							click 이벤트가 발생한 <button>+ 요소를 감싸서 작성된 상위 <tr></tr>한쌍을 선택
							
						$(this).closest('tr').find("td:first")
							상위 <tr></tr>안에 작성된 첫번째 td를 찾는다
					*/
					let productName = $(this).closest('tr').find("td:first").text();
							
					// 목적2: + 수량 버튼을 클릭한 행의 해당 상품 수량 1 증가
					cart[productName].quantity++;
							
					// 목적3: + 수량 버튼을 클릭한 행의 해당 상품 수량 증가된 모습을 브라우저에 표시
					updateCart(); // 자기가 포함된 함수를 호출 = 재귀함수호출
				});
				
				// 수량 감소 <button class="decrease-quantity button">-</button> 요소에 'click' 이벤트를 등록 후 처리
				$('.decrease-quantity').off('click').on('click', function(){
					// 목적1: 수량 감소 버튼을 클릭한 행의 해당 상품명 얻기
					let productName = $(this).closest('tr').find("td:first").text();
					
					// 목적2: 수량 감소 버튼을 클릭한 행의 해당 상품 수량 1 감소
					//		수량이 1보다 크다면 수량을 감소, 수량이 1과 같다면 해당 상품 정보를 cart{} 에서 삭제
					if ( cart[productName].quantity > 1 ) cart[productName].quantity--;
					else delete cart[productName];
					
					// 목적3: 수량감소 버튼을 클릭한 행의 해당 상품 수량 가소된 모습을 브라우저에 표시
					updateCart();
				});
				
				// 삭제 버튼
				$('.remove-item').on('click', function(){
					let productName = $(this).closest('tr').find("td:first").text();
					
					delete cart[productName];
					
					updateCart();
				});
				
				//<button id="clearCart" class="button">장바구니 비우기<button>에 click이벤트 등록 후 처리 
				$("#clearCart").on("click", function(){
					cart = {};
					updateCart();//cart {} 장바구니 객체의 현재 상태를 브라우저화면에 반영 
				});
			}
		</script>
		<!--
			jQuery의 off() 메소드를 활용하여 장바구니의 상품을 추가하고, 
			해당 상품의 수량을 조절하며, 
			필요 시 이벤트를 제거하는 예제를 만들어보자. 
			장바구니에서 상품 수량을 증가 또는 감소시키는 버튼을 클릭할 때 
			해당 이벤트를 동적으로 추가하고 제거하는 방식을 보여줍니다.
			======================================================================
			 .off('click')를 사용하는 이유
			            
			        1. 이벤트 중복 방지:
			        .on('click', ...)을 여러 번 호출하면, 
			                동일한 버튼에 대해 클릭 이벤트가 여러 번 등록될 수 있습니다. 
			                이 경우 버튼을 클릭할 때마다 여러 번의 함수가 실행될 수 있습니다.
			                예를 들어, 사용자가 수량 증가 버튼을 여러 번 클릭하면, 
			                수량이 예상보다 더 많이 증가할 수 있습니다.
			        2.동적 요소 처리:
			                웹 페이지에서 동적으로 생성되는 요소에 이벤트를 등록할 때, 
			                이전 이벤트 핸들러를 제거하지 않으면 문제가 발생할 수 있습니다. 
			                동적으로 생성된 버튼에 대해 여러 번 이벤트가 등록될 수 있습니다.
		-->
	</body>
</html>
