<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>이벤트</title>
		<script src="http://code.jquery.com/jquery-latest.min.js"></script>
		<script>
			$(function() {
				/*
					focus()
					- 요소를 선택해서  선택한 요소에 포커스를 이동시키는 동작(이벤트)을 등록하는 메소드.
				
					blur()
					- 선택한 요소에서 포커스가 존재하다가 다른 요소로 이동시키는 동작(이벤트)을 등록하는 메소드.
							
					focusin()
					- 선택한 요소의 하위요소 중에서 입력요소로 포커스를 이동시키는 동작(이벤트)을 등록하는 메소드.			
					
					focusout()
					- 선택한 요소의 하위요소 중에서 입력요소에 포커스가 존재하다가  외부요소로 이동시키는 동작(이벤트)을 등록하는 메소드.
					
					
					 ============ 위 이벤트 등록 메소드들 전체 작성 문법 ======================
					
					 $("이벤트대상요소선택").focus 또는 blur 또는  focusin 또는 focusout(function(){ 이벤트처리코드;  });
				
					 $("이벤트대상요소선택").on("focus 또는 blur 또는  focusin 또는 focusout", function(){ 이벤트처리코드; }   );
				
					 
					============ 스크롤 막대바를 강제로 이동 시키는 이벤트 등록 방법 작성 문법 ============
					
					 $("이벤트대상요소선택").focus 또는 blur 또는  focusin 또는 focusout();
				 */
				 
				 // ===========================================================================
					 
				 /*
				 	1. <input type="text" name="user_id_1" id="user_id_1">
				 		<input type="password" name="user_pw_1" id="user_pw_1"> 요소 두쌍 다중 선택
				 		on 메소드 사용 focus 이벤트 등록
				 
						 $("#user_id_1, #user_pw_1").on("focus", function(){
							 // 1.1. 두 쌍의 <input> 중에서 하나의 <input> 에 focus 이벤트가 발생하면 이벤트 처리
							 // $(this) 
							 // 	focus 이벤트가 발생한 <input> 요소 선택
							 $(this).css("backgroundColor", "pink");
						 });
						 		
				 	2. <input type="text" name="user_id_1" id="user_id_1">
				 		<input type="password" name="user_pw_1" id="user_pw_1"> 요소 두쌍 다중 선택
				 		on 메소드 사용 blur 이벤트 등록
				 
						 $("#user_id_1, #user_pw_1").on("blur", function(){
							 // 2.1. 두 쌍의 <input> 중에서 하나의 <input> 에 focus 이벤트가 발생하면 이벤트 처리
							 // $(this) 
							 // 	focus 이벤트가 발생한 <input> 요소 선택
							 $(this).css("background", "none");
						 });
				 */		
				 $("#user_id_1, #user_pw_1").on( { 
					"focus": function(){ $(this).css("backgroundColor", "pink") },
					"blur": function(){ $(this).css("background", "none") }
				 } );
				 
				// ===========================================================================
				
				/*
					3. 2번째로 작성된 <form></form> 선택, 폼 내부에 작성된 입력요소 2개 <input></input>에 focusin 이벤트 등록
				
						$("form:eq(1)").focusin( function (e){
							// $(this) -> focusin 이벤트가 발생한 전체 영역인 <form> 요소 선택
							
							// focusin 이벤트가 발생한 <form>의 하위요소 선택 방법 1.
							//		$("하위요소선택", this) // 뒤에서 부터 앞으로 읽는다.
							
							// focusin 이벤트가 발생한 <form>의 하위요소 선택 방법 2.
							//		$(this).find("하위요소선택")
							
							// focusin 이벤트가 발생한 <form>의 하위요소 선택 방법 3.
							//		$(this).children("직계하위요소선택")
							
							// 1. 입력 요소 2개 중에 어느 하나라도 focus 이벤트가 발생하면
							//		$("하위요소", this) 로 <input> 요소 선택, focus 이벤트 등록
							//		focus 이벤트가 발생한 <input> 에 배경색 설정
							$(e.target).css("backgroundColor", "pink");
							$(e.target).css("backgroundColor", "pink");
							/*
								위 코드는 "진짜 포커스 받은 녀석"만 콕 집기!
								"폼 안에 들어온 건 맞는데, 그중에서 지금 진짜로 클릭당한(포커스된) 그 녀석만 바꾸고 싶어!"라고 하려면 어떻게 해야 할까요?
								이때는 this 대신 e.target이라는 아주 유용한 도구를 사용
								이벤트 핸들러 함수에 e(이벤트 객체)를 매개변수로 받습니다.
								e.target은 '실제로 포커스를 받은(이벤트가 발생한) 진짜 알맹이 요소'를 가리킵니다.
    							즉, ID를 누르면 ID 창이 되고, PW를 누르면 PW 창이 됩니다!
    						/
							
							
							// $("#user_id_2", this).css("backgroundColor", "pink");
							// $("#user_pw_2", this).css("backgroundColor", "pink");
							// 위 코드처럼 작성하면, 포커스가 한 input에만 들어와도 전체 이벤트 코드가 실행되기 때문에 두 input의 배경색이 모두 변경 된다.
							// 즉: 폼 내부에 포커스가 들어오는 순간 컴퓨터는 적혀있는 두 줄의 명령을 모두 실행해 버리기 때문에 둘 다 핑크색이 되는 것입니다.
						} );
				*/
					
				$("form:eq(1)").on({
					"focusin": function(e){
						$(e.target).css("backgroundColor", "pink");
						$(e.target).css("backgroundColor", "pink");
					},
					"focusout": function(e){
						$(e.target).css("background", "none");
						$(e.target).css("background", "none");
					}
				});
				
			});//$(function(){});
		</script>
	</head>
	<body>
		<h1>focus / blur</h1>
		<form action="#">
			<p>
				<label for="user_id_1">ID</label> <input type="text" name="user_id_1" id="user_id_1">
			</p>
			<p>
				<label for="user_pw_1">PW</label> <input type="password" name="user_pw_1" id="user_pw_1">
			</p>
		</form>
		<h1>focusin / focusout</h1>
		<form action="#" id="frm_2">
			<p>
				<label for="user_id_2">ID</label> <input type="text" name="user_id_2" id="user_id_2">
			</p>
			<p>
				<label for="user_pw_2">PW</label> <input type="password" name="user_pw_2" id="user_pw_2">
			</p>
		</form>
	</body>

</html>
