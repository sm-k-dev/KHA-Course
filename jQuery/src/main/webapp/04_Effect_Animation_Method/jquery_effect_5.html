<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Insert title here</title>
		
		<style>
			h1 {
				width: 300px;
				height: 200px;
				background-color: yellow;
			}
		</style>
		
		<script src="http://code.jquery.com/jquery-latest.min.js"></script>
		<script type="text/javascript">
			$(function() {
				
				// 1. <h1>내용</h1> 요소를 선태갷서 h1 상수 선언 후 저장
				const h1 = $("h1");
				
				// 2. <button id="btn1">slideUp</button> 선택해서 'click'이벤트 등록
				$("button:first").on("click", () => h1.slideUp(1000) );
				
				// 3. <button id="btn2">slideDown</button> 선택해서 'click'이벤트 등록
				$("button:eq(1)").on("click", () => h1.slideDown(1000) );
				
				// 4. <button id="btn3">slideToggle</button> 선택해서 'click'이벤트 등록
				$("button:last").on("click", () => h1.slideToggle(1000) );
			});
		</script>
	</head>
	<body>
		<button id="btn1">slideUp</button>
		<button id="btn2">slideDown</button>
		<button id="btn3">slideToggle</button>
		<h1>내용</h1>
	</body>
</html>
