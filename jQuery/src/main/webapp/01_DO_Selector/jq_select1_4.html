<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Insert title here</title>
		<script src="https://code.jquery.com/jquery-latest.min.js"></script>
	</head>
	<body>
		<h1>제이쿼리</h1>
		<h1>제이쿼리2</h1>
		<h2>선택자</h2>
		<h3 id="3">직접선택자</h3>
		
		<script type="text/javascript">
			/*
				[요소명(태그명) 선택자로 요소 선택]
				$("태그명")
					-> 해당 태그를 문서에서 전부 선택
				
				$("h1")
					모든 <h1> 요소 선택
			*/
			$("h1").css("color", "red");
					
			/*
				[그룹(다중) 선택자 , 로 요소 선택]
				$("선택자 종류1, 선택자 종류2")
					-> , (쉼표): 여러 선택자를 한꺼번에 다중 선택해서 가져오는 선택자 기호
					선택자1 선택자2 자리에 작성하는 선택 방법이 달라도 상관 없음
			*/
			$("h2, #3").css("border", "2px dotted blue");
		</script>
	</body>
</html>
