<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Insert title here</title>
		<script src="https://code.jquery.com/jquery-latest.min.js"></script>
		<script type="text/javascript">
			$(function(){
				/*
					[id 선택자 # 으로 DOM을 선택해오는 식]
				
					$("#id값")
					-> id 값이 # 뒤에 작성한 "id값"과 정확히 일치하는 태그 하나만 선택
					
					<h2 id="tit">선택자< /h2> 선택
					
					.css("background-color", "red")
						css 함수를 이용해 #tit에 background-color 스타일 설정
					
					.css("border", "2px solid yellow");
						체이닝 기법
						css 함수를 이용해 #tit에 border 스타일 설정
				*/
				$("#tit").css("background-color", "red").css("border", "2px solid yellow");
				
				/*
					자바스크립트 코드로 작성 한다면, 아래와 같이 작성해야 한다.
				
					document.getElementById("tit").style.backgroundColor = "red";
					document.getElementById("tit").style.border = "2px solid yellow";
				*/
			});
		</script>
	</head>
	<body>
		<h1>제이쿼리</h1>
		<h2 id="tit">선택자</h2>
		<h3>직접선택자</h3>
	</body>
</html>
