<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Insert title here</title>
		<script src="https://code.jquery.com/jquery-latest.min.js"></script>
	</head>
	<body>
		<!-- 
			탐색선택자 중에서  위치탐색 선택자  
				
				종류	-> eq(index) 선택자, lt(index) 선택자, gt(index) 선택자  
				
				eq(index) 선택자
					- 선택 한 요소들 중에서 지정한 index 위치에 저장된 요소만 선택하는 선택자
					- 문법
						  $("요소들선택:eq(index)") 또는 $("요소들선택").eq(index)
						  
				lt(index) 선택자
					- 선택한 요소들 중에서 지정한 index 위치 이전의 index위치에 저장된 요소들만 선택 하는 선택자
					- 문법
						  $("요소들선택:lt(index)")   
						  
				gt(index) 선택자
					- 선택한 요소들 중에서 지정한 index 위치보다 큰 index위치에 저장된 요소들만 선택 하는 선택자
					- 문법
						  $("요소들선택:gt(index)")		  
		 -->
	
		<h1>탐색 선택자</h1>
		<ul id="menu1">
			<li>내용1</li>	<!--  index  0 -->
			<li>내용2</li>	<!--  index  1 -->
			<li>내용3</li>	<!--  index  2 -->
			<li>내용4</li>	<!--  index  3 -->
			<li>내용5</li>	<!--  index  4 -->
			<li>내용6</li>	<!--  index  5 -->
		</ul>
		<script type="text/javascript">
			/*
				$("#menu1 li").eq(2)
					id=menu1 인 <ul>< /ul> 부모요소를 먼저 선택
					" "을 이용해서 li 후손 요소들을 모두 선택해서 배열에 담는다
					.eq(2) 메소드를 이용해 그 중에서 인덱스 번호가 2인 <li>내용3< /li> 한쌍만 선택
			*/
			// 방법 1
			$("#menu1 li").eq(2).css("background-color", "lightgreen");
			
			/*
				$("#menu1 li:eq(3)")
					id=menu1 인 <ul>< /ul> 부모요소를 먼저 선택
					" "을 이용해서 li 후손 요소들을 모두 선택해서 배열에 담는다
					:eq(3) 메소드를 이용해 그 중에서 인덱스 번호가 3인 <li>내용4< /li> 한쌍만 선택
			*/
			// 방법 2
			$("#menu1 li:eq(3)").css("background-color", "lightblue");
			
			/*
				$("#menu1 > li:lt(2)")
					id=menu1 인 <ul>< /ul> 부모요소를 먼저 선택
					> 을 이용해서 li 자식 요소들을 모두 선택해서 배열에 담는다
					:lt(2) 메소드를 이용해 그 중에서 2 인덱스 위치 이전인 0과 1 인덱스 위치 칸에 저장된 <li>내용1< /li> 와 <li>내용2< /li> 요소들만 최종 선택
			*/
			$("#menu1 > li:lt(2)").css("background-color", "lightyellow");
			
			/*
				$("#menu1 > li:gt(3)")
					id=menu1 인 <ul>< /ul> 부모요소를 먼저 선택
					> 을 이용해서 li 자식 요소들을 모두 선택해서 배열에 담는다
					:gt(3) 메소드를 이용해 그 중에서 3 인덱스 위치 이후인 4과 5 인덱스 위치 칸에 저장된 <li>내용5< /li> 와 <li>내용6< /li> 요소들만 최종 선택
			*/
			$("#menu1 > li:gt(3)").css("background-color", "pink");
		</script>
	</body>
</html>
