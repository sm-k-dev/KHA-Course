<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>상품 소개 페이지</title>
    <!--
      <style></style> 한쌍: 선언문 태그. 이 사이에 css 코드를 작성한다.
    -->
    <style>
      /*
        CSS 제작자 스타일
          - 같은 요소에 여러 규칙이 겹칠 때
            캐스케이딩 우선순위를 보여주는 예제
      */

      /* 태그명 선택자: p 태그명을 사용하여 아래에 작성된 모든 <p></p> 요소들을 한번에 선택해서 스타일을 정의 */
      p {
        color:black; /* 1번 규칙: p 요소들 내부에 작성된 글자색을 검정으로 설정 */
      } 

      /* 태그명 선택자: h1 태그명을 사용하여 아래에 작성된 모든 <h1></h1> 요소들을 한번에 선택해서 스타일을 정의 */
      h1 {
        color: brown !important; /* 
                                      2번 규칙: h1 요소 내부에 작성된 글자색을 갈색으로 설정 
                                              !importatnt: 어떤 규칙 보다 최우선으로 브라우저에 적용될 수 있게 하는 단어
                                    */
      } 

      /* 태그명 선택자: p 태그명을 사용하여 아래에 작성된 모든 <p></p> 요소들을 한번에 선택해서 스타일을 정의 */
      p {
        color:blue; /* 
                        3번 규칙: p 요소들 내부에 작성된 글자색을 파랑으로 설정 
                                  1번 규칙보다 나중에 작성되었으므로, 1번 규칙을 덮어 쓴다.
                      */
      }
    </style>
  </head>
  <body>
    <!--
      인라인 스타일 작성 방법
      - 제작자 CSS보다 우선순위가 높음
      - 하지만 !important보다 우선순위가 낮음
    -->
    <h1 style="color:green;">레드향</h1>
    <!--
      결과: 갈색(brown)으로 출력됨
      이유: h1 요소에 작성된 인라인 스타일이 우선순위가 높지만, h1 요소에 작성된 !important가 우선순위가 더 높기 때문
    -->
    <p style="color:red;">껍질에 붉은 빛이 돌아 레드향이라 불린다.</p>
    <!--
      결과: 빨강(red)으로 출력됨
      이유: p 요소에 작성된 인라인 스타일이 우선순위가 높기 때문.
    -->
    <p>레드향은 한라봉과 귤을 교배한 것으로</p>
    <!--
      결과: 파랑(blue)으로 출력됨
      이유: 인라인 스타일 없음 > CSS의 마지막 P 요소에 작성된 스타일이 우선순위가 높기 때문
    -->
    <p>일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <!--
      결과: 파랑(blue)으로 출력됨
      이유: 인라인 스타일 없음 > CSS의 마지막 P 요소에 작성된 스타일이 우선순위가 높기 때문
    -->
  </body>
</html>
