<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>상품 소개 페이지</title>
        <style>
            /*
                타입선택자?
                    - 태그명 선택자
                    - 선택자 자리에 작성한 태그명에 관한 태그를 선택 해 오는 선택자.
                        선택자 자리 {
                            속성: 값;
                        }

                    - 문법
                        태그명 {
                            속성명: 값;
                        }
            */
            /*
                P 태그명 선택자를 이용해
                아래에 작성된 모든 <p></p> 요소들 3쌍을 한번에 선택해서 스타일을 적용하겠다.
            */
            p {
                /*
                    <p>글자들</p> 요소들에 작성된 모든 글자들의 스타일 종류를 이텔릭체로 기울여서 표시
                */
                font-style: italic;
                color: red;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>레드향</h1>
            <p>껍질에 붉은 빛이 돌아 레드향이라 불린다.</p>
            <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
            <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
        </div>
    </body>
</html>
