<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>상품 소개 페이지</title>
    <!--
        클래스 선택자 class속성에 설정된 값값
            - 클래스 선택자
                HTML 태그에 class="값"이 작성된, 특정 그룹에 속하는 태그들만 선택하는 선택자
            
            - 문법
                .클래스값 {
                    속성명: 설정값;
                }
            
            - 설명
                .           : class속성에 설정된 값으로 HTML 태그를 선택해서 가져온다.
                .클래스값   : class 속성에 설정된 값이 클래스값 자리에 작성된 HTML 태그 하나 이상을 선택해서 가져온다
                .클래스값 {
                }           : class 속성에 설정된 값이 클래스값 자리에 작성된 HTML 태그 하나 이상을 선택해서 스타일 설정 하겠다.

            - 더 간단히 설명
                .           : class=, class 속성
                .클래스값   : class=클래스값 이라고 작성된 HTML 태그 하나 이상 선택
                .클래스값 {
                }           : class=클래스값 이라고 작성된 HTMl 태그 하나 이상 선택해서 스타일 설정 하겠다.
    -->
    <style>
      p {
        font-style: italic;
      }
      /*
        클래스 선택자 .accent
            - HTML 태그에 class="accent" 라고 작성되어 있는 요소 전부를 선택
            - h1, span 요소가 class="accent" 이므로 둘 다 선택 됨
      */
      .accent {
        border: 1px dotted black; /* 바깥 테두리 선 굵기 1px, 선 종류 점선, 선 색상 검은색 */
        background-color: grey; /* 배경색 회색 */
      }
      /* 
        class 속성에 대한 값으로 h1 요소만 선택 
          .       class 속성에 대한
          .bg     class 속성에 대한, class 속성값이 bg라고 작성된 요소만 선택
          .bg {}  class 속성에 대한, class 속성값이 bg라고 작성된 요소만 선택 해서 { } 사이에 스타일 정의
      */
      .bg {
        font-size: 100px; /* 글자 크기 100px */
        color: red; /* 글자 색상 빨간색 */
      }
    </style>
  </head>
  <body>
    <div>
      <h1 class="accent bg">레드향</h1>
      <p>껍질에 붉은 빛이 돌아 <span class="accent">레드향</span>이라 불린다.</p>
      <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
      <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
    </div>
  </body>
</html>
