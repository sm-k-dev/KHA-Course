<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>상품 소개 페이지</title>
        <!-- CSS 코드 작성 방법 2 : 내부 스타일시트 작성 방법
                                    확장자가 .html인 문서 내부의 <head></head> 태그 사이에 
                                    <style></style> 선언문 태그를 작성 해 두고
                                    사이에 css 코드를 작성하는 방법
        -->
        <style>
            /*
                CSS 코드 작성 문법
                    html태그를 다양하게 선택할 수 있게 하는 문법 {
                        속성명1: 속성에 설정할 값;
                    }
            */

            /* h1 태그명 선택자로 <h1>레드향</h1> 태그를 선택해서 가져와 {} 사이의 스타일을 적용하겠다. */
            h1 {
                background-color: grey; /* 선택한 h1 태그 영역의 배경색을 회색으로 설정 */
                color: white; /* 선택한 h1 태그 영역의 작성된 텍스트 색상을 하얀색으로 설정 */
                padding: 10px; /* 선택한 h1 태그 영역의 작성된 텍스트 기준으로 안쪽 여백 모두를 10px 만큼 띄워줌 */
                margin: 10.44px 21.44px 10.44px 21.44px
            }
        </style>
    </head>
    <body>
        <h1>레드향</h1>
        <p>껍질에 붉은 빛이 돌아 레드향이라 불린다.</p>
        <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
        <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
    </body>
</html>
