<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>
  <!--
        전체 선택자 * (Asterisk)
            - html 파일에 작성된 모든 태그(요소)를 한번에 선택해오는 선택자 기호
            - 기본 작성 문법
                *{
                    속성명: 설정값;
                }
    -->
  <style>
    * {
      /* 
                    margin, padding 설정값:
                    한번만 쓰면 위/오른쪽/아래/왼쪽 모두 같은 값으로 변경되고
                    하나하나 네번 쓰게 되면 위 오른쪽 아래 왼쪽 순으로 적용된다. 
                */
                /*
                    html 파일에 작성된 모든 태그들을 한번에 선택해
                    모든 태그의 '바깥 여백(margin)을 0으로 설정'
                    -> 브라우저가 자동으로 넣는 기본 
                */
      margin:0;
      padding:0;
    }
  </style>
</head>
<body>
  <img src="images/cat.jpg">
</body>
</html>
