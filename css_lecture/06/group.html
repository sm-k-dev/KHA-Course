<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>상품 소개 페이지</title>
    <style>
      /* 
      h1 {
        text-align:center;
      }      
      p {
        text-align:center;
      } 
      */

      /*  
        , : 그룹 선택자(다중 선택자) 기호
        
        태그명, 태그명2, 태그명3 {
          공통 스타일 설정
          속성1: 속성값1-1 속성값1-2 속성값1-3;
          속성2: 속성값2;
        }
        
        #id속성값, .class속성값, 태그명 {
          공통 스타일 설정
          속성1: 속성값1-1 속성값1-2 속성값1-3;
          속성2: 속성값2;
        }
      */
      h1, p {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>레드향</h1>
      <p>껍질에 붉은 빛이 돌아 <span class="accent">레드향</span>이라 불린다.</p>
      <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
      <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
    </div>
  </body>
</html>
