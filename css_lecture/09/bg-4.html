<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>배경 이미지</title>
  <style>
    #container{
      width:1100px;
      margin:50px auto;
    }
    .box{
      float:left;
      border:1px solid #222;
      width:300px;
      height:300px;      
      margin:20px;
      background:url('images/bg4.jpg') no-repeat left top;
    }

    
      /* ====== #bg1 ======
        background-size: auto;
        - 'auto'는 기본값(이미지의 원래 크기)으로 표시함.
        - 이미지가 원래 크기로 들어가기 때문에 박스보다 크면 잘려 보이고,
          박스보다 작으면 박스 안의 왼쪽 상단에 그대로 놓인다(여백 발생).
      */
      #bg1 {
        background-size: auto; /* 원래 배경이미지 크기로 표시  */
      }
      
      /* ====== #bg2 ======
        background-size: 200px;
        - 단일 값(여기서는 200px)은 "너비"를 의미. 높이는 자동으로 원본 비율(종횡비)을 유지해서 계산.
        - 결과: 배경 이미지 너비가 200px로 강제되고 높이는 비율대로 줄어듦.
      */
      #bg2 {
        background-size: 200px; /* 너비는 200px, 높이는 자동계산 */
      }

      /* ====== #bg3 ======
        background-size: 50%;
        - 퍼센트 값은 해당 패딩 박스(일반적으로 요소의 크기)를 기준으로 한 비율.
        - 단일 퍼센트 값은 "너비"로 해석되고, 높이는 자동 비율 유지.
        - 예: 박스 너비 300px이면 배경 너비는 150px이 됨.
      */
      #bg3 {
        background-size: 50%; /* 배경 이미지 너비는 div요소 너비의 50% */
      }

      /* ====== #bg4 ======
        background-size: 50% 50%;
        - 두 개의 값(가로 세로)을 지정한 경우, 각각 너비와 높이를 지정.
        - 첫 번째 50%는 박스 너비의 50%, 두 번째 50%는 박스 높이의 50%가 됨.
        - 이 경우 이미지의 종횡비(비율)가 유지되지 않을 수 있음(이미지 왜곡 가능).
      */
      #bg4 {
        background-size: 50% 50%; /* 배경 이미지 너비와 높이 각각 지정 */
      }

      /* ====== #bg5 ======
        background-size: contain;
        - contain: 이미지의 **전체가 보이도록** 가능한 크게(또는 작게) 맞춤.
        - 종횡비(비율)는 유지된다.
        - 그러나 요소의 가로/세로 공간 중 한쪽에 빈 공간(여백)이 생길 수 있음(이미지 전부 보여주려면 여백 허용).
      */
      #bg5 {
        background-size: contain; /* div요소 안에 배경이미지가 다 보이도록 표시 */
      }

      /* ====== #bg6 ======
        background-size: cover;
        - cover: 요소를 **완전히 덮도록** 이미지 크기를 확대(또는 축소) 한다.
        - 종횡비는 유지되지만, 요소를 완전히 채우기 위해 이미지의 일부가 잘릴(크롭될) 수 있음.
        - 반응형 배경에 많이 쓰이는 값(가로세로 전부 채우고 싶을 때).
      */
      #bg6 {
        background-size: cover; /* div요소를 완전히 덮도록 배경이미지 표시 */
      }
  </style>
</head>
<body>
  <div id="container">
    <div class="box" id="bg1"></div>
    <div class="box" id="bg2"></div>
    <div class="box" id="bg3"></div>
    <div class="box" id="bg4"></div>
    <div class="box" id="bg5"></div>
    <div class="box" id="bg6"></div>
  </div>
 </body>
</html>
