<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>배경 이미지</title>
  <style>
 /*
      ============================
      배경 이미지 속성 설명
      ============================

      ① 선택한 웹 요소에 배경 이미지를 넣는 속성: background-image

         문법)
             background-image: url('이미지 파일이 저장된 경로');

             ※ 경로 작성법

                - 상대 경로: 현재 HTML파일 기준으로 위치를 지정
                  예) ./images/bg.jpg

                - 절대 경로: 컴퓨터·웹서버상 전체 경로를 지정
                  예) https://example.com/bg.jpg

      ② 배경 이미지가 어떻게 반복될지를 지정하는 속성: background-repeat

         문법)
             background-repeat: 값;

             - repeat    : 가로, 세로 모두 화면 가득 찰 때까지 반복 (기본값)
             - repeat-x  : 가로 방향으로만 반복
             - repeat-y  : 세로 방향으로만 반복
             - no-repeat : 이미지를 한 번만 표시(반복 안 함)
      */

    body {
      background-image :url('./images/bg1.jpg');
       /* 
          현재 HTML파일이 있는 폴더에서 
          ./images/bg1.jpg 파일을 찾아 배경으로 사용
        */
      background-repeat:  repeat;
        /* 
          배경 이미지를 한 번만 보여주고 반복하지 않도록 설정 
        */
    }
  </style>
</head>
<body>
      <!-- 
      body 영역에 별도의 콘텐츠는 없지만
      CSS에서 body 전체에 배경 이미지가 들어가도록 설정해둠
    -->
</body>
</html>
