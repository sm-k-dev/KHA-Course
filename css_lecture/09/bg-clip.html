<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>
  <style>

      /* 
        .desc (class="desc") 라는 클래스를 가진 모든 div에 적용할 공통 스타일 
        (세 박스 모두 같은 틀을 가짐)
      */
    .desc {
      border:5px dotted #222; /* 5픽셀 두께의 점선 테두리 (검은색 계열) */
      background-color:pink;  /* 박스 내부의 기본 배경색을 분홍색으로 */
      width:350px;              /* 박스 가로폭 350픽셀 */
      padding:20px;             /* 박스 안쪽 여백 20픽셀 (내용과 테두리 사이 공간) */
      margin-right:20px;        /* 박스 사이 오른쪽 간격 20픽셀 */
      float:left;               /* 왼쪽부터 차례대로 나란히 왼쪽 정렬 배치 */
    }
    
      /* 
        각 박스마다 background-clip 속성만 다르게 설정 
      */
    
      #clip-border {
        /* 
          첫번째 div에 적용
          background-clip: border-box → 기본값
          배경색(pink)이 테두리(border)까지 모두 채워짐 
        */
        background-clip: border-box;
      }

      #clip-padding {
        /* 
          두번째 div에 적용
          background-clip: padding-box
          배경색(pink)이 '테두리 영역을 제외한' 패딩 영역까지만 채워짐
          → 테두리 뒤쪽은 흰색으로 보임 
        */
        background-clip: padding-box;
      }

      #clip-content {
        /* 
          세번째 div에 적용
          background-clip: content-box
          배경색(pink)이 '콘텐츠 영역(글자가 있는 부분)'까지만 채워짐
          → 패딩과 테두리 영역 뒤쪽은 흰색으로 보임
        */
        background-clip: content-box;
      }

  </style>
</head>
<body>
  <div id="container">
    <div class="desc" id="clip-border">
      <h1>레드향</h1>
      <p>껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다.</p>
      <p>레드향은 <em>한라봉과 귤을 교배</em>한 것으로<br>일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    </div>
    <div class="desc" id="clip-padding">
      <h1>레드향</h1>
      <p>껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다.</p>
      <p>레드향은 <em>한라봉과 귤을 교배</em>한 것으로<br>일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    </div>
    <div class="desc" id="clip-content">
      <h1>레드향</h1>
      <p>껍질에 붉은 빛이 돌아 <b>레드향</b>이라 불린다.</p>
      <p>레드향은 <em>한라봉과 귤을 교배</em>한 것으로<br>일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    </div>        
  </div>
</body>
</html>
