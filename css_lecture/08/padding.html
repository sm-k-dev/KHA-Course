<!DOCTYPE html>
<html lang="ko">
	<head>
	<meta charset="UTF-8">
	<title>박스 모델 - 패딩</title>
	<style>
			h1 {
				display:inline-block;
				border:1px solid #000;
			}

			/*
				패딩 padding 속성은 콘텐츠 영역과 테두리 사이의 여백. 
				1~4개의 값을 가질 수 있다. 크기 or 백분율 값이 올 수 있다. 크기 단위는 px, em, rem 등이 있다.
					1개 : 모든 방향에 동일한 패딩이 적용된다.
					2개 : 첫 번째 값은 상하, 두 번째 값은 좌우에 적용된다.
					3개 : 첫 번째 값은 상, 두 번째 값은 좌우, 세 번째 값은 하에 적용된다.
					4개 : 시계방향으로 상, 우, 하, 좌에 적용된다.
					1~4개의 값이 모두 동일한 경우에는 하나의 값으로 줄일 수 있다.
				padding-top, padding-right, padding-bottom, padding-left 속성은 각각의 방향에 패딩을 적용할 때 사용한다.
			*/
			#padding1 { 
				padding:20px 30px 40px 50px;  
			}
			#padding2 {
				padding:20px 30px;
			}
			#padding3 {
				padding:20px;
			}
	</style>
	</head>
	<body>
		<h1>레드향</h1>
				<h1 id="padding1">레드향</h1>
				<h1 id="padding2">레드향</h1>
				<h1 id="padding3">레드향</h1>
	</body>
</html>
