<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>박스모델</title>
    <style>
      /*
        width:400px;  => 고정된 너비
        width:50%;    => 부모 요소의 너비의 50% (반응형 웹 디자인에 유용)
        width:auto;   => 콘텐츠의 너비에 따라 자동으로 조절 (기본값)
        width:fit-content; => 콘텐츠의 너비에 맞게 조절 (최소한의 너비로 설정)
      */
      div {
        border:2px solid #000;
        margin-bottom: 20px;
        /*
          모든 div 요소에 공통적으로 적용
          테두리: 2px solid #000;
        */
      }
      .box1 {
        width:400px;
        height:100px;
      }
      .box2 {
        width:50%;
        height:100px;
      }
    </style>
  </head>
  <body>
    <div class="box1"></div>
    <div class="box2"></div>
  </body>
</html>
