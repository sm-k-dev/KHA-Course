<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>박스모델 - 마진</title>
    <style>
      div {
        width:200px;
        height:100px;
        display:inline-block;
        border:1px solid #222;
      }
      /*
        margin 속성은 테두리 바깥 영역의 여백. 1~4개의 값을 가질 수 있다. 
        크기 or 백분율 or auto 값이 올 수 있다. 크기 단위는 px, em, rem 등이 있다. auto는 수평 방향에서만 사용할 수 있다.
          1개 : 모든 방향에 동일한 마진이 적용된다.
          2개 : 첫 번째 값은 상하, 두 번째 값은 좌우에 적용된다.
          3개 : 첫 번째 값은 상, 두 번째 값은 좌우, 세 번째 값은 하에 적용된다.
          4개 : 시계방향으로 상, 우, 하, 좌에 적용된다.
          1~4개의 값이 모두 동일한 경우에는 하나의 값으로 줄일 수 있다.
        
        margin-top, margin-right, margin-bottom, margin-left 속성은 각각의 방향에 마진을 적용할 때 사용한다.
      */
      #margin1 {
        margin:50px;
      }
      #margin2 {
        margin:30px 50px
      }
      #margin3 {
        margin:30px 20px 50px
      }
      #margin4 {
        margin:30px 50px 30px 50px;
      }
      #margin5{
        margin-right:20px;    
      }
    </style>
  </head>
  <body>
    <div id="margin1"></div>
    <div id="margin2"></div>
    <div id="margin3"></div>
    <div id="margin4"></div>
    <div id="margin5"></div>
  </body>
</html>
