<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>박스모델</title>
		<style>
			/*
				border-color 속성은 테두리의 색상을 지정하는 데 사용됩니다.
				border-top-color, border-right-color, border-bottom-color, border-left-color 속성을 사용하여 각 면의 테두리 색상을 개별적으로 설정할 수 있습니다.
				border-style 속성은 테두리의 스타일을 지정하는 데 사용됩니다.
			*/
			div {
				width:200px;
				height:100px;
				display:inline-block;
				margin:15px;			
				border-style:dashed;  /* 테두리 스타일 - 선으로 된 점선 */
				border-width:2px; /* 테두리 굵기 - 2px */
			}
			#box1 { border-color:red;	}  /* 전체 테두리 - 빨강 */
			#box2 { 
				border-top-color:blue; /* 위쪽 테두리 - 파랑 */
				border-left-color:red;  /* 왼쪽 테두리 - 빨강 */
			} 
		</style>
	</head>
	<body>
		<div id="box1"> </div>
		<div id="box2"> </div>	
	</body>
</html>
