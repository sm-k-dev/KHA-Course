<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>박스모델</title>
		<style>
			/*
				border-style: solid | dotted | dashed | double | groove | ridge | inset | outset | none | hidden;
					solid: 실선
					dotted: 점선
					dashed: 짧은 점선
					double: 이중선
					groove: 음각 효과의 선
					ridge: 양각 효과의 선
					inset: 요소 내부로 들어간 효과의 선
					outset: 요소 밖으로 나온 효과의 선
					none: 테두리 없음 (기본값)
					hidden: 테두리 없음 (none과 동일하지만, 표에서는 다르게 처리됨)
				예시:
				border-style: solid;  => 실선 테두리
				border-style: dotted;  => 점선 테두리
				border-style: dashed;  => 짧은 점선 테두리
				border-style: double;  => 이중선 테두리
				border-style: groove;  => 음각 효과의 테두리
				border-style: ridge;   => 양각 효과의 테두리
				border-style: inset;   => 요소 내부로 들어간 효과의 테두리
				border-style: outset;  => 요소 밖으로 나온 효과의 테두리
				border-style: none;    => 테두리 없음
				border-style: hidden;  => 테두리 없음 (표에서는 다르게 처리됨)
				border-width와 함께 사용하여 다양한 스타일을 만들 수 있음.
			*/
			div {
				width:200px;
				height:100px;
				display:inline-block;
				margin:15px;	
				text-align: center;
				font-size:20px;
				line-height:100px;		
				border-width:5px;  /* 테두리 굵기 */
			}
			#box1 { border-style:solid; }  /* 실선 */
			#box2 { border-style:dotted; }  /* 점선 */
			#box3 { border-style:dashed; }  /* 짧은 점선 */
		</style>
	</head>
	<body>
		<div id="box1"> 실선 테두리 </div>
		<div id="box2"> 점선 테두리 </div>
		<div id="box3"> 점선 테두리</div>
	</body>
</html>
