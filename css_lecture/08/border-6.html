<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>박스모델</title>
		<style>
			/*
				border-radius 속성을 사용하여 이미지를 원 형태로 만들 수 있다.
				이미지 요소의 너비와 높이를 동일하게 설정한 후, border-radius의 반지름값을 너비나 높이의 50%로 지정하면 완벽한 원이 된다.
				이 방법은 프로필 사진이나 아이콘 등에서 자주 사용된다.

				ex) 너비와 높이가 각각 300px인 이미지의 테두리를 둥글게 처리하려면
					border-radius: 50%; or border-radius: 150px; (너비나 높이의 절반)
			*/
			#circle {
				border-radius:50%;  /* 테두리를 원으로 */
			}    
		</style>
	</head>
	<body>
		<img src="images/photo.jpg">
		<img id="circle" src="images/photo.jpg">
	</body>
</html>
