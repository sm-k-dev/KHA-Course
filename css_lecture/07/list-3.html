<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>불릿 이미지 사용하기</title>
    <style>
      /*
        list-style-position 속성은 목록의 들여쓰기 방식을 설정하는 속성입니다.
        기본값은 outside로, 불릿이 목록 항목의 왼쪽에 위치합니다. 
        inside로 설정하면 불릿이 목록 항목의 내부에 위치하게 됩니다.
      */
      /*
        list-style 속성을 사용하면
        list-style-type, list-style-image, list-style-position 속성을 한 번에 설정할 수 있습니다.
      */
      /* -----------------------
        .inside 클래스 선택자: 목록 들여쓰기 조정
      ------------------------*/
      .inside {
        list-style-position: inside;  /* 목록 들여쓰기 */
        /* list-style-position → 리스트 항목 글머리표 위치 지정
        값 inside → 글머리표(불릿)가 텍스트 안쪽으로 들어가서 
                    항목 첫 글자와 같은 줄에 표시
        기본값은 outside → 글머리표가 텍스트 바깥쪽, 들여쓰기 효과 발생
        → 클래스 적용 시 글머리표가 글자와 같은 위치에서 시작 */
      } 
    </style>
  </head>
  <body>
    <h1>도서 시리즈</h1>
    <ul>
      <li>Do it! 시리즈</li>
      <li>된다 시리즈</li>
      <li>DCM 프로 사진가</li>
    </ul>

    <ul class="inside">
      <li>Do it! 시리즈</li>
      <li>된다 시리즈</li>
      <li>DCM 프로 사진가</li>
    </ul>
  </body>
</html>
