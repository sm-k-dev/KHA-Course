<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>텍스트 스타일</title>
    <style>
      /*
        letter-spacing 속성은 텍스트의 글자 간격을 조절하는 속성입니다.
        letter-spacing: 간격값;
        간격값은 px, em, rem 등의 단위를 사용할 수 있습니다. 양수 값은 글자 사이를 넓히고, 음수 값은 글자 사이를 좁힙니다.
      */
      p {
        font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        font-size:80px;
        text-shadow:3px 3px 1px #ccc;  /* 오른쪽 아래로 파란색 그림자 */
      }
      .spacing1 {
        letter-spacing:0.2em;  
        /* 
          글자 간격 0.2em
          em 단위는 현재 요소의 글자 크기를 기준으로 하는 상대 단위입니다.
          예를 들어, 글자 크기가 16px인 경우 0.2em은 3.2px에 해당합니다.
        */
      }
      .spacing2 {
        letter-spacing:0.5em;  /* 글자 간격 0.5em */
      }      
    </style>
  </head>
  <body>
    <p>CSS</p> 
    <p class="spacing1">CSS</p>
    <p class="spacing2">CSS</p>
  </body>
</html>
