<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>text-shadow</title>
  <style>
    /*
      text-shadow 속성은 텍스트에 그림자를 추가하는 속성입니다.
      text-shadow: 수평거리 수직거리 흐림반경 색상;
      수평거리(가로 거리): 그림자의 수평 위치를 지정합니다. 양수는 오른쪽, 음수는 왼쪽으로 이동합니다.
      수직거리(세로 거리): 그림자의 수직 위치를 지정합니다. 양수는 아래로, 음수는 위로 이동합니다.
      흐림반경: 그림자의 흐림 정도를 지정합니다. 값이 클수록 그림자가 더 흐릿해집니다. (선택 사항)
      색상: 그림자의 색상을 지정합니다. (선택 사항)
    */
    h1 { 
      font-size:60px;
    } 
    .shadow1 {
      color:red;
      text-shadow:1px 1px black;
    }
    .shadow2 {
      text-shadow:5px 5px 3px #ffa500;
    }
    .shadow3 {
      color:#fff;
      text-shadow:7px -7px 20px #000;
    }
  </style>
</head>
<body>
  <h1 class="shadow1">HTML</h1> 
  <h1 class="shadow2">CSS</h1>
  <h1 class="shadow3">자바스크립트</h1>
</body>
</html>
