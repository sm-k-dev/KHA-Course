<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>line-height</title>
    <style>
      p {
        width:600px;
        border:1px solid #222;
        padding:10px;
        margin:10px;
      }
      /*
        line-height 속성은 텍스트의 줄 간격을 설정하는 속성입니다.
          normal: 기본 줄 간격을 사용합니다. (기본값)
          number: 숫자 값을 사용하여 줄 간격을 설정합니다. (예: 1.5, 2)
          length: 길이 단위를 사용하여 줄 간격을 설정합니다. (예: 20px, 1em)
          percentage: 백분율 값을 사용하여 줄 간격을 설정합니다. (예: 150%)
      */
      .small-line {
        /* 윗 줄 아래 간격을 글자 크기의 0.7배로 설정 */
        line-height:0.7;
      }
      .big-line {
        /* 윗 줄 아래 간격을 글자 크기의 2.5배로 설정 */
        line-height:2.5;
      }
    </style>
  </head>
  <body>    
    <p>껍질에 붉은 빛이 돌아 레드향(감평甘平)이라 불린다. 레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <p class="small-line">껍질에 붉은 빛이 돌아 레드향(감평甘平)이라 불린다. 레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <p class="big-line">껍질에 붉은 빛이 돌아 레드향(감평甘平)이라 불린다. 레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
  </body>
</html>
